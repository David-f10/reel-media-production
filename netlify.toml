[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Filet de sécurité téléchargement : referme toute permission Drive "anyone" restée
# ouverte (registre Blobs drive-open-perms + rattrapage), toutes les 10 minutes.
[functions."drive-permsweep"]
  schedule = "*/10 * * * *"

# Archivage automatique PAD + rattrapage du fonds ancien : datation (last_edited_time) des
# PAD sans date de diffusion, puis archivage des PAD diffusées depuis > 30 jours.
# ⚠️ TEMPORAIRE : cadence 10 min pour drainer le fonds de 217 cartes (80/passe).
# REMETTRE "0 3 * * *" (chaque nuit à 3h) une fois le drainage terminé.
[functions."pad-sweep"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
