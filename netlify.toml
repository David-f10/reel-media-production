[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Filet de sécurité téléchargement : referme toute permission Drive "anyone" restée
# ouverte (registre Blobs drive-open-perms + rattrapage), toutes les 10 minutes.
[functions."drive-permsweep"]
  schedule = "*/10 * * * *"

# Archivage automatique PAD : archivage des PAD diffusées depuis > 30 jours (passe 2, le but,
# en premier), puis datation (last_edited_time) des PAD anciennes sans date (passe 1). Passes à
# flags de rate-limit indépendants. Statut écrit dans une ligne Notion dédiée. Chaque nuit à 3h.
[functions."pad-sweep"]
  schedule = "0 3 * * *"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
