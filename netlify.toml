[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Filet de sécurité téléchargement : referme toute permission Drive "anyone" restée
# ouverte (registre Blobs drive-open-perms + rattrapage), toutes les 10 minutes.
[functions."drive-permsweep"]
  schedule = "*/10 * * * *"

# Archivage automatique PAD + rattrapage du fonds ancien : datation (last_edited_time) des
# PAD sans date de diffusion, puis archivage des PAD diffusées depuis > 30 jours. Chaque nuit à 3h.
[functions."pad-sweep"]
  schedule = "0 3 * * *"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
