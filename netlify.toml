[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Filet de sécurité téléchargement : referme toute permission Drive "anyone" restée
# ouverte (registre Blobs drive-open-perms + rattrapage), toutes les 10 minutes.
[functions."drive-permsweep"]
  schedule = "*/10 * * * *"

# Archivage automatique PAD : archivage des PAD diffusées depuis > 30 jours (passe 2, le but,
# en premier), puis datation (last_edited_time) des PAD anciennes sans date (passe 1). Passes à
# flags de rate-limit indépendants. Statut écrit dans une ligne Notion dédiée. Chaque nuit à 3h.
[functions."pad-sweep"]
  schedule = "0 3 * * *"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sécurité (publish = "."). Ne JAMAIS servir en statique la SOURCE des fonctions, la config, les
# dépendances ni les docs internes. force = true pour masquer même les fichiers qui existent.
# ⚠️ /netlify/* = la SOURCE ; l'INVOCATION se fait sur /.netlify/functions/* (AVEC point) — chemin
# distinct, jamais touché par ces règles. Ne touchent pas non plus index.html, review.html, /css/*,
# layout.css, sw.js, manifest.json, offline.html ni les icônes (.png).
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Netlify n'a pas de glob par extension (le splat ne vaut qu'en FIN de chemin) : chaque fichier
# sensible de la racine est donc nommé LITTÉRALEMENT. CONTEXT_REEL_MEDIA.md est le seul .md à la racine.
[[redirects]]
  from = "/CONTEXT_REEL_MEDIA.md"
  to = "/404.html"
  status = 404
  force = true
