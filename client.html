<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace client · Réel Média</title>
  <!-- Lot G tranche 1 — socle BRUT. CSS inline minimal, ISOLÉ (pas le design system de l'app des sept).
       N'enregistre PAS le service worker (les clients restent SW-free). Un seul appel au chargement,
       pas de polling. Les trois états se distinguent : liste / vide calme / indisponible réessayable. -->
  <style>
    :root { --txt:#1a1a1a; --mut:#6b7280; --bord:#d1d5db; --amb:#b45309; --amb-bg:#fff7ed; --amb-bord:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--txt);
           background:#fafafa; line-height:1.5; }
    .wrap { max-width:560px; margin:0 auto; padding:24px 16px; }
    h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
    .sub { color:var(--mut); font-size:13px; margin:0 0 20px; }
    .champ { display:block; margin:0 0 12px; }
    .champ span { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; }
    input { width:100%; font-size:15px; padding:9px 10px; border:1px solid var(--bord); border-radius:8px; }
    .coderow { display:flex; gap:8px; }
    .coderow input { flex:1; }
    button { font-size:14px; padding:9px 14px; border-radius:8px; border:1px solid var(--bord);
             background:#fff; color:var(--txt); cursor:pointer; }
    button.primary { background:#111; color:#fff; border-color:#111; width:100%; margin-top:4px; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .ligne-aide { font-size:12px; color:var(--mut); margin-top:14px; }
    .msg { font-size:13px; margin-top:12px; min-height:18px; }
    .msg.err { color:#b91c1c; }        /* 401 : correction neutre */
    .msg.wait { color:var(--amb); }    /* 429/503 : service / attente */
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar .id { font-size:13px; color:var(--mut); }
    ul.projets { list-style:none; padding:0; margin:0; }
    ul.projets li { padding:10px 12px; border:1px solid var(--bord); border-radius:8px; margin-bottom:8px;
                    background:#fff; display:flex; gap:10px; }
    ul.projets li .code { font-family: ui-monospace, Menlo, monospace; font-size:13px; color:var(--mut); min-width:54px; }
    /* VIDE : calme et affirmatif, aucune alarme, aucun bouton. */
    .etat-vide { color:var(--mut); font-style:italic; padding:16px 0; }
    /* INDISPO : alerte visuellement distincte + réessayer. */
    .etat-indispo { border:1px solid var(--amb-bord); background:var(--amb-bg); color:var(--amb);
                    border-radius:8px; padding:14px; }
    .etat-indispo button { margin-top:10px; border-color:var(--amb-bord); color:var(--amb); background:#fff; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Chargement initial (anti-flash login→accueil) -->
    <div id="vue-chargement">
      <p class="sub">Chargement…</p>
    </div>

    <!-- Écran 04 — connexion (aucune marque affichée ici) -->
    <div id="vue-login" class="hidden">
      <h1>Espace client</h1>
      <p class="sub">Réel Média</p>
      <form id="form-login" autocomplete="off">
        <label class="champ"><span>Votre mail</span>
          <input id="in-mail" type="email" autocomplete="username" required></label>
        <label class="champ"><span>Votre code</span>
          <span class="coderow">
            <input id="in-code" type="password" autocomplete="off" required>
            <button type="button" id="btn-voir">Afficher</button>
          </span></label>
        <button type="submit" class="primary" id="btn-login">Se connecter</button>
      </form>
      <div id="msg-login" class="msg" role="status" aria-live="polite"></div>
      <p class="ligne-aide">Code oublié ? Contactez votre interlocuteur habituel chez Réel Média.</p>
    </div>

    <!-- Écran 05 — accueil + projets -->
    <div id="vue-accueil" class="hidden">
      <div class="topbar">
        <h1 id="titre-projets">Vos projets</h1>
        <span class="id"><span id="bonjour"></span> · <a href="#" id="lien-deco">Déconnexion</a></span>
      </div>
      <div id="zone-projets" role="status" aria-live="polite"></div>
    </div>

  </div>

  <script src="/client-etat.js"></script>
  <script>
  (function () {
    var LOGIN = '/.netlify/functions/login-client';
    var PROJETS = '/.netlify/functions/projets-client';
    var K_MAIL = 'rmc-mail', K_CODE = 'rmc-code', K_NOM = 'rmc-nom', K_MARQUE = 'rmc-marque';

    var $ = function (id) { return document.getElementById(id); };
    function montrer(vue) {
      ['vue-chargement', 'vue-login', 'vue-accueil'].forEach(function (v) { $(v).classList.add('hidden'); });
      $(vue).classList.remove('hidden');
    }
    function lire(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function ecrire(o) { try { Object.keys(o).forEach(function (k) { localStorage.setItem(k, o[k]); }); } catch (e) {} }
    function effacer() { try { [K_MAIL, K_CODE, K_NOM, K_MARQUE].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // ── Connexion ──
    $('btn-voir').addEventListener('click', function () {
      var c = $('in-code');
      var show = c.type === 'password';
      c.type = show ? 'text' : 'password';
      this.textContent = show ? 'Masquer' : 'Afficher';
    });

    $('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      var mail = $('in-mail').value.trim();
      var code = $('in-code').value;
      var msg = $('msg-login');
      msg.className = 'msg'; msg.textContent = '';
      $('btn-login').disabled = true;
      fetch(LOGIN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mail: mail, code: code })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b, retry: r.headers.get('Retry-After') }; });
      }).then(function (res) {
        $('btn-login').disabled = false;
        if (res.status === 200 && res.body && res.body.ok) {
          ecrire(fromLogin(mail, code, res.body));
          entrerAccueil();
          return;
        }
        if (res.status === 429) { msg.className = 'msg wait'; msg.textContent = 'Trop de tentatives, réessayez dans ' + (res.retry || 'un instant') + (res.retry ? ' s.' : '.'); return; }
        if (res.status === 503) { msg.className = 'msg wait'; msg.textContent = 'Service temporairement indisponible, réessayez.'; return; }
        msg.className = 'msg err'; msg.textContent = 'Mail ou code incorrect.'; // 401 ou autre : générique
      }).catch(function () {
        $('btn-login').disabled = false;
        var m = $('msg-login'); m.className = 'msg wait'; m.textContent = 'Service temporairement indisponible, réessayez.';
      });
    });
    function fromLogin(mail, code, b) { var o = {}; o[K_MAIL] = mail; o[K_CODE] = code; o[K_NOM] = b.nom || ''; o[K_MARQUE] = b.marque || ''; return o; }

    // ── Accueil + projets ──
    $('lien-deco').addEventListener('click', function (e) { e.preventDefault(); effacer(); allerLogin(''); });

    function allerLogin(notice) {
      $('msg-login').className = notice ? 'msg wait' : 'msg';
      $('msg-login').textContent = notice || '';
      $('in-code').value = '';
      montrer('vue-login');
    }

    function entrerAccueil() {
      var nom = lire(K_NOM), marque = lire(K_MARQUE);
      $('bonjour').textContent = nom ? ('Bonjour ' + nom) : '';
      $('titre-projets').textContent = marque ? ('Vos projets · ' + marque) : 'Vos projets';
      montrer('vue-accueil');
      chargerProjets();
    }

    function chargerProjets() {
      var zone = $('zone-projets');
      zone.innerHTML = '<p class="sub">Chargement…</p>';
      fetch(PROJETS, {
        method: 'POST',
        headers: { 'x-rmc-mail': lire(K_MAIL), 'x-rmc-code': lire(K_CODE) }
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; });
      }).then(function (res) {
        rendre(etatDepuisReponse(res.status, res.body), res.body);
      }).catch(function () {
        rendre('INDISPO', null); // réseau tombé → INDISPO (réessayable), JAMAIS « aucun projet »
      });
    }

    function rendre(etat, body) {
      var zone = $('zone-projets');
      if (etat === 'EXPIRE') { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
      if (etat === 'LISTE') {
        var items = body.projets.map(function (p) {
          return '<li><span class="code">' + esc(p.code) + '</span><span>' + esc(p.titre) + '</span></li>';
        }).join('');
        zone.innerHTML = '<ul class="projets">' + items + '</ul>';
        return;
      }
      if (etat === 'VIDE') { // calme et affirmatif, pas de bouton, pas d'alarme
        zone.innerHTML = '<div class="etat-vide">Aucun projet disponible pour le moment.</div>';
        return;
      }
      // INDISPO : alerte distincte + réessayer (jamais une liste vide ici)
      zone.innerHTML = '<div class="etat-indispo">Service temporairement indisponible.' +
        '<div><button type="button" id="btn-reessayer">Réessayer</button></div></div>';
      $('btn-reessayer').addEventListener('click', chargerProjets);
    }

    // ── Démarrage : projets-client est la source de vérité (re-vérifie l'identité). ──
    if (lire(K_MAIL) && lire(K_CODE)) entrerAccueil();
    else montrer('vue-login');
  })();
  </script>
</body>
</html>
