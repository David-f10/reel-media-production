  <script src="/client-etat.js"></script>
  <script>
  (function () {
    var LOGIN = '/.netlify/functions/login-client';
    var ESPACE = '/.netlify/functions/espace-client'; // accueil B2 (remplace l'appel projets-client du front)
    var MONTAGE = '/.netlify/functions/montage-client';
    var DRIVEVIEW = '/.netlify/functions/drive-view-client';       // repli iframe (bureau) uniquement, étape 2
    var STREAMOPEN = '/.netlify/functions/drive-stream-open';      // mint du cookie de flux (lecteur natif)
    var STREAM = '/.netlify/functions/drive-stream';               // relais Range (le <video> pointe ici ; aucun id dans l'URL)
    var DOWNLOAD = '/.netlify/functions/drive-download-client';
    var VALIDER = '/.netlify/functions/valider-client';
    var K_TOKEN = 'rmc-token', K_NOM = 'rmc-nom', K_MARQUE = 'rmc-marque';
    var K_LEGACY = ['rmc-mail', 'rmc-code']; // F1 : anciennes clés (code en clair) — purgées, plus jamais écrites

    var $ = function (id) { return document.getElementById(id); };
    function montrer(vue) {
      ['vue-chargement', 'vue-login', 'vue-accueil', 'vue-montage'].forEach(function (v) { $(v).classList.add('hidden'); });
      $(vue).classList.remove('hidden');
    }
    function lire(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function ecrire(o) { try { Object.keys(o).forEach(function (k) { localStorage.setItem(k, o[k]); }); } catch (e) {} }
    function effacer() { try { [K_TOKEN, K_NOM, K_MARQUE].concat(K_LEGACY).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    // esc() n'échappe PAS les guillemets (spec §8) → escAttr pour les valeurs serveur en position d'ATTRIBUT.
    function escAttr(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // ── Connexion ──
    $('btn-voir').addEventListener('click', function () {
      var c = $('in-code');
      var show = c.type === 'password';
      c.type = show ? 'text' : 'password';
      this.textContent = show ? 'Masquer' : 'Afficher';
    });

    $('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      var mail = $('in-mail').value.trim();
      var code = $('in-code').value.trim(); // trim comme le mail : un espace collé au copier-coller ne doit pas refuser un code juste
      var msg = $('msg-login');
      msg.className = 'msg'; msg.textContent = '';
      $('btn-login').disabled = true;
      fetch(LOGIN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mail: mail, code: code })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b, retry: r.headers.get('Retry-After') }; });
      }).then(function (res) {
        $('btn-login').disabled = false;
        if (res.status === 200 && res.body && res.body.ok && res.body.token) {
          ecrire(fromLogin(res.body));
          entrerAccueil();
          return;
        }
        if (res.status === 429) { msg.className = 'msg wait'; msg.textContent = 'Trop de tentatives, réessayez dans ' + (res.retry || 'un instant') + (res.retry ? ' s.' : '.'); return; }
        if (res.status === 503) { msg.className = 'msg wait'; msg.textContent = 'Service temporairement indisponible, réessayez.'; return; }
        // 403 = identifiants bons mais espace pas encore ouvert → message DISTINCT du 401 générique (on
        // n'affiche pas « incorrect » à un client dont les identifiants sont valides). Message fourni serveur.
        if (res.status === 403 && res.body && res.body.error) { msg.className = 'msg wait'; msg.textContent = res.body.error; return; }
        msg.className = 'msg err'; msg.textContent = 'Mail ou code incorrect.'; // 401 ou autre : générique
      }).catch(function () {
        $('btn-login').disabled = false;
        var m = $('msg-login'); m.className = 'msg wait'; m.textContent = 'Service temporairement indisponible, réessayez.';
      });
    });
    function fromLogin(b) { var o = {}; o[K_TOKEN] = b.token || ''; o[K_NOM] = b.nom || ''; o[K_MARQUE] = b.marque || ''; return o; } // F1 : on stocke le JETON, jamais le code

    // ── Accueil + projets ──
    $('lien-deco').addEventListener('click', function (e) { e.preventDefault(); effacer(); allerLogin(''); });

    function allerLogin(notice) {
      $('msg-login').className = notice ? 'msg wait' : 'msg';
      $('msg-login').textContent = notice || '';
      $('in-code').value = '';
      montrer('vue-login');
    }

    function entrerAccueil() {
      var nom = lire(K_NOM), marque = lire(K_MARQUE);
      $('bonjour').textContent = nom ? ('Bonjour ' + nom) : '';
      $('titre-projets').textContent = marque ? ('Vos projets · ' + marque) : 'Vos projets';
      montrer('vue-accueil');
      chargerEspace();
    }

    // ═══ MON ESPACE (B2) — les cinq blocs + premier accès, depuis espace-client (UN appel). ══════════════
    // Réserve 2 : !ok → « indisponible » distinct + Réessayer (jamais des blocs vides). ok → si TOUT est
    // vide (le quotidien : 87/89 projets Brand décochés, pas de rattrapage rétroactif) → PREMIER ACCÈS ;
    // sinon les blocs présents. Le premier accès est gardé sur ok===true → un 503 ne peut JAMAIS l'afficher.
    // Boutons « Voir le montage → » / « Revoir » : data-code → délégation #zone-projets (plus bas) →
    // ouvrirMontage. Toute valeur serveur en attribut passe par escAttr (esc() n'échappe pas les guillemets).
    var MOIS_FR = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    var MOIS_LG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    function dateFrLongue(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (parseInt(m[3], 10) + ' ' + MOIS_LG[parseInt(m[2], 10) - 1]) : ''; }
    function dateFrCourte(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (parseInt(m[3], 10) + ' ' + MOIS_FR[parseInt(m[2], 10) - 1] + ' ' + m[1]) : ''; }
    function initiales(nom) { return String(nom || '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }
    function refHtml(interlo) {
      if (!interlo || !interlo.nom) return '';
      return '<div class="ref"><div class="av">' + esc(initiales(interlo.nom)) + '</div>' +
        '<div class="ref-b"><div class="ref-n">' + esc(interlo.nom) + '</div><div class="ref-m">Votre référente chez Réel Média</div></div></div>';
    }

    function chargerEspace() {
      $('zone-projets').innerHTML = '<p class="sub">Chargement…</p>';
      fetch(ESPACE, { method: 'POST', headers: { 'x-rmc-token': lire(K_TOKEN) } })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); })
        .then(function (res) { renderEspace(res.status, res.body); })
        .catch(function () { espaceIndispo(); }); // réseau tombé → INDISPO, jamais un faux vide
    }
    function espaceIndispo() {
      $('zone-projets').innerHTML = '<div class="etat-indispo">Service temporairement indisponible.<div><button type="button" id="btn-reessayer">Réessayer</button></div></div>';
      $('btn-reessayer').addEventListener('click', chargerEspace);
    }

    function renderEspace(status, d) {
      if (status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
      if (status !== 200 || !d || !d.ok) { espaceIndispo(); return; } // 503/échec → distinct, jamais des blocs vides

      var aValider = d.aValider || [], aRelire = d.aRelire || [], enCours = d.enCours || [], livres = d.livres || [], col = d.collaboration || {};
      var zone = $('zone-projets');

      // PREMIER ACCÈS : ok ET rien à montrer (le cas normal au démarrage). aValider inclus : un projet en
      // phase séquencier (rien d'autre encore) ne doit pas être caché derrière l'écran de bienvenue.
      if (!aValider.length && !aRelire.length && !enCours.length && !livres.length) {
        var nomP = lire(K_NOM);
        zone.innerHTML = '<div class="premier"><h3>Bienvenue dans votre espace' + (nomP ? (', ' + esc(nomP)) : '') + '.</h3>' +
          '<p>Vos films apparaîtront ici au fur et à mesure. Rien à installer, rien à télécharger — tout se passe sur cette page.</p>' +
          '<ul class="pts">' +
            '<li><span class="p">1</span><span>Quand un montage est prêt, il s\'affiche en haut, prêt à être regardé.</span></li>' +
            '<li><span class="p">2</span><span>Vous laissez vos retours sur l\'image, au moment précis qui vous gêne.</span></li>' +
            '<li><span class="p">3</span><span>Une fois validé, le film rejoint votre archive, consultable ici.</span></li>' +
          '</ul>' + refHtml(d.interlocutrice) + '</div>';
        return;
      }

      var h = '';
      // 0. À VALIDER (séquencier) — tout en haut : le client valide le séquencier (ou demande des corrections)
      //    avant que le tournage démarre. seqLienHtml = point d'accroche pour l'ouverture du document ;
      //    laissé inerte tant que la convention de partage des Google Docs n'est pas tranchée (à brancher ici).
      if (aValider.length) {
        h += '<h2>À valider <span class="n">' + aValider.length + '</span></h2><div class="attente">' +
          aValider.map(function (p) {
            return '<div class="att sq"><div class="att-m"><div class="att-t">' + esc(p.titre) + '</div>' +
              '<div class="att-l"><span class="code">' + esc(p.code) + '</span><span>Séquencier à valider</span></div>' +
              seqLienHtml(p) + '</div>' +
              '<div class="sq-actions">' +
              '<button type="button" class="bouton vert sq-ok" data-seq-code="' + escAttr(p.code) + '">Valider le séquencier</button>' +
              '<button type="button" class="lnk sq-corr" data-corr-code="' + escAttr(p.code) + '">Demander des corrections</button>' +
              '</div></div>';
          }).join('') + '</div>';
      }
      // 1. À relire — bloc d'action, affiché seulement s'il y a quelque chose à relire.
      if (aRelire.length) {
        h += '<h2>À relire <span class="n">' + aRelire.length + '</span></h2><div class="attente">' +
          aRelire.map(function (p) {
            // « tour N sur X » = numéro de tour (rang recalculé sur les versions envoyées) + séries accordées.
            // AFFICHAGE SEULEMENT : repère pour que le client arbitre ses demandes, jamais un blocage.
            var tour = p.numero ? ('<span>tour ' + p.numero + ' sur ' + (p.seriesAccordees || 5) + '</span>') : '';
            return '<div class="att"><div class="att-m"><div class="att-t">' + esc(p.titre) + '</div>' +
              '<div class="att-l"><span class="code">' + esc(p.code) + '</span>' + tour +
              '<span class="mono">déposée le ' + esc(dateFrLongue(p.dateDeposee)) + '</span></div></div>' +
              '<button type="button" class="voir-montage" data-code="' + escAttr(p.code) + '">Voir le montage →</button></div>';
          }).join('') + '</div>';
      }
      // 2. Votre collaboration — toujours (hors premier accès).
      h += '<h2>Votre collaboration</h2><div class="stats">' +
        '<div class="stat"><span class="stat-n">' + (col.livres || 0) + '</span><span class="stat-l">films livrés</span></div>' +
        '<div class="stat"><span class="stat-n">' + (col.enCours || 0) + '</span><span class="stat-l">en cours</span></div>' +
        (col.depuis ? ('<div class="stat"><span class="stat-n petit">' + esc(col.depuis) + '</span><span class="stat-l">depuis</span></div>') : '') +
        '</div>';
      // 3. En cours (si présent). Barre à 4 étapes ; l'étape en-cours plafonne à Validation (2).
      if (enCours.length) {
        var LBL = ['Tournage', 'Montage', 'Validation', 'Diffusion'];
        h += '<h2>En cours <span class="n">' + enCours.length + '</span></h2><div class="live">' +
          enCours.map(function (p) {
            var etapes = LBL.map(function (l, i) { var c = i < p.etape ? 'et fait' : (i === p.etape ? 'et ici' : 'et'); return '<div class="' + c + '"><div class="et-b"></div><div class="et-l">' + l + '</div></div>'; }).join('');
            var pill = p.pastille && p.pastille.texte ? '<span class="pill">' + esc(p.pastille.texte) + '</span>' : '';
            // Point d'entrée montage SEULEMENT si aMontage (une version client existe ET pas déjà dans À
            // relire) → un seul bouton par film, et « Revoir » n'apparaît jamais sur un film jamais vu.
            // Sinon ET à partir de l'étape Montage (etape>=1) : ligne discrète expliquant l'absence de bouton.
            // À l'étape Tournage (etape 0) : RIEN — « montage en cours » serait faux sur un film pas encore
            // tourné. (Phrase juste pour l'étape Tournage : à trancher avec David, pas inventée ici.)
            var entree = p.aMontage
              ? '<button type="button" class="lnk" data-code="' + escAttr(p.code) + '">Revoir le montage</button>'
              : (p.etape >= 1 ? '<span class="lrow-attente">Votre montage est en cours — vous le recevrez dès qu\'il sera prêt.</span>' : '');
            // Historique du séquencier : lien seulement si le projet porte un Lien sequencier. Ouvre un overlay.
            var seqLink = p.lienSeq ? '<a class="lnk" href="#" data-seqdoc-code="' + escAttr(p.code) + '">Voir le séquencier</a>' : '';
            return '<div class="lrow"><div class="lrow-m"><div class="lrow-t">' + esc(p.titre) + '</div>' +
              '<div class="lrow-s"><span class="code">' + esc(p.code) + '</span><span>' + esc(p.realisePar) + '</span></div>' +
              '<div class="etapes">' + etapes + '</div></div>' +
              '<div class="lrow-r">' + pill + entree + seqLink + '</div></div>';
          }).join('') + '</div>';
      }
      // 4. Livrés (si présent) — plus récents d'abord ; au-delà de 4, le reste se replie (spec §6.1).
      if (livres.length) {
        var SEUIL = 4;
        var ligne = function (p) {
          return '<tr><td class="c-code"><span class="code">' + esc(p.code) + '</span></td>' +
            '<td class="c-t"><b>' + esc(p.titre) + '</b>' + ((p.sousFormat || p.duree) ? ('<span>' + esc([p.sousFormat, p.duree].filter(Boolean).join(' · ')) + '</span>') : '') + '</td>' +
            '<td class="c-who">' + esc(p.realisePar) + '</td><td class="c-d">' + esc(dateFrCourte(p.dateDiffusion)) + '</td>' +
            // « Revoir » (data-code → ouvre le montage) + « Télécharger » (data-dl-code → télécharge SANS
            // ouvrir de permission de visionnage ; absent si aucune version envoyée). Pas de data-code sur le
            // télécharger → la délégation montage ne le capte pas.
            '<td class="c-a"><a class="lnk" href="#" data-code="' + escAttr(p.code) + '">Revoir</a>' +
            (p.rang ? ' · <a class="lnk" href="#" data-dl-code="' + escAttr(p.code) + '" data-dl-rang="' + p.rang + '">Télécharger</a>' : '') +
            (p.lienSeq ? ' · <a class="lnk" href="#" data-seqdoc-code="' + escAttr(p.code) + '">Séquencier</a>' : '') +
            '</td></tr>';
        };
        var visibles = livres.slice(0, SEUIL), caches = livres.slice(SEUIL);
        h += '<h2>Livrés <span class="n">' + livres.length + '</span></h2><div class="tw"><table class="t">' +
          '<thead><tr><th>Code</th><th>Film</th><th>Réalisé par</th><th>Diffusion</th><th></th></tr></thead>' +
          '<tbody>' + visibles.map(ligne).join('') + '</tbody>' +
          (caches.length ? ('<tbody id="livres-caches" class="hidden">' + caches.map(ligne).join('') + '</tbody>') : '') +
          '</table></div>' +
          (caches.length ? ('<div class="replier" id="livres-replier"><span>' + caches.length + ' film' + (caches.length > 1 ? 's' : '') + ' plus anciens</span><a class="lnk" href="#" id="livres-toutafficher">Tout afficher</a></div>') : '');
      }
      // 5. Votre interlocutrice — masquée si null (jamais de ligne générique).
      if (d.interlocutrice && d.interlocutrice.nom) h += '<h2>Votre interlocutrice</h2>' + refHtml(d.interlocutrice);

      zone.innerHTML = h;
      var tout = $('livres-toutafficher');
      if (tout) tout.addEventListener('click', function (e) { e.preventDefault(); var c = $('livres-caches'); if (c) c.classList.remove('hidden'); var rp = $('livres-replier'); if (rp) rp.style.display = 'none'; });
      // Séquencier : 2e passe APRÈS le shell (comme la vidéo du montage) — on charge le Doc de chaque carte
      // « À valider » dans son conteneur. Asynchrone, dégradation propre, n'empêche jamais la validation.
      aValider.forEach(function (p) { mChargerSequencier(p.code); });
    }

    // ── Téléchargement depuis le tableau Livrés : récupérer un film fini SANS passer par la vue montage,
    //    donc SANS ouvrir de permission de visionnage Drive. Même contrat que le montage : drive-download-client
    //    résout par { sujetCode, rang }, aucun fileId ne descend. Fenêtre nommée ouverte AU CLIC (geste
    //    utilisateur → pas bloquée). 401 → re-login. Échec → le lien devient « Réessayer » (data-* conservés). ──
    function telechargerLivre(code, rang, el) {
      if (!code || !Number.isInteger(rang) || rang < 1) return;
      var win = window.open('', 'rmc-download');
      var label = el ? el.textContent : '';
      if (el) { el.textContent = 'Préparation…'; el.style.pointerEvents = 'none'; }
      var fini = function (txt) { if (el) { el.textContent = txt || label; el.style.pointerEvents = ''; } };
      mPost(DOWNLOAD, { sujetCode: code, rang: rang }).then(function (res) {
        if (res.status === 401) { if (win && !win.closed) win.close(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok && res.body.downloadUrl) {
          if (win && !win.closed) win.location = res.body.downloadUrl;
          else { var a = document.createElement('a'); a.href = res.body.downloadUrl; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
          fini(label);
        } else { if (win && !win.closed) win.close(); fini('Réessayer'); }
      }).catch(function () { if (win && !win.closed) win.close(); fini('Réessayer'); });
    }

    // ════════════════════════════════════════════════════════════════════════════════════════════════
    // ═══ VUE MONTAGE (tranche 2) — TOUT le JavaScript de l'écran « Voir un montage » tient dans ce bloc.
    // Lectures (montage-client), vidéo (drive-view-client), actions terminales (valider-client). Dépend
    // seulement des helpers existants ($, lire, esc, montrer, effacer, allerLogin). Aucune logique montage
    // ailleurs dans l'IIFE ; seuls un bouton d'entrée (rendre LISTE) et escAttr ont été ajoutés en dehors.
    // ════════════════════════════════════════════════════════════════════════════════════════════════

    // Les HUIT catégories FERMÉES de 📋 Retours (alignées sur montage-client.js qui valide contre elles ;
    // la maquette montrait une autre liste — incompatible, on suit le serveur). Hors liste → le serveur omet.
    var CATS = ['🔊 Audio', '🖼 Image', '🎬 Rush', '🎨 Graphisme', '📺 Accroche', '💬 Sous-titres', '🎤 Voix', '🎵 Musique'];
    var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    var ETIQ = { 'a-relire': 'à relire', 'retours-envoyes': 'retours envoyés', 'validee': 'validée' };

    // État de la vue en cours. fileId = SEULEMENT celui de la courante (jamais une version passée).
    var M = { code: '', rangAff: 0, nbVersions: 0, fileId: '', hb: null, notice: '', dureeMs: null,
      // chrono = AMORCE de position (jamais exacte : on ne lit pas l'iframe). base = dernière position qu'on a
      // imposée (0 au montage), depuis = instant où base a été posée. estimation = base + temps écoulé.
      // base = position connue du lecteur ; depuis = instant où la lecture a repris depuis base (0 = en pause,
      // on ne compte pas) ; ancre = a-t-on au moins un repère sûr (1er play détecté OU une position qu'on a
      // imposée). ancre=false → capture « à placer ».
      chrono: { base: 0, depuis: 0, ancre: false }, reseekTimer: null, capeActif: '',
      // Lecteur natif (étape 2) : flux = un <video> relais est monté ; fluxReessai = garde anti-boucle sur erreur
      // (une ré-ouverture transparente si le cookie a expiré, puis repli). dureeMs vient de video.duration.
      flux: false, fluxReessai: 0 };
    var K_MOMENTS = 'rmc-moments'; // clé localStorage par sujet : moments marqués, non encore commentés (brouillon LOCAL)

    // Timecode « m:ss » (ou « h:mm:ss ») → secondes. Chiffres purs seulement ; sinon null (ex. « — », vide).
    function mTcEnSecondes(tc) {
      var parts = String(tc || '').trim().split(':');
      if (!parts.length || parts.some(function (p) { return !/^\d+$/.test(p); })) return null;
      var s = 0;
      for (var i = 0; i < parts.length; i++) s = s * 60 + parseInt(parts[i], 10);
      return s;
    }

    function mFmtDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? (parseInt(m[3], 10) + ' ' + MOIS[parseInt(m[2], 10) - 1]) : ''; }
    function mBattementsStop() { if (M.hb) { clearInterval(M.hb); M.hb = null; } }
    function mQuitter() { mBattementsStop(); M.fileId = ''; M.dureeMs = null; montrer('vue-accueil'); }

    function ouvrirMontage(code) { mBattementsStop(); M.code = code; M.rangAff = 0; M.nbVersions = 0; M.fileId = ''; M.dureeMs = null; M.notice = ''; montrer('vue-montage'); mCharger(); }

    function mPost(url, corps) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-rmc-token': lire(K_TOKEN) }, body: JSON.stringify(corps) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); });
    }

    // ── Lecture : UN appel qui peint tout le shell (titre, pastilles, panneau). La vidéo suit en 2e appel. ──
    function mCharger(rang) {
      $('mt-corps').innerHTML = '<p class="sub">Chargement…</p>';
      var corps = { action: 'lire', sujetCode: M.code };
      if (rang) corps.rang = rang;
      mPost(MONTAGE, corps).then(function (res) { mRendre(res.status, res.body); }).catch(function () { mIndispo(); });
    }

    function mRendre(status, data) {
      if (status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
      if (status !== 200 || !data || !data.ok) { mIndispo(); return; }  // 503/échec → distinct d'un vide
      $('mt-titre').textContent = data.titre || 'Montage';
      $('mt-code').textContent = M.code;
      // En-tête pleine largeur (maquettes) : marque dans le fil d'Ariane ; le séparateur sujet ne s'affiche
      // que si une marque est connue (sinon « réelmédia / sujet »).
      $('mt-marque').textContent = data.marque || '';
      var sepSujet = document.querySelector('#vue-montage .mt-sep-sujet'); if (sepSujet) sepSujet.style.display = (data.marque ? '' : 'none');
      M.nbVersions = (data.versions || []).length;
      // notice one-shot (ex. péremption) affichée en tête, puis consommée
      $('mt-notice').innerHTML = M.notice ? ('<div class="mt-bandeau">' + esc(M.notice) + '</div>') : '';
      M.notice = '';
      // courante null = VRAI vide (exposé, rien encore envoyé) — surtout pas une erreur, pas de lecteur/formulaire
      if (!data.courante) { mVide(); return; }

      var aff = data.affichee ? data.affichee.rang : data.courante.rang;
      M.rangAff = aff;
      var vAff = data.versions[aff - 1];
      var estCourante = (aff === data.courante.rang);
      $('mt-meta').textContent = vAff ? ('Version ' + vAff.rang + ' · déposée le ' + mFmtDate(vAff.dateEnvoi)) : '';
      // Puce version [Vx] + état dans l'en-tête. « tour N » = rang de la version affichée (sans total : pas de
      // source confirmée pour « sur N », décision David). Version close → libellé d'état (à relire/validée/…).
      $('mt-vchip').textContent = 'V' + aff;
      $('mt-etat').textContent = (estCourante && vAff && vAff.etat === 'a-relire') ? ('À relire · tour ' + aff) : (ETIQ[vAff ? vAff.etat : ''] || '');

      $('mt-vers').innerHTML = data.versions.map(function (v) {
        return '<button class="vch" role="tab" type="button" data-rang="' + v.rang + '" aria-selected="' + (v.rang === aff) + '">Version ' + v.rang + '<span class="pt">' + esc(ETIQ[v.etat] || '') + '</span></button>';
      }).join('');

      var rets = data.retours || [];
      var retoursHtml = rets.length ? rets.map(function (r) {
        // Reformulation de l'équipe (comment la demande a été comprise) : sous le retour, motif identique à
        // review (« ↳ Reformulé par … »). Affiché seulement si l'équipe a reformulé. Tout échappé.
        var reform = r.reformulation ? ('<div class="ret-reform"><span class="ret-reform-by">↳ Reformulé par ' +
          esc(r.reformulePar || "l'équipe") + (r.timecodeReformule ? ' · ' + esc(r.timecodeReformule) : '') + '</span>' +
          '<span class="ret-reform-x">' + esc(r.reformulation) + '</span></div>') : '';
        // Brouillon = pas encore envoyé. Badge pour tous ; bouton Supprimer SEULEMENT sur MON brouillon de la
        // version COURANTE (r.mien + estCourante). Le serveur re-vérifie toutes les gardes de toute façon.
        var badge = r.brouillon ? '<span class="ret-brouillon">brouillon · non envoyé</span>' : '';
        var suppr = (r.brouillon && r.mien && estCourante && r.id)
          ? '<div class="ret-foot"><button class="ret-suppr" type="button" data-id="' + escAttr(r.id) + '">Supprimer</button></div>' : '';
        // data-sec : secondes du timecode (ou absent si non parsable). Le saut/la frise sont activés plus tard
        // par mPeindreFrise, une fois la durée connue (c'est elle qui tranche « possible » vs « hors film »).
        var secTc = mTcEnSecondes(r.timecode);
        // data-sec : saut au clic (activé par mPeindreFrise). data-mien : 1 = retour de CE contact (repère rouge
        // sur la bande), 0 = un autre contact de la même marque (repère gris).
        var tcAttr = (secTc != null) ? (' data-sec="' + secTc + '"') : '';
        tcAttr += ' data-mien="' + (r.mien ? '1' : '0') + '"';
        return '<div class="ret"><div class="ret-h"><span class="ret-tc"' + tcAttr + '>' + esc(r.timecode || '—') + '</span>' +
          (r.categorie ? '<span class="ret-cat">' + esc(r.categorie) + '</span>' : '') + badge + '</div>' +
          '<div class="ret-x">' + esc(r.texte) + '</div>' + reform + suppr + '</div>';
      }).join('') : '<div class="ret"><div class="ret-x" style="color:var(--txt3)">Aucun retour sur cette version.</div></div>';

      // Formulaire + actions SEULEMENT sur la courante OUVERTE ; sinon bandeau de version close (pas de formulaire grisé).
      var formulaire = (estCourante && vAff.etat === 'a-relire');

      // Lecteur natif (étape 2) : scène noire qui accueille le <video> relais (rempli par mOuvrirVideo, 2e appel),
      // adaptative au format par CSS (object-fit:contain). Le placeholder tient la hauteur pendant le chargement.
      var scene = '<div class="scene" id="mt-scene"><div class="scene-ph"><p class="sub" style="color:var(--txt3)">Chargement de la vidéo…</p></div></div>';
      // Bande de repères NON navigable : masquée jusqu'à la durée (loadedmetadata → mPeindreFrise l'allume).
      // Légende sous la bande (allumée en même temps que la bande) : rouge = vos retours, gris = autres contacts.
      var frise = '<div class="mt-frise" id="mt-frise" aria-hidden="true" style="display:none"></div>' +
        '<div class="mt-legende" id="mt-legende" style="display:none">' +
          '<span class="mt-lg"><i class="mt-lg-d"></i>vos retours</span>' +
          '<span class="mt-lg"><i class="mt-lg-d eq"></i>autres</span></div>';
      // Sous le lecteur : bloc d'écriture (courante à relire) + actions terminales ; sinon bandeau de version close.
      var bloc = formulaire ? (mFormeHtml() + mFinHtml()) : ('<div class="close gris"><b>' + esc(mBandeauEtat(vAff.etat)) + '</b></div>');

      // Téléchargement : sur CHAQUE version affichée (pied de la colonne retours). Le serveur résout le fichier
      // à partir du RANG ; aucun fileId de version ne descend dans la page.
      var telHtml = '<button class="bouton gris2" type="button" id="mt-tel">⬇ Télécharger cette version</button>' +
        '<div class="msg" id="mt-tel-msg" role="status" aria-live="polite"></div>';

      // Disposition (maquettes B/C) : colonne principale = lecteur → bande → écriture → actions ;
      // colonne droite = liste des retours pleine hauteur + téléchargement en pied.
      $('mt-corps').innerHTML = '<div class="rv"><div class="col-v">' + scene + frise + bloc + '</div>' +
        '<div class="panneau"><div class="pan-t"><span>Mes retours</span><span class="pan-n">' + rets.length + '</span></div>' +
        '<div class="retours">' + retoursHtml + '</div>' +
        '<div class="mt-telzone">' + telHtml + '</div></div></div>';

      // Bouton télécharger : présent pour TOUTE version affichée (courante ou passée). Le rang téléchargé est
      // celui de la version affichée.
      $('mt-tel').addEventListener('click', function () { mTelecharger(aff); });

      // Suppression de MON brouillon (courante). Délégation sur chaque bouton rendu ci-dessus.
      [].slice.call($('mt-corps').querySelectorAll('.ret-suppr')).forEach(function (b) {
        b.addEventListener('click', function () { mSupprimer(b.getAttribute('data-id'), b); });
      });

      if (formulaire) {
        $('mt-ajout').addEventListener('click', mAjouter);
        $('mt-annuler').addEventListener('click', mAnnulerRetour);
        $('mt-valider').addEventListener('click', function () { mTerminal('valider'); });
        $('mt-envoyer').addEventListener('click', function () { mTerminal('envoyer-retours'); });
        // Timecode éditable : formatage identique à review.html/index.html (0035 → 0:35) au blur ; ESPACE formate
        // et saute à la description. Avec le lecteur natif, l'ajustement se fait aussi en relisant video.currentTime.
        var tcEl = $('mt-tc');
        tcEl.addEventListener('blur', function () { mFormatTc(tcEl); });
        tcEl.addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); mFormatTc(tcEl); var d = $('mt-txt'); if (d) d.focus(); } });
        // Capture (étape 2) : au focus du champ de description, le lecteur se met en pause et — SI le champ est
        // encore vide — le timecode se remplit avec l'image à l'écran (video.currentTime). Jamais d'écrasement
        // d'un timecode une fois la rédaction commencée (le champ reste éditable). Zéro bouton intermédiaire.
        var txEl = $('mt-txt');
        if (txEl) txEl.addEventListener('focus', mCapterSurFocus);
      }
      [].slice.call($('mt-vers').querySelectorAll('.vch')).forEach(function (b) {
        b.addEventListener('click', function () { var rg = parseInt(b.getAttribute('data-rang'), 10); if (rg !== M.rangAff) { mBattementsStop(); M.fileId = ''; M.flux = false; M.dureeMs = null; mCharger(rg); } });
      });

      // 2e appel, APRÈS le rendu du shell : ouvre le flux relais pour la version AFFICHÉE (courante OU passée —
      // toute version envoyée se regarde) par son RANG, puis monte le <video> natif.
      mOuvrirVideo(aff);
    }

    // Copie STRICTE de formatTc (review.html / index.html) : chiffres seuls → « min:ss ».
    function mFormatTc(input) {
      var d = String(input.value || '').replace(/[^0-9]/g, '');
      if (!d) { input.value = ''; return; }
      var sec = d.slice(-2);
      while (sec.length < 2) sec = '0' + sec;
      var min = d.length > 2 ? String(parseInt(d.slice(0, -2), 10)) : '0';
      input.value = min + ':' + sec;
    }
    function mFormeHtml() {
      var opts = CATS.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
      // Puce timecode (éditable) collée à gauche du champ ; sous le champ : la phrase de cadrage validée +
      // actions (catégorie, Annuler, Ajouter). Le timecode se remplit au focus du champ (mCapterSurFocus).
      return '<div class="forme"><div class="forme-t">Laisser un retour</div>' +
        '<div class="mt-wr">' +
          '<label for="mt-tc" class="mt-tc-sr">Moment du film</label>' +
          '<input type="text" id="mt-tc" class="mt-tc-chip" placeholder="0:00" aria-label="Moment du film" inputmode="numeric">' +
          '<textarea id="mt-txt" placeholder="Votre remarque sur cette image…" aria-label="Votre retour"></textarea>' +
        '</div>' +
        '<div class="mt-wr-bas">' +
          '<p class="mt-phrase">La vidéo s\'arrête quand vous commencez à écrire — le moment enregistré est l\'image à l\'écran.</p>' +
          '<div class="mt-wr-act">' +
            '<select id="mt-cat" aria-label="Catégorie"><option value="">— Catégorie —</option>' + opts + '</select>' +
            '<button class="bouton gris2" type="button" id="mt-annuler">Annuler</button>' +
            '<button class="bouton" type="button" id="mt-ajout">Ajouter</button>' +
          '</div>' +
        '</div>' +
        '<div class="msg" id="mt-forme-msg" role="status" aria-live="polite"></div></div>';
    }
    function mFinHtml() {
      // Pas de section titrée « Quand vous avez terminé » (absente des maquettes) : les deux actions terminales
      // (le deux-temps conservé) en une rangée discrète sous le bloc d'écriture, avec la note explicative.
      return '<div class="mt-fin">' +
        '<div class="mt-fin-r">' +
          '<button class="bouton vert" type="button" id="mt-valider">Valider cette version</button>' +
          '<button class="bouton gris2" type="button" id="mt-envoyer">Envoyer mes retours</button>' +
        '</div>' +
        '<p class="mt-fin-n">Valider clôt le film : il part en diffusion tel quel. Envoyer vos retours clôt ce tour de relecture et lance une nouvelle version. Dans les deux cas l\'équipe est prévenue tout de suite.</p>' +
        '<div class="msg" id="mt-fin-msg" role="status" aria-live="polite"></div></div>';
    }
    function mBandeauEtat(etat) {
      // « Cette version est validée », pas « Vous avez validé » : la validation peut venir du client (clic
      // dans l'espace) OU de l'équipe (validation obtenue par mail, enregistrée à la main — cas de 22 projets
      // rattrapés). On n'attribue pas au client un geste qu'il n'a pas forcément fait ; la donnée ne distingue
      // pas les deux, et ce qui compte pour lui c'est l'état du film. (La ligne « retours envoyés » reste en
      // « Vous avez » : un retour envoyé l'est forcément par lui.)
      if (etat === 'validee') return 'Cette version est validée. Le film part en diffusion.';
      if (etat === 'retours-envoyes') return 'Vous avez envoyé vos retours sur cette version. Une nouvelle version suivra.';
      return 'Cette version est close.';
    }

    // ════════════════ LECTEUR NATIF (étape 2) ════════════════
    // Le relais Range (drive-stream) sert la vidéo par tranches à un <video> natif. Le mint (drive-stream-open)
    // pose un cookie HttpOnly signé qui porte le fichier : l'URL du <video> n'a AUCUN id (spec §8). Le master
    // reste privé (aucune permission Drive ouverte). La durée vient de video.duration (plus de dureeMs serveur).
    function mOuvrirVideo(rang) {
      var scene = $('mt-scene'); if (!scene) return;
      // On repart propre : le relais ne garde pas de permission → pas de battements (on les coupe au cas où un
      // repli bureau en avait démarré). M.fileId reste vide sur le chemin relais (aucun id ne descend).
      mBattementsStop(); M.fileId = ''; M.flux = false; M.dureeMs = null;
      mPost(STREAMOPEN, { sujetCode: M.code, rang: rang }).then(function (res) {
        if (!$('mt-scene')) return; // l'utilisateur a changé de version entre-temps
        if (res.status === 200 && res.body && res.body.ok) { mMonterVideo(rang); }
        else if (res.status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); }
        else { mReplier(rang); } // mint indisponible (503 config, 403, 509 plafond…) → repli
      }).catch(function () { if ($('mt-scene')) mReplier(rang); });
    }
    // Monte le <video> natif. ?v=rang&n=<nonce> casse le cache entre versions / ré-ouvertures ; le cookie (posé
    // par l'open) porte le fichier. object-fit:contain adapte 16:9 / 9:16 sans détection de ratio côté serveur.
    function mMonterVideo(rang) {
      var scene = $('mt-scene'); if (!scene) return;
      scene.classList.remove('scene-repli');
      scene.innerHTML = '';
      var v = document.createElement('video');
      v.className = 'mt-video';
      v.id = 'mt-video';
      v.setAttribute('controls', '');
      v.setAttribute('playsinline', '');          // iOS : lecture EN LIGNE (pas de plein écran forcé)
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('preload', 'auto');
      v.src = STREAM + '?v=' + encodeURIComponent(rang) + '&n=' + Date.now(); // propriété DOM, aucun id dans l'URL
      v.addEventListener('loadedmetadata', function () {
        if (v !== $('mt-video')) return; // élément périmé (changement de version) → on ignore
        M.fluxReessai = 0; // flux sain → on réarme la garde anti-boucle
        // Disposition seule (pas le moteur) : un montage VERTICAL (9:16) se montre en scène compacte centrée sur
        // le noir (maquette C) ; un HORIZONTAL (16:9) remplit la largeur (maquette B). On lit juste l'orientation.
        var sc = $('mt-scene'); if (sc && v.videoWidth && v.videoHeight) sc.classList.toggle('scene-portrait', v.videoHeight > v.videoWidth);
        if (isFinite(v.duration) && v.duration > 0) { M.dureeMs = v.duration * 1000; mPeindreFrise(); }
      });
      v.addEventListener('timeupdate', mMajPlayhead);
      v.addEventListener('error', function () { if (v !== $('mt-video')) return; mVideoErreur(rang); }); // ignore l'erreur d'un <video> déjà remplacé
      scene.appendChild(v);
      M.flux = true;
    }
    // Erreur du <video> : 1re fois → une ré-ouverture transparente (le cookie a pu expirer, TTL 2 h) ; au-delà
    // → repli. (Garde anti-boucle ; réarmée sur loadedmetadata.)
    function mVideoErreur(rang) {
      if (!M.flux) return;                // erreur après démontage → on ignore
      if (!M.fluxReessai) { M.fluxReessai = 1; mOuvrirVideo(rang); return; }
      M.fluxReessai = 0; mReplier(rang);
    }
    // Capture (Problème 2) : au focus du champ de description, PAUSE du lecteur ; SI le champ est vide, on
    // remplit le timecode avec l'image à l'écran (video.currentTime). Champ non vide → pause seule, jamais
    // d'écrasement du timecode en cours de rédaction. Le champ reste éditable.
    function mCapterSurFocus() {
      var v = $('mt-video'); if (v) { try { v.pause(); } catch (e) {} }
      var tx = $('mt-txt'), tc = $('mt-tc');
      if (v && tx && tc && !tx.value.trim() && isFinite(v.currentTime)) tc.value = mSecVersTc(v.currentTime);
    }
    // Annuler : vide le brouillon en cours (texte, timecode, catégorie) → le prochain focir recapture une frame
    // fraîche (reset du cas Problème 2). Ne touche pas aux retours déjà ajoutés.
    function mAnnulerRetour() {
      var tx = $('mt-txt'); if (tx) tx.value = '';
      var tc = $('mt-tc'); if (tc) tc.value = '';
      var cat = $('mt-cat'); if (cat) cat.value = '';
      var msg = $('mt-forme-msg'); if (msg) { msg.className = 'msg'; msg.textContent = ''; }
    }
    // Trait de position sur la bande (non navigable) : avance avec la lecture (timeupdate).
    function mMajPlayhead() {
      var v = $('mt-video'), head = $('mt-fr-head');
      if (!v || !head || !M.dureeMs) return;
      var pct = Math.max(0, Math.min(100, (v.currentTime / (M.dureeMs / 1000)) * 100));
      head.style.left = pct.toFixed(2) + '%';
    }
    // Saut au timecode (clic sur le timecode d'un retour) : en natif, c'est un vrai seek + lecture. La BANDE,
    // elle, ne navigue pas (décision David) — la navigation libre se fait par les contrôles natifs du <video>.
    function mSauter(sec) {
      var v = $('mt-video'); if (!v || sec == null || sec < 0) return;
      if (M.dureeMs && (sec * 1000 >= M.dureeMs)) return; // après la fin → on n'y va pas
      try { v.currentTime = sec; var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    // Repli (Problème 1) — le relais indisponible (mint en échec, 509 plafond, erreur <video> répétée).
    // Bureau : iframe Drive /preview (lecture inline, via le portier existant drive-view-client) + téléchargement.
    // iOS : l'iframe Drive ne lit RIEN en ligne → message franc + téléchargement (seul chemin qui marche).
    // Dans les deux cas l'espace client reste utilisable ; « Réessayer » retente le flux fluide.
    function mReplier(rang) {
      var scene = $('mt-scene'); if (!scene) return;
      M.flux = false; M.dureeMs = null;
      var fr = $('mt-frise'); if (fr) { fr.style.display = 'none'; fr.innerHTML = ''; }
      scene.classList.add('scene-repli');
      if (mEstIOS()) {
        scene.innerHTML = '<div class="repli repli-ios">' +
            '<p class="repli-t">Lecture en ligne indisponible pour l\'instant</p>' +
            '<p class="repli-x">Sur cet appareil, téléchargez la vidéo pour la regarder.</p>' +
            '<div class="repli-bas">' +
              '<button type="button" class="bouton" id="mt-repli-tel">⬇ Télécharger cette version</button>' +
              '<button type="button" class="lien-reessai" id="mt-repli-reessai">Réessayer la lecture</button>' +
            '</div></div>';
        mReplierCabler(rang);
        return;
      }
      // Bureau : on demande un fileId au portier existant (drive-view-client) pour l'iframe de secours, et on
      // garde la permission vivante par battements (mécanique existante, inchangée).
      scene.innerHTML = '<div class="scene-ph"><p class="sub" style="color:var(--txt3)">Préparation de la lecture de secours…</p></div>';
      mPost(DRIVEVIEW, { action: 'open', sujetCode: M.code, rang: rang }).then(function (res) {
        var sc = $('mt-scene'); if (!sc) return;
        if (res.status === 200 && res.body && res.body.ok && res.body.fileId) {
          M.fileId = res.body.fileId;
          mBattementsDemarrer(); // garde la permission iframe en vie (comme avant le relais)
          sc.innerHTML = '<div class="repli">' +
              '<div id="mt-repli-frame"></div>' +
              '<div class="repli-bas"><span class="repli-note">Lecture de secours — <button type="button" class="lien-reessai" id="mt-repli-reessai">réessayer la lecture fluide</button></span>' +
              '<button type="button" class="bouton gris2" id="mt-repli-tel">⬇ Télécharger</button></div></div>';
          var f = document.createElement('iframe');
          f.className = 'mt-iframe';
          f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(res.body.fileId) + '/preview';
          f.setAttribute('allow', 'autoplay; fullscreen');
          f.setAttribute('allowfullscreen', '');
          $('mt-repli-frame').appendChild(f);
          mReplierCabler(rang);
        } else if (res.status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); }
        else { mReplierTelSeul(rang); } // même le repli iframe échoue → téléchargement seul
      }).catch(function () { if ($('mt-scene')) mReplierTelSeul(rang); });
    }
    // Dernier recours : ni flux ni iframe → téléchargement seul (marche partout).
    function mReplierTelSeul(rang) {
      var scene = $('mt-scene'); if (!scene) return;
      scene.classList.add('scene-repli');
      scene.innerHTML = '<div class="repli repli-ios">' +
          '<p class="repli-t">Lecture en ligne indisponible pour l\'instant</p>' +
          '<p class="repli-x">Téléchargez la vidéo pour la regarder.</p>' +
          '<div class="repli-bas">' +
            '<button type="button" class="bouton" id="mt-repli-tel">⬇ Télécharger cette version</button>' +
            '<button type="button" class="lien-reessai" id="mt-repli-reessai">Réessayer la lecture</button>' +
          '</div></div>';
      mReplierCabler(rang);
    }
    function mReplierCabler(rang) {
      var t = $('mt-repli-tel'); if (t) t.addEventListener('click', function () { mTelecharger(rang); });
      var r = $('mt-repli-reessai'); if (r) r.addEventListener('click', function () { M.fluxReessai = 0; mOuvrirVideo(rang); });
    }
    // Détection iOS (iPhone/iPod/iPad, iPadOS se présentant en MacIntel tactile). [S] comportement <video>/iframe
    // non vérifiable hors appareil réel : en cas de doute on considère NON-iOS (repli iframe, dégradation douce).
    function mEstIOS() {
      var ua = navigator.userAgent || '';
      return /iP(hone|od|ad)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }
    // Bande de repères (NON navigable) + activation du saut sur les timecodes des retours. Appelée à
    // loadedmetadata (durée connue). Un tc hors film (≥ durée) est barré et jamais cliquable. Couleur du repère :
    // rouge = retour de CE contact (data-mien=1), gris = un autre contact de la même marque.
    function mPeindreFrise() {
      var dureeSec = M.dureeMs ? (M.dureeMs / 1000) : null;
      var marqueurs = [];
      [].slice.call(document.querySelectorAll('#mt-corps .ret-tc[data-sec]')).forEach(function (el) {
        var sec = parseInt(el.getAttribute('data-sec'), 10);
        if (!isFinite(sec)) return;
        if (dureeSec != null && sec >= dureeSec) { el.classList.add('ret-tc-hs'); el.title = 'Après la fin du film'; return; }
        if (!el.classList.contains('ret-tc-seek')) {
          el.classList.add('ret-tc-seek');
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          (function (s) {
            el.addEventListener('click', function () { mSauter(s); });
            el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mSauter(s); } });
          })(sec);
        }
        if (dureeSec != null) marqueurs.push({ sec: sec, mien: el.getAttribute('data-mien') === '1' });
      });
      var fr = $('mt-frise'); if (!fr) return;
      var lg = $('mt-legende');
      if (dureeSec == null) { fr.style.display = 'none'; fr.innerHTML = ''; if (lg) lg.style.display = 'none'; return; }
      fr.style.display = '';
      if (lg) lg.style.display = ''; // légende visible en même temps que la bande (présentation, pas le calcul des repères)
      // Repères (points) + trait de position. Aucun handler de clic : la bande ne navigue pas.
      fr.innerHTML = marqueurs.map(function (m) {
        var pct = Math.max(0, Math.min(100, (m.sec / dureeSec) * 100));
        return '<span class="mt-fr-m' + (m.mien ? '' : ' eq') + '" style="left:' + pct.toFixed(2) + '%"></span>';
      }).join('') + '<span class="mt-fr-head" id="mt-fr-head" style="left:0%"></span>';
    }

    // ════════════════ CAPTURE DU MOMENT (tranche 3) ════════════════
    // On ne lit JAMAIS l'iframe (cross-origin) ; on IMPOSE des positions via ?t= et on connaît donc toujours où
    // on a mis le lecteur. NOTRE transport (barre = saut, Noter = pause+note, Pause = pause) sert tous les
    // besoins de déplacement → le client n'a pas à toucher les contrôles de Drive, donc le chrono ne dérive pas.
    // Chaque action ré-ancre (l'erreur ne s'accumule jamais). Un moment sans texte n'est JAMAIS un retour
    // (ajouter-retour exige un texte) ; les moments non commentés restent un brouillon LOCAL, jamais envoyé.

    function mSecVersTc(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' + s : s); }
    // Estimation de la position courante = base imposée + temps écoulé. AMORCE, jamais exacte (pause/scrub Drive
    // invisibles ; on ignore même quand le client a appuyé sur play). Bornée en haut si la durée est connue.
    function mEstimation() {
      var s = M.chrono.base + (M.chrono.depuis ? (Date.now() - M.chrono.depuis) / 1000 : 0);
      if (s < 0) s = 0;
      if (M.dureeMs && s > M.dureeMs / 1000) s = M.dureeMs / 1000;
      return Math.round(s);
    }
    // Re-seek DÉBOUNCÉ : on attend ~500 ms d'inactivité après le dernier geste, puis UN seul rechargement vers
    // la valeur courante (+1+1+1 rapide → un rechargement). Marche à froid comme à chaud. Pose aussi le chrono.
    function mReseek(sec) {
      if (M.reseekTimer) clearTimeout(M.reseekTimer);
      M.reseekTimer = setTimeout(function () {
        M.reseekTimer = null;
        M.chrono = { base: sec, depuis: 0, ancre: true }; // reload = pause sur sec, position connue ; compteur figé jusqu'au play
        if (M.fileId) mMonterIframe(M.fileId, sec);
      }, 500);
    }
    // − / + : le NOMBRE change instantanément dans le champ ; l'IMAGE est re-seekée en débouncé.
    function mNudge(delta) {
      var el = $('mt-tc'); if (!el) return;
      var sec = mTcEnSecondes(el.value); if (sec == null) sec = mEstimation();
      sec = sec + delta; if (sec < 0) sec = 0;
      if (M.dureeMs && sec > Math.floor(M.dureeMs / 1000)) sec = Math.floor(M.dureeMs / 1000);
      el.value = mSecVersTc(sec);
      mReseek(sec);
    }
    // Moments marqués (brouillon LOCAL) : lecture/écriture localStorage, tolérant (navigation privée → pas de
    // persistance, sans casser). Clé par sujet.
    function mMomentsLire(code) { try { var r = JSON.parse(localStorage.getItem(K_MOMENTS + ':' + code) || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; } }
    function mMomentsEcrire(code, arr) { try { localStorage.setItem(K_MOMENTS + ':' + code, JSON.stringify(arr || [])); } catch (e) { /* stockage indispo → pas de persistance, sans casser */ } }
    // « Noter ce moment » = NOTRE pause. Capture la position estimée (connue si ancré, sinon « à placer »),
    // puis RECHARGE le lecteur sur cette frame (met en pause, le client reste sur son image) et amène le curseur
    // à la description. C'est NOTRE bouton qui sert de pause → le client n'a pas besoin des contrôles de Drive,
    // donc le chrono ne dérive pas. Chaque note ré-ancre (mSauter : base=sec, depuis:0).
    function mMarquer() {
      // Ancré (1er play détecté OU position déjà imposée) → position connue ; jamais ancré → « à placer » (sec null),
      // pas de fausse valeur, jamais 0:00.
      var sec = M.chrono.ancre ? mEstimation() : null;
      var id = 'p' + Date.now() + '-' + Math.floor(Math.random() * 1000);
      var arr = mMomentsLire(M.code); arr.push({ id: id, sec: sec }); mMomentsEcrire(M.code, arr);
      M.capeActif = id;
      var el = $('mt-tc'); if (el) el.value = (sec == null ? '' : mSecVersTc(sec));
      mRafraichirPins();
      if (sec != null) mSauter(sec);              // NOTRE pause : recharge sur la frame notée + ré-ancre
      var tx = $('mt-txt'); if (tx) tx.focus();   // en pause pour commenter → curseur à la description
      var b = $('mt-cap'); if (b) { b.textContent = '✓ Noté'; setTimeout(function () { var c = $('mt-cap'); if (c) c.textContent = '⏸ Noter ce moment'; }, 900); }
    }
    // Pause SANS noter : stopper pour réfléchir, répondre, relire un sous-titre. Recharge sur la frame courante
    // (position connue) + ré-ancre, sans créer de pastille → le client n'utilise jamais la pause de Drive.
    function mPauseSeule() {
      if (!M.fileId) return;
      mSauter(M.chrono.ancre ? mEstimation() : 0);
    }
    function mRafraichirPins() {
      var w = $('mt-pins-wrap'); if (!w) return;
      var arr = mMomentsLire(M.code);
      if (!arr.length) { w.innerHTML = ''; return; }
      w.innerHTML = '<div class="mt-pins"><span class="mt-pins-t">Moments marqués — cliquez pour commenter</span>' +
        arr.map(function (p) {
          // mt-pin-actif = le moment actuellement chargé dans le champ (ce qui PARTIRA) → le client voit lequel.
          // sec null = « à placer » (chrono dormant à la capture) : libellé explicite, data-sec vide (pas de saut).
          var lab = (p.sec == null) ? 'à placer' : mSecVersTc(p.sec);
          var ds = (p.sec == null) ? '' : p.sec;
          return '<button type="button" class="mt-pin' + (p.id === M.capeActif ? ' mt-pin-actif' : '') + '" data-pin="' + escAttr(p.id) + '" data-sec="' + ds + '">' + esc(lab) +
            '<span class="mt-pin-x" data-pinx="' + escAttr(p.id) + '" role="button" aria-label="Retirer ce moment">✕</span></button>';
        }).join('') + '</div>';
    }
    // Charger une pastille dans le formulaire : pose le timecode, re-seek (confirme à l'œil), focus la description.
    function mChargerPastille(id, sec) {
      M.capeActif = id;
      var el = $('mt-tc'); if (el) el.value = (sec == null ? '' : mSecVersTc(sec));
      mRafraichirPins();            // met à jour la surbrillance « pastille active » (le client voit laquelle partira)
      if (sec != null) mReseek(sec); // re-seek → l'iframe recharge et arrive EN PAUSE (réponse (3)) ; pas de saut vers un « à placer »
      var tx = $('mt-txt'); if (tx) tx.focus();
    }
    function mRetirerPastille(id) {
      mMomentsEcrire(M.code, mMomentsLire(M.code).filter(function (p) { return p.id !== id; }));
      if (M.capeActif === id) M.capeActif = '';
      mRafraichirPins();
    }
    // Câblage capture/pastilles/nudge — appelé depuis le bloc `formulaire` de mRendre (DOM frais à chaque rendu).
    function mCablerCapture() {
      var cap = $('mt-cap'); if (cap) cap.addEventListener('click', mMarquer);
      var pse = $('mt-pause'); if (pse) pse.addEventListener('click', mPauseSeule);
      var moins = $('mt-moins'); if (moins) moins.addEventListener('click', function () { mNudge(-1); });
      var plus = $('mt-plus'); if (plus) plus.addEventListener('click', function () { mNudge(1); });
      var wrap = $('mt-pins-wrap');
      if (wrap) wrap.addEventListener('click', function (e) {
        var t = e.target;
        var x = t.getAttribute && t.getAttribute('data-pinx'); if (x) { e.stopPropagation(); mRetirerPastille(x); return; }
        while (t && t !== wrap && !(t.getAttribute && t.getAttribute('data-pin'))) t = t.parentNode;
        if (t && t.getAttribute && t.getAttribute('data-pin')) { var ds = t.getAttribute('data-sec'); mChargerPastille(t.getAttribute('data-pin'), ds === '' ? null : parseInt(ds, 10)); }
      });
      mRafraichirPins();
      // Au (re)rendu (ex. après un rechargement de page, ou après avoir commenté un moment) : si des moments
      // restent en attente et qu'aucun n'est chargé, on charge le PLUS RÉCENT dans le champ → jamais 0:00 par
      // défaut tant qu'il y a des pastilles. Sans re-seek (pas de pause auto au rendu) ni focus.
      if (!M.capeActif) {
        var attente = mMomentsLire(M.code);
        if (attente.length) { var p = attente[attente.length - 1]; M.capeActif = p.id; var ch = $('mt-tc'); if (ch) ch.value = (p.sec == null ? '' : mSecVersTc(p.sec)); mRafraichirPins(); }
      }
    }
    function mSceneIndispo() {
      var scene = $('mt-scene'); if (!scene) return;
      scene.innerHTML = '<div class="scene-v"><p class="sub" style="color:var(--amber)">Vidéo indisponible pour l\'instant. <button type="button" class="lien-reessai" id="mt-video-reessai">Réessayer</button></p></div>';
      $('mt-video-reessai').addEventListener('click', function () { mOuvrirVideo(M.rangAff); });
    }

    // ── Suppression de MON brouillon non envoyé. Le serveur re-vérifie toutes les gardes (appartenance au
    //    contact, Source Client, même sujet, version courante, Brouillon:true) et ARCHIVE (ne détruit pas).
    //    Succès → on recharge la version affichée (le brouillon disparaît). 409 = déjà envoyé → notice, jamais
    //    supprimé. 401 → session expirée. ──
    function mSupprimer(retourId, btn) {
      if (!retourId) return;
      if (btn) { btn.disabled = true; btn.textContent = 'Suppression…'; }
      mPost(MONTAGE, { action: 'supprimer-brouillon', sujetCode: M.code, retourId: retourId }).then(function (res) {
        if (res.status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok) { mCharger(M.rangAff); return; }
        if (res.status === 409) { M.notice = 'Ce retour a déjà été envoyé : il n\'a pas été supprimé.'; mCharger(M.rangAff); return; }
        M.notice = 'Suppression impossible pour l\'instant. Réessayez.'; mCharger(M.rangAff);
      }).catch(function () { M.notice = 'Suppression impossible pour l\'instant. Réessayez.'; mCharger(M.rangAff); });
    }

    // ── Téléchargement d'une version par son RANG. Le serveur résout le fichier et renvoie un downloadUrl
    //    éphémère (révoqué aussitôt) ; aucun fileId ne descend dans la page. Fenêtre nommée ouverte AU CLIC
    //    (geste utilisateur → pas bloquée par l'anti-popup), remplie après le POST ; réutilisée aux clics
    //    suivants. 401 → session expirée. Échec → message, et on ferme la fenêtre d'attente. ──
    function mTelecharger(rang) {
      var btn = $('mt-tel'), msg = $('mt-tel-msg');
      var win = window.open('', 'rmc-download');
      if (btn) { btn.disabled = true; }
      if (msg) { msg.textContent = 'Préparation…'; msg.style.color = ''; }
      mPost(DOWNLOAD, { sujetCode: M.code, rang: rang }).then(function (res) {
        if (res.status === 401) { if (win && !win.closed) win.close(); mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok && res.body.downloadUrl) {
          if (win && !win.closed) win.location = res.body.downloadUrl;
          else { var a = document.createElement('a'); a.href = res.body.downloadUrl; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
          if (msg) { msg.textContent = 'Téléchargement lancé.'; }
        } else {
          if (win && !win.closed) win.close();
          if (msg) { msg.textContent = 'Téléchargement indisponible pour l\'instant. Réessayez.'; msg.style.color = 'var(--amber)'; }
        }
      }).catch(function () {
        if (win && !win.closed) win.close();
        if (msg) { msg.textContent = 'Téléchargement indisponible pour l\'instant. Réessayez.'; msg.style.color = 'var(--amber)'; }
      }).then(function () { if (btn) btn.disabled = false; });
    }

    // ── Battements : 60 s tant que la vue est ouverte (PAS conditionné à lecture/pause → une pause < idle
    //    3 min ne tue pas la session). alive:false → ré-ouverture transparente. Retour d'onglet → battre tout
    //    de suite (couvre le throttling des minuteurs d'arrière-plan). ──
    function mBattementsDemarrer() { mBattementsStop(); M.hb = setInterval(mBattre, 60000); }
    function mBattre() {
      if (!M.fileId || $('vue-montage').classList.contains('hidden')) return;
      mPost(DRIVEVIEW, { action: 'heartbeat', fileId: M.fileId }).then(function (res) {
        if (res.body && res.body.alive === false) mOuvrirVideo(M.rangAff); // session morte → ré-ouvrir transparent (par rang)
      }).catch(function () {});
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden && M.fileId && !$('vue-montage').classList.contains('hidden')) mBattre(); });

    // ── Ancrage de t0 au PREMIER geste dans le lecteur (≈ play). Un clic dans une iframe cross-origin fait
    //    perdre le focus à la fenêtre parent et document.activeElement devient l'iframe. On démarre le chrono
    //    LÀ, une seule fois par vidéo. On n'en fait PAS un détecteur play/pause continu : après le 1er clic le
    //    focus reste dans l'iframe (pas de nouveau blur), et on ne saurait pas distinguer play d'un clic volume.
    //    [S] fiabilité non vérifiable hors navigateur réel, surtout iOS Safari : si le signal ne tire jamais, le
    //    chrono reste dormant → capture « à placer » (cf. mMarquer), jamais une fausse valeur.
    window.addEventListener('blur', function () {
      setTimeout(function () { // l'activeElement se met à jour juste après le blur
        if (M.chrono.depuis) return;                                   // déjà en lecture (compteur en marche) → rien à redémarrer
        if ($('vue-montage').classList.contains('hidden')) return;     // hors vue montage → on ignore
        var sc = $('mt-scene'); var f = sc && sc.querySelector('iframe.mt-iframe');
        // clic dans le lecteur = (re)prise de lecture DEPUIS la position courante (base conservée : 0 au 1er play,
        // ou la frame où NOTRE pause/saut l'a laissé). On démarre le compteur ; on ne réinitialise pas base.
        if (f && document.activeElement === f) { M.chrono.ancre = true; M.chrono.depuis = Date.now(); }
      }, 0);
    });

    // ── Ajout d'un retour (réversible) : recharge le panneau au succès. ──
    function mAjouter() {
      var txt = $('mt-txt').value.trim(), tc = $('mt-tc').value.trim(), cat = $('mt-cat').value, msg = $('mt-forme-msg');
      msg.className = 'msg'; msg.textContent = '';
      if (!txt) { msg.className = 'msg err'; msg.textContent = 'Décrivez votre retour.'; return; }
      $('mt-ajout').disabled = true;
      mPost(MONTAGE, { action: 'ajouter-retour', sujetCode: M.code, texte: txt, timecode: tc, categorie: cat }).then(function (res) {
        if (res.status === 200 && res.body && res.body.ok) {
          if (M.capeActif) mRetirerPastille(M.capeActif); // le moment commenté devient un brouillon SERVEUR → il quitte la liste locale
          mCharger(M.rangAff); return; // panneau rechargé → le retour (brouillon serveur) apparaît
        }
        if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        var m = $('mt-forme-msg'); if (m) { m.className = 'msg wait'; m.textContent = 'Service indisponible, réessayez.'; }
        var b = $('mt-ajout'); if (b) b.disabled = false;
      }).catch(function () { var m = $('mt-forme-msg'); if (m) { m.className = 'msg wait'; m.textContent = 'Service indisponible, réessayez.'; } var b = $('mt-ajout'); if (b) b.disabled = false; });
    }

    // ── Actions terminales : nbVersions = ce que la vue a affiché (garde de péremption serveur). ──
    function mTerminal(action) {
      var bV = $('mt-valider'), bE = $('mt-envoyer'); if (bV) bV.disabled = true; if (bE) bE.disabled = true;
      mPost(VALIDER, { action: action, sujetCode: M.code, nbVersions: M.nbVersions }).then(function (res) {
        if (res.status === 200 && res.body && res.body.ok) { mCharger(); return; }   // recharge → état bascule, formulaire→bandeau
        if (res.status === 409 && res.body && res.body.perime) {                     // une version plus récente est arrivée
          M.notice = 'Une version plus récente est arrivée. On recharge votre espace.'; mCharger(); return;
        }
        if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        var m = $('mt-fin-msg'); if (m) { m.className = 'msg wait'; m.textContent = (res.body && res.body.error) || 'Action impossible, réessayez.'; }
        if (bV) bV.disabled = false; if (bE) bE.disabled = false;
      }).catch(function () { var m = $('mt-fin-msg'); if (m) { m.className = 'msg wait'; m.textContent = 'Service indisponible, réessayez.'; } if (bV) bV.disabled = false; if (bE) bE.disabled = false; });
    }

    function mVide() { mBattementsStop(); M.fileId = ''; M.dureeMs = null; $('mt-vers').innerHTML = ''; $('mt-meta').textContent = ''; $('mt-corps').innerHTML = '<div class="etat-vide">Aucune version à relire pour l\'instant. Vous serez prévenu·e dès qu\'un montage est prêt.</div>'; }
    function mIndispo() { mBattementsStop(); M.fileId = ''; M.dureeMs = null; $('mt-vers').innerHTML = ''; $('mt-meta').textContent = ''; $('mt-corps').innerHTML = '<div class="etat-indispo">Service temporairement indisponible.<div><button type="button" id="mt-reessayer">Réessayer</button></div></div>'; $('mt-reessayer').addEventListener('click', function () { mCharger(M.rangAff || undefined); }); }

    // Entrées & sortie (délégation : le bouton « Voir le montage → » est rendu par rendre LISTE).
    // Délégation : tout élément porteur d'un data-code dans l'accueil (« Voir le montage → » de À relire,
    // « Revoir » des Livrés) ouvre la vue montage. On clé sur data-code, pas sur une classe de style.
    var SEQ = '/.netlify/functions/valider-sequencier-client';
    var SEQ_DOC = '/.netlify/functions/sequencier-doc';
    $('zone-projets').addEventListener('click', function (e) {
      // Remonter jusqu'à un élément porteur d'une action : ouvrir le montage (data-code), télécharger
      // (data-dl-code), valider le séquencier (data-seq-code) ou demander des corrections (data-corr-code).
      // Le télécharger doit rester SYNCHRONE au clic (window.open non bloqué).
      var t = e.target; while (t && t !== this && !(t.getAttribute && (t.getAttribute('data-code') || t.getAttribute('data-dl-code') || t.getAttribute('data-seq-code') || t.getAttribute('data-corr-code') || t.getAttribute('data-seqdoc-code')))) t = t.parentNode;
      if (!t || t === this || !t.getAttribute) return;
      var sd = t.getAttribute('data-seqdoc-code');
      if (sd) { e.preventDefault(); ouvrirSequencier(sd); return; }
      var seq = t.getAttribute('data-seq-code');
      if (seq) { e.preventDefault(); mValiderSequencier(seq, t); return; }
      var corr = t.getAttribute('data-corr-code');
      if (corr) { e.preventDefault(); mDemanderCorrections(corr, t); return; }
      var dl = t.getAttribute('data-dl-code');
      if (dl) { e.preventDefault(); telechargerLivre(dl, parseInt(t.getAttribute('data-dl-rang'), 10), t); return; }
      if (t.getAttribute('data-code')) { e.preventDefault(); ouvrirMontage(t.getAttribute('data-code')); }
    });
    // ── Séquencier : point d'accroche pour l'ouverture du document. INERTE pour l'instant — la convention
    //    de partage des Google Docs (lien sortant gardé vs permission dédiée) n'est pas tranchée. Quand elle
    //    le sera, c'est ICI qu'on rend le lien/bouton (p.lienSeq est déjà descendu par espace-client). ──
    // Conteneur du séquencier dans la carte « À valider », rempli en 2e passe par mChargerSequencier.
    function seqLienHtml(p) { return '<div class="sq-doc" id="sq-doc-' + escAttr(p.code) + '"><p class="sub" style="color:var(--txt3)">Chargement du séquencier…</p></div>'; }
    // Charge le Doc (sequencier-doc) et le rend dans un IFRAME SANDBOX srcdoc SANS allow-scripts (le HTML
    // renvoyé est déjà échappé côté serveur ; le sandbox est la 2e barrière). Dégradation propre si
    // indisponible. srcdoc posé par PROPRIÉTÉ DOM (jamais un attribut construit par concaténation).
    function mChargerSequencier(code, boxId) {
      boxId = boxId || ('sq-doc-' + code); // défaut : conteneur inline « À valider » ; l'overlay passe le sien
      var box = $(boxId);
      if (!box) return;
      mPost(SEQ_DOC, { sujetCode: code }).then(function (res) {
        if (!(box = $(boxId))) return; // la vue a pu changer
        if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok && !res.body.indisponible && typeof res.body.html === 'string') {
          box.innerHTML = '';
          var f = document.createElement('iframe');
          f.className = 'sq-doc-frame';
          f.setAttribute('sandbox', ''); // ni script, ni same-origin, ni formulaire
          f.srcdoc = '<!doctype html><meta charset="utf-8"><style>body{font:14px/1.5 system-ui,sans-serif;color:#1a1a1a;margin:12px}h3,h4{font-size:15px;margin:12px 0 4px}p{margin:0 0 8px}ul{margin:0 0 8px;padding-left:20px}li{margin:2px 0}strong{font-weight:600}em{font-style:italic}table{border-collapse:collapse;width:100%;margin:8px 0}td{border:1px solid #ccc;padding:5px 7px;vertical-align:top}</style>' + res.body.html;
          box.appendChild(f);
          // Troncature NON silencieuse : si une partie n'a pas pu être rendue (sommaire, tableau trop
          // imbriqué…), on le dit explicitement. Un contenu amputé en silence est pire qu'absent.
          if (res.body.tronque) box.insertAdjacentHTML('beforeend', '<p class="sub" style="color:var(--amber);margin-top:6px">Certaines parties du séquencier ne s\'affichent pas ici — ouvrez le document d\'origine ou demandez-le à votre interlocuteur.</p>');
        } else {
          // indisponible (SA sans accès / pas de lien) OU échec → message, JAMAIS un bloc cassé. La
          // validation et « Demander des corrections » restent actives au-dessus.
          box.innerHTML = '<p class="sub" style="color:var(--txt3)">Le séquencier n\'est pas encore disponible ici. Votre interlocuteur chez Réel Média peut vous le partager.</p>';
        }
      }).catch(function () { var b = $(boxId); if (b) b.innerHTML = '<p class="sub" style="color:var(--txt3)">Le séquencier n\'est pas encore disponible ici. Votre interlocuteur chez Réel Média peut vous le partager.</p>'; });
    }
    // Historique (En cours / Livrés) : OVERLAY, pas inline — un séquencier fait plusieurs centaines de mots,
    // il lui faut une LARGEUR DE LECTURE bornée ; et déplier un document dans une cellule du tableau Livrés
    // donnerait une colonne étroite. Panneau centré, largeur bornée, fermeture ✕ / Échap / fond. Le contenu
    // est chargé par mChargerSequencier (même iframe sandbox, même dégradation).
    function ouvrirSequencier(code) {
      var exist = $('seqdoc-overlay'); if (exist) exist.remove();
      var ov = document.createElement('div');
      ov.id = 'seqdoc-overlay';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto';
      var onEsc, close = function () { ov.remove(); if (onEsc) document.removeEventListener('keydown', onEsc); };
      onEsc = function (e) { if (e.key === 'Escape') close(); };
      ov.innerHTML = '<div style="background:var(--bg2);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)">' +
        '<span style="font-size:14px;font-weight:600">Séquencier · ' + esc(code) + '</span>' +
        '<button type="button" id="seqdoc-x" class="lnk" aria-label="Fermer">✕ Fermer</button></div>' +
        '<div id="sq-doc-ov" style="padding:4px 2px;overflow:auto"><p class="sub" style="color:var(--txt3);padding:16px">Chargement du séquencier…</p></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); }); // clic sur le fond
      $('seqdoc-x').addEventListener('click', close);
      document.addEventListener('keydown', onEsc);
      mChargerSequencier(code, 'sq-doc-ov');
    }
    // Valider le séquencier → POST { action:'valider' }. Succès → on NE recharge PAS : le projet quitte
    // « À valider » et n'entre pas dans « En cours » (gardé par Visible, non posé en phase séquencier) ; un
    // rechargement ferait « s'évaporer » la carte, voire tomber sur l'écran de bienvenue. On remplace donc
    // le contenu de la carte par une confirmation qui reste à l'écran.
    function mValiderSequencier(code, el) {
      if (!code) return;
      if (el) { el.disabled = true; el.textContent = 'Validation…'; }
      mPost(SEQ, { action: 'valider', sujetCode: code }).then(function (res) {
        if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok) {
          var carte = el; while (carte && carte !== document.body && !(carte.className && /\batt\b/.test(carte.className))) carte = carte.parentNode;
          if (carte) carte.innerHTML = '<div class="att-m"><div class="att-t">Séquencier validé</div>' +
            '<div class="att-l" style="color:var(--txt2)">Le tournage peut démarrer. Vous retrouverez le film ici dès la première version.</div></div>';
          return;
        }
        if (el) { el.disabled = false; el.textContent = 'Réessayer la validation'; }
      }).catch(function () { if (el) { el.disabled = false; el.textContent = 'Réessayer la validation'; } });
    }
    // Demander des corrections → petit formulaire inline (texte) puis POST { action:'corrections' }. AUCUN
    // changement d'état côté serveur : c'est un message à l'équipe, le projet reste « À valider ».
    function mDemanderCorrections(code, el) {
      if (!code) return;
      var row = el; while (row && row !== document.body && !(row.className && /sq-actions/.test(row.className))) row = row.parentNode;
      if (!row) return;
      row.innerHTML = '<textarea class="sq-corr-txt" placeholder="Qu\'aimeriez-vous changer dans le séquencier ?" aria-label="Corrections souhaitées"></textarea>' +
        '<div class="sq-corr-bas"><button type="button" class="bouton sq-corr-send">Envoyer la demande</button>' +
        '<button type="button" class="lnk sq-corr-cancel">Annuler</button></div>' +
        '<div class="msg" role="status" aria-live="polite"></div>';
      var txt = row.querySelector('.sq-corr-txt'), send = row.querySelector('.sq-corr-send'), cancel = row.querySelector('.sq-corr-cancel'), msg = row.querySelector('.msg');
      if (txt) txt.focus();
      cancel.addEventListener('click', function () { chargerEspace(); }); // recharge → remet les boutons
      send.addEventListener('click', function () {
        var v = (txt.value || '').trim();
        if (!v) { msg.className = 'msg err'; msg.textContent = 'Décrivez les corrections souhaitées.'; return; }
        send.disabled = true; send.textContent = 'Envoi…';
        mPost(SEQ, { action: 'corrections', sujetCode: code, texte: v }).then(function (res) {
          if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
          if (res.status === 200 && res.body && res.body.ok) { msg.className = 'msg'; msg.textContent = 'Demande envoyée à l\'équipe.'; setTimeout(chargerEspace, 1200); return; }
          send.disabled = false; send.textContent = 'Envoyer la demande'; msg.className = 'msg err'; msg.textContent = 'Envoi impossible pour l\'instant. Réessayez.';
        }).catch(function () { send.disabled = false; send.textContent = 'Envoyer la demande'; msg.className = 'msg err'; msg.textContent = 'Envoi impossible pour l\'instant. Réessayez.'; });
      });
    }
    $('mt-retour').addEventListener('click', function (e) { e.preventDefault(); mQuitter(); });
    $('mt-deco').addEventListener('click', function (e) { e.preventDefault(); effacer(); allerLogin(''); }); // déconnexion depuis l'en-tête montage (parité avec lien-deco accueil)
    // ═══ FIN VUE MONTAGE ═══════════════════════════════════════════════════════════════════════════════

    // ── Démarrage : projets-client (via le jeton) est la source de vérité. ──
    // F1 : migration douce — un navigateur portant encore l'ancien stockage (mail+code) sans jeton est
    // PURGÉ et atterrit proprement sur la connexion, jamais sur une erreur.
    if (lire(K_TOKEN)) entrerAccueil();
    else { try { K_LEGACY.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} montrer('vue-login'); }
  })();
  </script>
</body>
</html>
