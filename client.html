<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace client · Réel Média</title>
  <!-- Lot G — HABILLAGE (PR 3). Balisage + CSS seulement : AUCUNE ligne de JavaScript touchée, tous les
       id/classes lus ou émis par le script préservés. Maquette MAQUETTE_ESPACE_CLIENT.html reproduite
       (carte bordée, accent ROUGE #E63946, logo SVG verbatim de review.html). Polices DM Sans/DM Mono
       AUTO-HÉBERGÉES (/fonts/, SIL OFL) — pas de Google Fonts (RGPD). -->
  <style>
    /* Polices AUTO-HÉBERGÉES (SIL OFL 1.1, /fonts/OFL.txt), font-display:swap — PAS de Google Fonts (RGPD).
       Les cinq fichiers servent : DM Sans 400/500/700 (bouton principal en 700), DM Mono 400/500 (codes en 500). */
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-sans-400.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-sans-500.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/dm-sans-700.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-mono-400.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-mono-500.woff2') format('woff2')}

    :root{
      --bg:#08080F; --bg2:#0F0F1A; --bg3:#16161F; --bg4:#1E1E2A;
      --line:#1E1E2A; --line2:#2A2A3A;
      --txt:#F0F0F5; --txt2:#9898B0; --txt3:#5A5A70;
      /* accent de la marque = ROUGE #E63946 (review.html --red) ; aucun bleu */
      --rouge:#E63946; --rouge-fort:#F04B57; --rouge-voile:rgba(230,57,70,.12); --rouge-bord:rgba(230,57,70,.30);
      --amber:#EF9F27; --amber-voile:rgba(239,159,39,.12); --amber-bord:rgba(239,159,39,.42);
      /* vert = validation (repris de la maquette VISION_ESPACE_CLIENT) */
      --vert:#1D9E75; --vert-voile:rgba(29,158,117,.12); --vert-bord:rgba(29,158,117,.32);
      --sans:'DM Sans',system-ui,-apple-system,sans-serif;
      --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;
         line-height:1.55;-webkit-font-smoothing:antialiased}
    .wrap{max-width:760px;margin:0 auto;
          padding-left:max(16px,env(safe-area-inset-left,0px));
          padding-right:max(16px,env(safe-area-inset-right,0px));
          padding-block:0 64px}

    /* ── écran 04 — connexion : carte bordée, tout aligné à gauche. Marque PAS affichée ici. ── */
    #vue-login{min-height:74vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:48px}
    .gate{width:100%;max-width:412px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;
          padding:30px 32px 32px;display:flex;flex-direction:column;align-items:stretch;gap:0}
    .gate-logo{display:flex;justify-content:flex-start;margin-bottom:21px}
    #vue-login h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;text-align:left}
    #vue-login .sub{color:var(--txt2);font-size:13.5px;line-height:1.5;margin:7px 0 0;text-align:left;max-width:34ch}
    #form-login{display:flex;flex-direction:column;gap:14px;margin-top:24px}
    .champ{display:flex;flex-direction:column;gap:7px}
    .champ > span:first-child{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt3)}
    input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);
          font-family:var(--sans);font-size:15px;padding:11px 13px;transition:border-color .12s,background .12s}
    input::placeholder{color:var(--txt3)}
    input:hover{border-color:#36364A}
    input:focus{outline:none;border-color:var(--rouge);background:var(--bg3)}
    #in-code{font-family:var(--mono);letter-spacing:.14em}
    .coderow{display:flex;gap:8px}
    .coderow input{flex:1;min-width:0}
    /* bouton secondaire Afficher/Masquer — discret, ne rivalise jamais avec l'action principale */
    #btn-voir{flex:none;background:var(--bg3);color:var(--txt2);border:1px solid var(--line2);border-radius:7px;
              font-family:var(--sans);font-size:13px;padding:0 15px;cursor:pointer;transition:color .12s,border-color .12s}
    #btn-voir:hover{color:var(--txt);border-color:#36364A}
    /* action principale : rouge plein, pleine largeur (comme « Ajouter à mes retours » dans review.html) */
    button.primary{width:100%;margin-top:4px;background:var(--rouge);color:#fff;border:1px solid var(--rouge);
                   font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.01em;
                   padding:12px 20px;border-radius:7px;cursor:pointer;transition:background .12s,border-color .12s}
    button.primary:hover{background:var(--rouge-fort);border-color:var(--rouge-fort)}
    button.primary:active{background:var(--rouge)}
    button.primary[disabled]{opacity:.45;cursor:not-allowed}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
    .msg{font-size:13.5px;min-height:19px;color:var(--txt2)}
    .msg.err{color:var(--rouge)}
    .msg.wait{color:var(--amber)}
    #msg-login{margin-top:13px}
    /* le filet traverse toute la carte */
    .ligne-aide{font-size:12.5px;color:var(--txt3);margin:16px 0 0;line-height:1.5;padding-top:16px;border-top:1px solid var(--line)}

    /* ── écran 05 — en-tête (traitement .head de la maquette) ── */
    .head{padding-block:40px 20px;border-bottom:1px solid var(--line);margin-bottom:26px}
    .head-mark{display:flex;align-items:center;gap:10px;margin-bottom:13px;font-family:var(--mono);
               font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)}
    #titre-projets{font-size:clamp(25px,5vw,33px);font-weight:500;letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
    .topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
    .topbar .id{font-size:13.5px;color:var(--txt2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
    /* déconnexion NEUTRE : le rouge est réservé aux actions principales */
    #lien-deco{color:var(--txt2);text-decoration:none;border-bottom:1px solid var(--line2)}
    #lien-deco:hover{color:var(--txt);border-bottom-color:var(--txt3)}

    /* ── écran 05 — la liste (balisage imposé : li > span.code + span). AUCUNE colonne inventée ── */
    ul.projets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
    ul.projets li{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:16px 18px;
                  display:flex;align-items:baseline;gap:16px;min-width:0;transition:border-color .12s,background .12s}
    ul.projets li:hover{background:var(--bg3);border-color:var(--line2)}
    /* pastille de code = motif .video-code de review.html : mono rouge sur voile rouge */
    ul.projets li .code{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;
                        color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);
                        padding:3px 8px;border-radius:4px}
    ul.projets li .code + span{font-size:15.5px;font-weight:500;letter-spacing:-.005em;min-width:0;overflow-wrap:anywhere}

    /* ── VIDE vs INDISPO : jamais confondus ── */
    .etat-vide{color:var(--txt2);font-size:14.5px;padding:30px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .etat-vide::before{content:'';display:block;width:22px;height:1px;background:var(--line2);margin-bottom:14px}
    .etat-indispo{border:1px solid var(--amber-bord);background:var(--amber-voile);color:var(--amber);
                  border-radius:9px;padding:17px 19px;font-size:14.5px}
    .etat-indispo button{margin-top:13px;background:transparent;color:var(--amber);border:1px solid var(--amber-bord);
                        font-family:var(--sans);font-size:13.5px;font-weight:500;padding:8px 15px;border-radius:6px;cursor:pointer;transition:background .12s}
    .etat-indispo button:hover{background:rgba(239,159,39,.18)}
    .etat-indispo button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

    .sub{color:var(--txt2);font-size:14px}  /* « Chargement… » (zone-projets / vue-chargement) */

    /* ── écran « Voir un montage » (tranche 2) — classes reprises de la maquette VISION_ESPACE_CLIENT ── */
    .mt-head{padding-block:28px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
    .retour-lien{font-size:13px;color:var(--txt2);text-decoration:none;display:inline-flex;align-items:center;gap:7px;border-bottom:1px solid transparent;margin-bottom:16px}
    .retour-lien:hover{color:var(--txt);border-bottom-color:var(--line2)}
    .rv-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:baseline}
    .rv-head h1{font-size:clamp(21px,4vw,27px);font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
    .rv-head .code{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:3px 8px;border-radius:4px}
    .rv-meta{font-family:var(--mono);font-size:11.5px;color:var(--txt3)}
    .vers{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
    .vch{font-family:var(--sans);font-size:12.5px;color:var(--txt2);background:transparent;border:1px solid var(--line2);border-radius:7px;padding:7px 12px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
    .vch[aria-selected="true"]{background:var(--bg4);color:var(--txt);border-color:#3A3A50}
    .vch .pt{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-left:7px}
    .vch[aria-selected="true"] .pt{color:var(--vert)}
    .vch:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
    .rv{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
    .col-v{display:flex;flex-direction:column;gap:10px;min-width:0}
    .scene{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .scene-v{aspect-ratio:9/16;height:410px;max-width:100%;background:linear-gradient(170deg,#1b1b24,#0b0b12);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
    .scene-grise{filter:grayscale(1);opacity:.55}
    .mt-iframe{width:100%;aspect-ratio:9/16;height:410px;max-width:100%;border:0;display:block;background:#000}
    .panneau{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
    .pan-t{padding:12px 15px;background:var(--bg3);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500}
    .pan-n{font-family:var(--mono);font-size:10px;color:var(--txt3);background:var(--bg4);padding:2px 7px;border-radius:9px}
    .retours{display:flex;flex-direction:column}
    .ret{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
    .ret-h{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
    .ret-tc{font-family:var(--mono);font-size:10px;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:1px 7px;border-radius:4px}
    .ret-cat{font-family:var(--mono);font-size:10px;color:var(--txt3);background:var(--bg4);padding:1px 7px;border-radius:4px}
    .ret-x{font-size:13.5px;color:var(--txt);line-height:1.5}
    .ret-brouillon{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid var(--amber);opacity:.85;padding:1px 7px;border-radius:4px}
    .ret-foot{display:flex;justify-content:flex-end;margin-top:2px}
    .ret-suppr{background:none;border:0;color:var(--txt3);font-size:11px;cursor:pointer;text-decoration:underline;padding:2px 0}
    .ret-suppr:hover{color:var(--rouge)}
    .ret-suppr:disabled{opacity:.5;cursor:default;text-decoration:none}
    .ret-reform{margin-top:2px;padding-left:11px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:3px}
    .ret-reform-by{font-family:var(--mono);font-size:10px;color:var(--txt3)}
    .ret-reform-x{font-size:13px;color:var(--txt2);line-height:1.5}
    .forme{border-top:1px solid var(--line);background:var(--bg3);padding:14px 15px;display:flex;flex-direction:column;gap:10px}
    .forme-t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3)}
    .forme-r{display:flex;gap:8px}
    .forme-r input{font-family:var(--mono);max-width:128px}
    .forme-r select{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:10px 12px}
    .forme textarea{width:100%;min-height:76px;resize:vertical;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:10px 12px}
    .forme textarea:focus,.forme-r select:focus,.forme-r input:focus{outline:none;border-color:var(--rouge);background:var(--bg3)}
    .fin{border-top:1px solid var(--line);padding:14px 15px;display:flex;flex-direction:column;gap:9px}
    .fin .bouton{width:100%;text-align:center}
    .fin-n{font-size:11.5px;color:var(--txt3);line-height:1.5;margin:0}
    .bouton{background:var(--rouge);color:#fff;border:1px solid var(--rouge);font-family:var(--sans);font-size:14px;font-weight:500;padding:10px 16px;border-radius:7px;cursor:pointer;transition:background .12s,border-color .12s}
    .bouton:hover{background:var(--rouge-fort);border-color:var(--rouge-fort)}
    .bouton[disabled]{opacity:.5;cursor:not-allowed}
    .bouton.vert{background:transparent;color:var(--vert);border-color:var(--vert-bord);font-weight:500}
    .bouton.vert:hover{background:var(--vert);color:#04150F;border-color:var(--vert)}
    .bouton.gris2{background:transparent;color:var(--txt2);border-color:var(--line2);font-weight:500}
    .bouton.gris2:hover{background:var(--bg4);color:var(--txt);border-color:var(--txt3)}
    .close{padding:15px;font-size:13px;line-height:1.5}
    .close.gris{background:var(--bg3);border-top:1px solid var(--line);color:var(--txt2)}
    .close.gris b{color:var(--txt);font-weight:600}
    .mt-bandeau{background:var(--amber-voile);border:1px solid var(--amber-bord);color:var(--amber);border-radius:8px;padding:11px 14px;font-size:13.5px;margin-bottom:16px}
    .voir-montage{flex:none;margin-left:auto;background:transparent;color:var(--rouge);border:1px solid var(--rouge-bord);font-family:var(--sans);font-size:12.5px;padding:6px 11px;border-radius:6px;cursor:pointer;transition:background .12s}
    .voir-montage:hover{background:var(--rouge-voile)}
    .lien-reessai{background:transparent;border:0;color:var(--amber);text-decoration:underline;cursor:pointer;font:inherit}
    @media (max-width:620px){ .rv{grid-template-columns:minmax(0,1fr)} .scene-v,.mt-iframe{height:min(420px,62vh)} }

    /* ── « Mon espace » — les cinq blocs (B2). Classes reprises de VISION_ESPACE_CLIENT, tokens identiques. ── */
    .maj{font-family:var(--mono);font-size:11px;color:var(--txt3)}
    h2{font-size:11.5px;font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);font-weight:400;margin:36px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
    h2 .n{color:var(--txt3);font-size:11px;font-variant-numeric:tabular-nums}
    h2:first-of-type{margin-top:0}
    .code{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:3px 8px;border-radius:4px}
    .lnk{font-size:12.5px;color:var(--txt2);text-decoration:none;border:1px solid var(--line2);background:var(--bg3);padding:6px 11px;border-radius:6px;display:inline-block;white-space:nowrap;cursor:pointer;transition:color .12s,border-color .12s}
    .lnk:hover{color:var(--txt);border-color:var(--txt3)}
    .attente{display:flex;flex-direction:column;gap:11px}
    .att{background:var(--bg2);border:1px solid var(--rouge-bord);border-left:3px solid var(--rouge);border-radius:9px;padding:17px 19px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
    .att-m{min-width:0;flex:1 1 260px;display:flex;flex-direction:column;gap:7px}
    .att-t{font-size:16px;font-weight:500;letter-spacing:-.005em}
    .att-l{display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:12.5px;color:var(--txt2)}
    .att-l .mono{font-family:var(--mono);font-size:11.5px;color:var(--txt3)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .stat{background:var(--bg2);padding:16px 17px 14px}
    .stat-n{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
    .stat-n.petit{font-size:17px;padding-block:5px 3px}
    .stat-l{font-size:11.5px;color:var(--txt2);margin-top:6px;display:block}
    .live{display:flex;flex-direction:column;gap:9px}
    .lrow{background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:8px;padding:15px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
    .lrow-m{min-width:0;flex:1 1 240px;display:flex;flex-direction:column;gap:5px}
    .lrow-t{font-size:15.5px;font-weight:500}
    .lrow-s{display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:12.5px;color:var(--txt2)}
    .lrow-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px} /* colonne droite d'une ligne En cours : pastille + « Revoir le montage » */
    .pill{flex:none;font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:4px;white-space:nowrap;background:var(--amber-voile);color:var(--amber);border:1px solid var(--amber-bord)}
    .etapes{display:flex;gap:4px;margin-top:9px;max-width:330px}
    .et{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
    .et-b{height:3px;border-radius:2px;background:var(--line2)}
    .et-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .et.fait .et-b{background:var(--txt3)} .et.fait .et-l{color:var(--txt2)}
    .et.ici .et-b{background:var(--amber)} .et.ici .et-l{color:var(--amber)}
    .tw{border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .t{width:100%;border-collapse:collapse;font-size:14.5px}
    .t th{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);font-weight:400;text-align:left;padding:11px 15px;background:var(--bg3);border-bottom:1px solid var(--line)}
    .t td{padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--bg2)}
    .t tr:last-child td{border-bottom:none}
    .t tr:hover td{background:var(--bg3)}
    .c-code{width:1%;white-space:nowrap}
    .c-t{min-width:0} .c-t b{font-weight:500;display:block} .c-t span{font-size:12px;color:var(--txt3)}
    .c-who{font-size:13px;color:var(--txt2);white-space:nowrap;width:1%}
    .c-d{font-family:var(--mono);font-size:12px;color:var(--txt2);white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
    .c-a{width:1%;white-space:nowrap}
    .replier{margin-top:13px;font-size:12.5px;color:var(--txt3);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
    .ref{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:15px 17px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500;background:var(--rouge-voile);color:var(--rouge);border:1px solid var(--rouge-bord)}
    .ref-b{min-width:0;flex:1 1 200px}

    function montrer(vue) {
      ['vue-chargement', 'vue-login', 'vue-accueil', 'vue-montage'].forEach(function (v) { $(v).classList.add('hidden'); });
      $(vue).classList.remove('hidden');
    }
    function lire(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function ecrire(o) { try { Object.keys(o).forEach(function (k) { localStorage.setItem(k, o[k]); }); } catch (e) {} }
    function effacer() { try { [K_TOKEN, K_NOM, K_MARQUE].concat(K_LEGACY).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    // esc() n'échappe PAS les guillemets (spec §8) → escAttr pour les valeurs serveur en position d'ATTRIBUT.
    function escAttr(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // ── Connexion ──
    $('btn-voir').addEventListener('click', function () {
      var c = $('in-code');
      var show = c.type === 'password';
      c.type = show ? 'text' : 'password';
      this.textContent = show ? 'Masquer' : 'Afficher';
    });

    $('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      var mail = $('in-mail').value.trim();
      var code = $('in-code').value;
      var msg = $('msg-login');
      msg.className = 'msg'; msg.textContent = '';
      $('btn-login').disabled = true;
      fetch(LOGIN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mail: mail, code: code })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b, retry: r.headers.get('Retry-After') }; });
      }).then(function (res) {
        $('btn-login').disabled = false;
        if (res.status === 200 && res.body && res.body.ok && res.body.token) {
          ecrire(fromLogin(res.body));
          entrerAccueil();
          return;
        }
        if (res.status === 429) { msg.className = 'msg wait'; msg.textContent = 'Trop de tentatives, réessayez dans ' + (res.retry || 'un instant') + (res.retry ? ' s.' : '.'); return; }
        if (res.status === 503) { msg.className = 'msg wait'; msg.textContent = 'Service temporairement indisponible, réessayez.'; return; }
        msg.className = 'msg err'; msg.textContent = 'Mail ou code incorrect.'; // 401 ou autre : générique
      }).catch(function () {
        $('btn-login').disabled = false;
        var m = $('msg-login'); m.className = 'msg wait'; m.textContent = 'Service temporairement indisponible, réessayez.';
      });
    });
    function fromLogin(b) { var o = {}; o[K_TOKEN] = b.token || ''; o[K_NOM] = b.nom || ''; o[K_MARQUE] = b.marque || ''; return o; } // F1 : on stocke le JETON, jamais le code

    // ── Accueil + projets ──
    $('lien-deco').addEventListener('click', function (e) { e.preventDefault(); effacer(); allerLogin(''); });

    function allerLogin(notice) {
      $('msg-login').className = notice ? 'msg wait' : 'msg';
      $('msg-login').textContent = notice || '';
      $('in-code').value = '';
      montrer('vue-login');
    }

    function entrerAccueil() {
      var nom = lire(K_NOM), marque = lire(K_MARQUE);
      $('bonjour').textContent = nom ? ('Bonjour ' + nom) : '';
      $('titre-projets').textContent = marque ? ('Vos projets · ' + marque) : 'Vos projets';
      montrer('vue-accueil');
      chargerEspace();
    }

    // ═══ MON ESPACE (B2) — les cinq blocs + premier accès, depuis espace-client (UN appel). ══════════════
    // Réserve 2 : !ok → « indisponible » distinct + Réessayer (jamais des blocs vides). ok → si TOUT est
    // vide (le quotidien : 87/89 projets Brand décochés, pas de rattrapage rétroactif) → PREMIER ACCÈS ;
    // sinon les blocs présents. Le premier accès est gardé sur ok===true → un 503 ne peut JAMAIS l'afficher.
    // Boutons « Voir le montage → » / « Revoir » : data-code → délégation #zone-projets (plus bas) →
    // ouvrirMontage. Toute valeur serveur en attribut passe par escAttr (esc() n'échappe pas les guillemets).
    var MOIS_FR = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    var MOIS_LG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    function dateFrLongue(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (parseInt(m[3], 10) + ' ' + MOIS_LG[parseInt(m[2], 10) - 1]) : ''; }
    function dateFrCourte(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (parseInt(m[3], 10) + ' ' + MOIS_FR[parseInt(m[2], 10) - 1] + ' ' + m[1]) : ''; }
    function initiales(nom) { return String(nom || '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }
    function refHtml(interlo) {
      if (!interlo || !interlo.nom) return '';
      return '<div class="ref"><div class="av">' + esc(initiales(interlo.nom)) + '</div>' +
        '<div class="ref-b"><div class="ref-n">' + esc(interlo.nom) + '</div><div class="ref-m">Votre référente chez Réel Média</div></div></div>';
    }

    function chargerEspace() {
      $('zone-projets').innerHTML = '<p class="sub">Chargement…</p>';
      fetch(ESPACE, { method: 'POST', headers: { 'x-rmc-token': lire(K_TOKEN) } })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); })
        .then(function (res) { renderEspace(res.status, res.body); })
        .catch(function () { espaceIndispo(); }); // réseau tombé → INDISPO, jamais un faux vide
    }
    function espaceIndispo() {
      $('zone-projets').innerHTML = '<div class="etat-indispo">Service temporairement indisponible.<div><button type="button" id="btn-reessayer">Réessayer</button></div></div>';
      $('btn-reessayer').addEventListener('click', chargerEspace);
    }

    function renderEspace(status, d) {
      if (status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
      if (status !== 200 || !d || !d.ok) { espaceIndispo(); return; } // 503/échec → distinct, jamais des blocs vides

      var aRelire = d.aRelire || [], enCours = d.enCours || [], livres = d.livres || [], col = d.collaboration || {};
      var zone = $('zone-projets');

      // PREMIER ACCÈS : ok ET rien à montrer (le cas normal au démarrage). Gardé sur ok===true → jamais sur panne.
      if (!aRelire.length && !enCours.length && !livres.length) {
        var nomP = lire(K_NOM);
        zone.innerHTML = '<div class="premier"><h3>Bienvenue dans votre espace' + (nomP ? (', ' + esc(nomP)) : '') + '.</h3>' +
          '<p>Vos films apparaîtront ici au fur et à mesure. Rien à installer, rien à télécharger — tout se passe sur cette page.</p>' +
          '<ul class="pts">' +
            '<li><span class="p">1</span><span>Quand un montage est prêt, il s\'affiche en haut, prêt à être regardé.</span></li>' +
            '<li><span class="p">2</span><span>Vous laissez vos retours sur l\'image, au moment précis qui vous gêne.</span></li>' +
            '<li><span class="p">3</span><span>Une fois validé, le film rejoint votre archive, consultable ici.</span></li>' +
          '</ul>' + refHtml(d.interlocutrice) + '</div>';
        return;
      }

      var h = '';
      // 1. À relire — bloc d'action, affiché seulement s'il y a quelque chose à relire.
      if (aRelire.length) {
        h += '<h2>À relire <span class="n">' + aRelire.length + '</span></h2><div class="attente">' +
          aRelire.map(function (p) {
            return '<div class="att"><div class="att-m"><div class="att-t">' + esc(p.titre) + '</div>' +
              '<div class="att-l"><span class="code">' + esc(p.code) + '</span><span>Version ' + (p.numero || '') + '</span>' +
              '<span class="mono">déposée le ' + esc(dateFrLongue(p.dateDeposee)) + '</span></div></div>' +
              '<button type="button" class="voir-montage" data-code="' + escAttr(p.code) + '">Voir le montage →</button></div>';
          }).join('') + '</div>';
      }
      // 2. Votre collaboration — toujours (hors premier accès).
      h += '<h2>Votre collaboration</h2><div class="stats">' +
        '<div class="stat"><span class="stat-n">' + (col.livres || 0) + '</span><span class="stat-l">films livrés</span></div>' +
        '<div class="stat"><span class="stat-n">' + (col.enCours || 0) + '</span><span class="stat-l">en cours</span></div>' +
        (col.depuis ? ('<div class="stat"><span class="stat-n petit">' + esc(col.depuis) + '</span><span class="stat-l">depuis</span></div>') : '') +
        '</div>';
      // 3. En cours (si présent). Barre à 4 étapes ; l'étape en-cours plafonne à Validation (2).
      if (enCours.length) {
        var LBL = ['Tournage', 'Montage', 'Validation', 'Diffusion'];
        h += '<h2>En cours <span class="n">' + enCours.length + '</span></h2><div class="live">' +
          enCours.map(function (p) {
            var etapes = LBL.map(function (l, i) { var c = i < p.etape ? 'et fait' : (i === p.etape ? 'et ici' : 'et'); return '<div class="' + c + '"><div class="et-b"></div><div class="et-l">' + l + '</div></div>'; }).join('');
            var pill = p.pastille && p.pastille.texte ? '<span class="pill">' + esc(p.pastille.texte) + '</span>' : '';
            // Point d'entrée montage SEULEMENT si aMontage (une version client existe ET pas déjà dans À
            // relire) → un seul bouton par film, et « Revoir » n'apparaît jamais sur un film jamais vu.
            var entree = p.aMontage ? '<button type="button" class="lnk" data-code="' + escAttr(p.code) + '">Revoir le montage</button>' : '';
            return '<div class="lrow"><div class="lrow-m"><div class="lrow-t">' + esc(p.titre) + '</div>' +
              '<div class="lrow-s"><span class="code">' + esc(p.code) + '</span><span>' + esc(p.realisePar) + '</span></div>' +
              '<div class="etapes">' + etapes + '</div></div>' +
              '<div class="lrow-r">' + pill + entree + '</div></div>';
          }).join('') + '</div>';
      }
      // 4. Livrés (si présent) — plus récents d'abord ; au-delà de 4, le reste se replie (spec §6.1).
      if (livres.length) {
        var SEUIL = 4;
        var ligne = function (p) {
          return '<tr><td class="c-code"><span class="code">' + esc(p.code) + '</span></td>' +
            '<td class="c-t"><b>' + esc(p.titre) + '</b>' + ((p.sousFormat || p.duree) ? ('<span>' + esc([p.sousFormat, p.duree].filter(Boolean).join(' · ')) + '</span>') : '') + '</td>' +
            '<td class="c-who">' + esc(p.realisePar) + '</td><td class="c-d">' + esc(dateFrCourte(p.dateDiffusion)) + '</td>' +
            '<td class="c-a"><a class="lnk" href="#" data-code="' + escAttr(p.code) + '">Revoir</a></td></tr>';
        };
        var visibles = livres.slice(0, SEUIL), caches = livres.slice(SEUIL);
        h += '<h2>Livrés <span class="n">' + livres.length + '</span></h2><div class="tw"><table class="t">' +
          '<thead><tr><th>Code</th><th>Film</th><th>Réalisé par</th><th>Diffusion</th><th></th></tr></thead>' +
          '<tbody>' + visibles.map(ligne).join('') + '</tbody>' +
          (caches.length ? ('<tbody id="livres-caches" class="hidden">' + caches.map(ligne).join('') + '</tbody>') : '') +
          '</table></div>' +
          (caches.length ? ('<div class="replier" id="livres-replier"><span>' + caches.length + ' film' + (caches.length > 1 ? 's' : '') + ' plus anciens</span><a class="lnk" href="#" id="livres-toutafficher">Tout afficher</a></div>') : '');
      }
      // 5. Votre interlocutrice — masquée si null (jamais de ligne générique).
      if (d.interlocutrice && d.interlocutrice.nom) h += '<h2>Votre interlocutrice</h2>' + refHtml(d.interlocutrice);

      zone.innerHTML = h;
      var tout = $('livres-toutafficher');
      if (tout) tout.addEventListener('click', function (e) { e.preventDefault(); var c = $('livres-caches'); if (c) c.classList.remove('hidden'); var rp = $('livres-replier'); if (rp) rp.style.display = 'none'; });
    }

    // ════════════════════════════════════════════════════════════════════════════════════════════════
    // ═══ VUE MONTAGE (tranche 2) — TOUT le JavaScript de l'écran « Voir un montage » tient dans ce bloc.
    // Lectures (montage-client), vidéo (drive-view-client), actions terminales (valider-client). Dépend
    // seulement des helpers existants ($, lire, esc, montrer, effacer, allerLogin). Aucune logique montage
    // ailleurs dans l'IIFE ; seuls un bouton d'entrée (rendre LISTE) et escAttr ont été ajoutés en dehors.
    // ════════════════════════════════════════════════════════════════════════════════════════════════

    // Les HUIT catégories FERMÉES de 📋 Retours (alignées sur montage-client.js qui valide contre elles ;
    // la maquette montrait une autre liste — incompatible, on suit le serveur). Hors liste → le serveur omet.
    var CATS = ['🔊 Audio', '🖼 Image', '🎬 Rush', '🎨 Graphisme', '📺 Accroche', '💬 Sous-titres', '🎤 Voix', '🎵 Musique'];
    var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    var ETIQ = { 'a-relire': 'à relire', 'retours-envoyes': 'retours envoyés', 'validee': 'validée' };

    // État de la vue en cours. fileId = SEULEMENT celui de la courante (jamais une version passée).
    var M = { code: '', rangAff: 0, nbVersions: 0, fileId: '', hb: null, notice: '' };

    function mFmtDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? (parseInt(m[3], 10) + ' ' + MOIS[parseInt(m[2], 10) - 1]) : ''; }
    function mBattementsStop() { if (M.hb) { clearInterval(M.hb); M.hb = null; } }
    function mQuitter() { mBattementsStop(); M.fileId = ''; montrer('vue-accueil'); }

    function ouvrirMontage(code) { mBattementsStop(); M.code = code; M.rangAff = 0; M.nbVersions = 0; M.fileId = ''; M.notice = ''; montrer('vue-montage'); mCharger(); }

    function mPost(url, corps) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-rmc-token': lire(K_TOKEN) }, body: JSON.stringify(corps) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); });
    }

    // ── Lecture : UN appel qui peint tout le shell (titre, pastilles, panneau). La vidéo suit en 2e appel. ──
    function mCharger(rang) {
      $('mt-corps').innerHTML = '<p class="sub">Chargement…</p>';
      var corps = { action: 'lire', sujetCode: M.code };
      if (rang) corps.rang = rang;
      mPost(MONTAGE, corps).then(function (res) { mRendre(res.status, res.body); }).catch(function () { mIndispo(); });
    }

    function mRendre(status, data) {
      if (status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
      if (status !== 200 || !data || !data.ok) { mIndispo(); return; }  // 503/échec → distinct d'un vide
      $('mt-titre').textContent = data.titre || 'Montage';
      $('mt-code').textContent = M.code;
      M.nbVersions = (data.versions || []).length;
      // notice one-shot (ex. péremption) affichée en tête, puis consommée
      $('mt-notice').innerHTML = M.notice ? ('<div class="mt-bandeau">' + esc(M.notice) + '</div>') : '';
      M.notice = '';
      // courante null = VRAI vide (exposé, rien encore envoyé) — surtout pas une erreur, pas de lecteur/formulaire
      if (!data.courante) { mVide(); return; }

      var aff = data.affichee ? data.affichee.rang : data.courante.rang;
      M.rangAff = aff;
      var vAff = data.versions[aff - 1];
      var estCourante = (aff === data.courante.rang);
      $('mt-meta').textContent = vAff ? ('Version ' + vAff.rang + ' · déposée le ' + mFmtDate(vAff.dateEnvoi)) : '';

      $('mt-vers').innerHTML = data.versions.map(function (v) {
        return '<button class="vch" role="tab" type="button" data-rang="' + v.rang + '" aria-selected="' + (v.rang === aff) + '">Version ' + v.rang + '<span class="pt">' + esc(ETIQ[v.etat] || '') + '</span></button>';
      }).join('');

      var rets = data.retours || [];
      var retoursHtml = rets.length ? rets.map(function (r) {
        // Reformulation de l'équipe (comment la demande a été comprise) : sous le retour, motif identique à
        // review (« ↳ Reformulé par … »). Affiché seulement si l'équipe a reformulé. Tout échappé.
        var reform = r.reformulation ? ('<div class="ret-reform"><span class="ret-reform-by">↳ Reformulé par ' +
          esc(r.reformulePar || "l'équipe") + (r.timecodeReformule ? ' · ' + esc(r.timecodeReformule) : '') + '</span>' +
          '<span class="ret-reform-x">' + esc(r.reformulation) + '</span></div>') : '';
        // Brouillon = pas encore envoyé. Badge pour tous ; bouton Supprimer SEULEMENT sur MON brouillon de la
        // version COURANTE (r.mien + estCourante). Le serveur re-vérifie toutes les gardes de toute façon.
        var badge = r.brouillon ? '<span class="ret-brouillon">brouillon · non envoyé</span>' : '';
        var suppr = (r.brouillon && r.mien && estCourante && r.id)
          ? '<div class="ret-foot"><button class="ret-suppr" type="button" data-id="' + escAttr(r.id) + '">Supprimer</button></div>' : '';
        return '<div class="ret"><div class="ret-h"><span class="ret-tc">' + esc(r.timecode || '—') + '</span>' +
          (r.categorie ? '<span class="ret-cat">' + esc(r.categorie) + '</span>' : '') + badge + '</div>' +
          '<div class="ret-x">' + esc(r.texte) + '</div>' + reform + suppr + '</div>';
      }).join('') : '<div class="ret"><div class="ret-x" style="color:var(--txt3)">Aucun retour sur cette version.</div></div>';

      // Formulaire + actions SEULEMENT sur la courante OUVERTE ; sinon bandeau de version close (pas de formulaire grisé).
      var formulaire = (estCourante && vAff.etat === 'a-relire');
      var bas = formulaire ? (mFormeHtml() + mFinHtml()) : ('<div class="close gris"><b>' + esc(mBandeauEtat(vAff.etat)) + '</b></div>');

      // Vidéo : TOUTE version affichée a un lecteur (tranche 4 : la condition 4 est tombée, les versions
      // passées se regardent aussi). Le lecteur s'ouvre par RANG (drive-view-client résout le fileId).
      var scene = '<div class="scene" id="mt-scene"><div class="scene-v"><p class="sub" style="color:var(--txt3)">Chargement de la vidéo…</p></div></div>';

      // Téléchargement : sur CHAQUE version envoyée. Le serveur résout le fichier à partir du RANG ; aucun
      // fileId de version ne descend dans la page.
      var telHtml = '<button class="bouton gris2" type="button" id="mt-tel">⬇ Télécharger cette version</button>' +
        '<div class="msg" id="mt-tel-msg" role="status" aria-live="polite"></div>';

      $('mt-corps').innerHTML = '<div class="rv"><div class="col-v">' + scene + telHtml + '</div>' +
        '<div class="panneau"><div class="pan-t"><span>Mes retours</span><span class="pan-n">' + rets.length + '</span></div>' +
        '<div class="retours">' + retoursHtml + '</div>' + bas + '</div></div>';

      // Bouton télécharger : présent pour TOUTE version affichée (courante ou passée), donc câblé hors du
      // bloc formulaire. Le rang téléchargé est celui de la version affichée.
      $('mt-tel').addEventListener('click', function () { mTelecharger(aff); });

      // Suppression de MON brouillon (courante). Délégation sur chaque bouton rendu ci-dessus.
      [].slice.call($('mt-corps').querySelectorAll('.ret-suppr')).forEach(function (b) {
        b.addEventListener('click', function () { mSupprimer(b.getAttribute('data-id'), b); });
      });

      if (formulaire) {
        $('mt-ajout').addEventListener('click', mAjouter);
        $('mt-valider').addEventListener('click', function () { mTerminal('valider'); });
        $('mt-envoyer').addEventListener('click', function () { mTerminal('envoyer-retours'); });
        // Timecode : formatage identique à review.html/index.html (0035 → 0:35), + ESPACE qui convertit
        // et saute à la description (l'espace est avalée). Le cap serveur (MAX_TC) reste inchangé.
        var tcEl = $('mt-tc');
        tcEl.addEventListener('blur', function () { mFormatTc(tcEl); });
        tcEl.addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); mFormatTc(tcEl); var d = $('mt-txt'); if (d) d.focus(); } });
      }
      [].slice.call($('mt-vers').querySelectorAll('.vch')).forEach(function (b) {
        b.addEventListener('click', function () { var rg = parseInt(b.getAttribute('data-rang'), 10); if (rg !== M.rangAff) { mBattementsStop(); M.fileId = ''; mCharger(rg); } });
      });

      // 2e appel, APRÈS le rendu du shell : ouvre la permission Drive pour la version AFFICHÉE (courante OU
      // passée — toute version envoyée se regarde) par son RANG, puis monte l'iframe (remplissage localisé).
      mOuvrirVideo(aff);
    }

    // Copie STRICTE de formatTc (review.html / index.html) : chiffres seuls → « min:ss ».
    function mFormatTc(input) {
      var d = String(input.value || '').replace(/[^0-9]/g, '');
      if (!d) { input.value = ''; return; }
      var sec = d.slice(-2);
      while (sec.length < 2) sec = '0' + sec;
      var min = d.length > 2 ? String(parseInt(d.slice(0, -2), 10)) : '0';
      input.value = min + ':' + sec;
    }
    function mFormeHtml() {
      var opts = CATS.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
      return '<div class="forme"><div class="forme-t">Laisser un retour</div>' +
        '<div class="forme-r"><input type="text" id="mt-tc" placeholder="00:00" aria-label="Timecode">' +
        '<select id="mt-cat" aria-label="Catégorie"><option value="">— Catégorie —</option>' + opts + '</select></div>' +
        '<textarea id="mt-txt" placeholder="Décrivez votre retour…" aria-label="Votre retour"></textarea>' +
        '<button class="bouton" type="button" id="mt-ajout">Ajouter à mes retours</button>' +
        '<div class="msg" id="mt-forme-msg" role="status" aria-live="polite"></div></div>';
    }
    function mFinHtml() {
      return '<div class="fin"><div class="forme-t">Quand vous avez terminé</div>' +
        '<button class="bouton vert" type="button" id="mt-valider">Valider cette version</button>' +
        '<button class="bouton gris2" type="button" id="mt-envoyer">Envoyer mes retours</button>' +
        '<p class="fin-n">Valider clôt le film : il part en diffusion tel quel. Envoyer vos retours clôt ce tour de relecture et lance une nouvelle version. Dans les deux cas l\'équipe est prévenue tout de suite.</p>' +
        '<div class="msg" id="mt-fin-msg" role="status" aria-live="polite"></div></div>';
    }
    function mBandeauEtat(etat) {
      if (etat === 'validee') return 'Vous avez validé cette version. Le film part en diffusion.';
      if (etat === 'retours-envoyes') return 'Vous avez envoyé vos retours sur cette version. Une nouvelle version suivra.';
      return 'Cette version est close.';
    }

    // ── Vidéo : ouvre la permission (drive-view-client), puis iframe par PROPRIÉTÉ DOM (jamais innerHTML :
    //    esc() n'échappe pas les guillemets d'attribut — ne pas « simplifier » en innerHTML, spec §8). ──
    function mOuvrirVideo(rang) {
      // open par RANG : le serveur résout et RENVOIE le fileId (on ne l'a plus d'avance). On le garde pour
      // les battements et le close. L'iframe est montée par propriété DOM (jamais innerHTML, spec §8).
      mPost(DRIVEVIEW, { action: 'open', sujetCode: M.code, rang: rang }).then(function (res) {
        if (!$('mt-scene')) return; // l'utilisateur a changé de version entre-temps
        if (res.status === 200 && res.body && res.body.ok && res.body.fileId) { M.fileId = res.body.fileId; mMonterIframe(res.body.fileId); mBattementsDemarrer(); }
        else if (res.status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); }
        else mSceneIndispo();
      }).catch(function () { if ($('mt-scene')) mSceneIndispo(); });
    }
    function mMonterIframe(fileId) {
      var scene = $('mt-scene'); if (!scene) return;
      scene.innerHTML = '';
      var f = document.createElement('iframe');
      f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/preview'; // propriété DOM, pas d'attribut HTML
      f.className = 'mt-iframe';
      f.setAttribute('allow', 'autoplay');
      f.setAttribute('allowfullscreen', '');
      scene.appendChild(f);
    }
    function mSceneIndispo() {
      var scene = $('mt-scene'); if (!scene) return;
      scene.innerHTML = '<div class="scene-v"><p class="sub" style="color:var(--amber)">Vidéo indisponible pour l\'instant. <button type="button" class="lien-reessai" id="mt-video-reessai">Réessayer</button></p></div>';
      $('mt-video-reessai').addEventListener('click', function () { mOuvrirVideo(M.rangAff); });
    }

    // ── Suppression de MON brouillon non envoyé. Le serveur re-vérifie toutes les gardes (appartenance au
    //    contact, Source Client, même sujet, version courante, Brouillon:true) et ARCHIVE (ne détruit pas).
    //    Succès → on recharge la version affichée (le brouillon disparaît). 409 = déjà envoyé → notice, jamais
    //    supprimé. 401 → session expirée. ──
    function mSupprimer(retourId, btn) {
      if (!retourId) return;
      if (btn) { btn.disabled = true; btn.textContent = 'Suppression…'; }
      mPost(MONTAGE, { action: 'supprimer-brouillon', sujetCode: M.code, retourId: retourId }).then(function (res) {
        if (res.status === 401) { mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok) { mCharger(M.rangAff); return; }
        if (res.status === 409) { M.notice = 'Ce retour a déjà été envoyé : il n\'a pas été supprimé.'; mCharger(M.rangAff); return; }
        M.notice = 'Suppression impossible pour l\'instant. Réessayez.'; mCharger(M.rangAff);
      }).catch(function () { M.notice = 'Suppression impossible pour l\'instant. Réessayez.'; mCharger(M.rangAff); });
    }

    // ── Téléchargement d'une version par son RANG. Le serveur résout le fichier et renvoie un downloadUrl
    //    éphémère (révoqué aussitôt) ; aucun fileId ne descend dans la page. Fenêtre nommée ouverte AU CLIC
    //    (geste utilisateur → pas bloquée par l'anti-popup), remplie après le POST ; réutilisée aux clics
    //    suivants. 401 → session expirée. Échec → message, et on ferme la fenêtre d'attente. ──
    function mTelecharger(rang) {
      var btn = $('mt-tel'), msg = $('mt-tel-msg');
      var win = window.open('', 'rmc-download');
      if (btn) { btn.disabled = true; }
      if (msg) { msg.textContent = 'Préparation…'; msg.style.color = ''; }
      mPost(DOWNLOAD, { sujetCode: M.code, rang: rang }).then(function (res) {
        if (res.status === 401) { if (win && !win.closed) win.close(); mBattementsStop(); effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        if (res.status === 200 && res.body && res.body.ok && res.body.downloadUrl) {
          if (win && !win.closed) win.location = res.body.downloadUrl;
          else { var a = document.createElement('a'); a.href = res.body.downloadUrl; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
          if (msg) { msg.textContent = 'Téléchargement lancé.'; }
        } else {
          if (win && !win.closed) win.close();
          if (msg) { msg.textContent = 'Téléchargement indisponible pour l\'instant. Réessayez.'; msg.style.color = 'var(--amber)'; }
        }
      }).catch(function () {
        if (win && !win.closed) win.close();
        if (msg) { msg.textContent = 'Téléchargement indisponible pour l\'instant. Réessayez.'; msg.style.color = 'var(--amber)'; }
      }).then(function () { if (btn) btn.disabled = false; });
    }

    // ── Battements : 60 s tant que la vue est ouverte (PAS conditionné à lecture/pause → une pause < idle
    //    3 min ne tue pas la session). alive:false → ré-ouverture transparente. Retour d'onglet → battre tout
    //    de suite (couvre le throttling des minuteurs d'arrière-plan). ──
    function mBattementsDemarrer() { mBattementsStop(); M.hb = setInterval(mBattre, 60000); }
    function mBattre() {
      if (!M.fileId || $('vue-montage').classList.contains('hidden')) return;
      mPost(DRIVEVIEW, { action: 'heartbeat', fileId: M.fileId }).then(function (res) {
        if (res.body && res.body.alive === false) mOuvrirVideo(M.rangAff); // session morte → ré-ouvrir transparent (par rang)
      }).catch(function () {});
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden && M.fileId && !$('vue-montage').classList.contains('hidden')) mBattre(); });

    // ── Ajout d'un retour (réversible) : recharge le panneau au succès. ──
    function mAjouter() {
      var txt = $('mt-txt').value.trim(), tc = $('mt-tc').value.trim(), cat = $('mt-cat').value, msg = $('mt-forme-msg');
      msg.className = 'msg'; msg.textContent = '';
      if (!txt) { msg.className = 'msg err'; msg.textContent = 'Décrivez votre retour.'; return; }
      $('mt-ajout').disabled = true;
      mPost(MONTAGE, { action: 'ajouter-retour', sujetCode: M.code, texte: txt, timecode: tc, categorie: cat }).then(function (res) {
        if (res.status === 200 && res.body && res.body.ok) { mCharger(M.rangAff); return; } // panneau rechargé → le retour apparaît
        if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        var m = $('mt-forme-msg'); if (m) { m.className = 'msg wait'; m.textContent = 'Service indisponible, réessayez.'; }
        var b = $('mt-ajout'); if (b) b.disabled = false;
      }).catch(function () { var m = $('mt-forme-msg'); if (m) { m.className = 'msg wait'; m.textContent = 'Service indisponible, réessayez.'; } var b = $('mt-ajout'); if (b) b.disabled = false; });
    }

    // ── Actions terminales : nbVersions = ce que la vue a affiché (garde de péremption serveur). ──
    function mTerminal(action) {
      var bV = $('mt-valider'), bE = $('mt-envoyer'); if (bV) bV.disabled = true; if (bE) bE.disabled = true;
      mPost(VALIDER, { action: action, sujetCode: M.code, nbVersions: M.nbVersions }).then(function (res) {
        if (res.status === 200 && res.body && res.body.ok) { mCharger(); return; }   // recharge → état bascule, formulaire→bandeau
        if (res.status === 409 && res.body && res.body.perime) {                     // une version plus récente est arrivée
          M.notice = 'Une version plus récente est arrivée. On recharge votre espace.'; mCharger(); return;
        }
        if (res.status === 401) { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
        var m = $('mt-fin-msg'); if (m) { m.className = 'msg wait'; m.textContent = (res.body && res.body.error) || 'Action impossible, réessayez.'; }
        if (bV) bV.disabled = false; if (bE) bE.disabled = false;
      }).catch(function () { var m = $('mt-fin-msg'); if (m) { m.className = 'msg wait'; m.textContent = 'Service indisponible, réessayez.'; } if (bV) bV.disabled = false; if (bE) bE.disabled = false; });
    }

    function mVide() { mBattementsStop(); M.fileId = ''; $('mt-vers').innerHTML = ''; $('mt-meta').textContent = ''; $('mt-corps').innerHTML = '<div class="etat-vide">Aucune version à relire pour l\'instant. Vous serez prévenu·e dès qu\'un montage est prêt.</div>'; }
    function mIndispo() { mBattementsStop(); M.fileId = ''; $('mt-vers').innerHTML = ''; $('mt-meta').textContent = ''; $('mt-corps').innerHTML = '<div class="etat-indispo">Service temporairement indisponible.<div><button type="button" id="mt-reessayer">Réessayer</button></div></div>'; $('mt-reessayer').addEventListener('click', function () { mCharger(M.rangAff || undefined); }); }

    // Entrées & sortie (délégation : le bouton « Voir le montage → » est rendu par rendre LISTE).
    // Délégation : tout élément porteur d'un data-code dans l'accueil (« Voir le montage → » de À relire,
    // « Revoir » des Livrés) ouvre la vue montage. On clé sur data-code, pas sur une classe de style.
    $('zone-projets').addEventListener('click', function (e) {
      var t = e.target; while (t && t !== this && !(t.getAttribute && t.getAttribute('data-code'))) t = t.parentNode;
      if (t && t !== this && t.getAttribute && t.getAttribute('data-code')) { e.preventDefault(); ouvrirMontage(t.getAttribute('data-code')); }
    });
    $('mt-retour').addEventListener('click', function (e) { e.preventDefault(); mQuitter(); });
    // ═══ FIN VUE MONTAGE ═══════════════════════════════════════════════════════════════════════════════

    // ── Démarrage : projets-client (via le jeton) est la source de vérité. ──
    // F1 : migration douce — un navigateur portant encore l'ancien stockage (mail+code) sans jeton est
    // PURGÉ et atterrit proprement sur la connexion, jamais sur une erreur.
    if (lire(K_TOKEN)) entrerAccueil();
    else { try { K_LEGACY.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} montrer('vue-login'); }
  })();
  </script>
</body>
</html>
