<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace client · Réel Média</title>
  <!-- Lot G — HABILLAGE (PR 3). Balisage + CSS seulement : aucune ligne de JavaScript touchée (la logique
       des PR 1/2 est figée), tous les id/classes lus ou émis par le script sont préservés au caractère près.
       Gamme de fond reprise VERBATIM de review.html ; typographie DM Sans / DM Mono AUTO-HÉBERGÉES
       (SIL OFL 1.1, /fonts/) — pas de Google Fonts, aucune IP client transmise à un tiers (RGPD). -->
  <style>
    /* Polices auto-hébergées. woff2 latin (extraits de @fontsource), font-display:swap. Licence : /fonts/OFL.txt */
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-sans-400.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-sans-500.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/dm-sans-700.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-mono-400.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-mono-500.woff2') format('woff2')}

    :root{
      /* fond + texte : repris VERBATIM de review.html (--bg4 et --line partagent #1E1E2A, ce n'est pas une coquille) */
      --bg:#08080F; --bg2:#0F0F1A; --bg3:#16161F; --bg4:#1E1E2A;
      --line:#1E1E2A; --line2:#2A2A3A;
      --txt:#F0F0F5; --txt2:#9898B0; --txt3:#5A5A70;
      --green:#1D9E75; --amber:#EF9F27; --blue:#378ADD; --purple:#7F77DD;
      --sans:'DM Sans',system-ui,-apple-system,sans-serif;
      --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;
         line-height:1.5;-webkit-font-smoothing:antialiased}
    .wrap{max-width:880px;margin:0 auto;padding:24px 16px}
    .hidden{display:none}
    :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

    /* ── Écran 04 — entrée : bloc étroit centré verticalement ── */
    .gate{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:20px;text-align:center;padding-block:48px}
    .gate-mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt3)}
    .gate h1{font-size:clamp(26px,5vw,36px);font-weight:500;margin:0;letter-spacing:-.02em;text-wrap:balance}
    .gate-intro{color:var(--txt2);font-size:14px;max-width:38ch;margin:0}
    .gate-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:left}
    .champ{display:flex;flex-direction:column;gap:5px}
    .champ-lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3)}
    .gate-form input{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);font-family:var(--mono);
                     font-size:15px;padding:11px 14px;border-radius:6px;width:100%}
    .gate-form input:focus{outline:none;border-color:var(--blue)}
    #in-code{letter-spacing:.18em}                 /* espacement sur le CODE seulement (la maquette), pas sur le mail */
    .coderow{display:flex;gap:8px}
    .coderow input{flex:1}
    .btn{background:var(--bg4);color:var(--txt);border:1px solid #454545;font-family:var(--sans);
         font-size:14px;font-weight:500;padding:11px 20px;border-radius:6px;cursor:pointer}
    .btn:hover{background:#2a2a2a}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .btn-code{padding:11px 14px;color:var(--txt2)}  /* Afficher / Masquer : discret */
    .btn-go{width:100%}
    .msg{font-size:13px;min-height:18px;margin:2px 0 0}
    .msg.err{color:#ff6b6b}        /* 401 : rouge sobre */
    .msg.wait{color:var(--amber)}  /* 429 / 503 : attente */
    .gate-note{font-size:12px;color:var(--txt3);max-width:40ch;margin:0}

    /* ── Écran 05 — en-tête (traitement .head de la maquette) + liste ── */
    .head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
    .head-mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt3)}
    #titre-projets{font-size:clamp(22px,4vw,30px);font-weight:500;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
    .head-id{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--txt2)}
    .head-id a{color:var(--blue);text-decoration:none}
    .head-id a:hover{text-decoration:underline}

    .sub{color:var(--txt2);font-size:13px;margin:0}  /* « Chargement… » */

    /* LISTE — deux infos par ligne (code + titre), AUCUNE colonne inventée */
    ul.projets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
    ul.projets li{display:flex;gap:12px;align-items:baseline;background:var(--bg2);border:1px solid var(--line);
                  border-radius:8px;padding:13px 15px}
    ul.projets li .code{font-family:var(--mono);font-size:12px;color:var(--txt3);
                        font-variant-numeric:tabular-nums;letter-spacing:.04em;flex-shrink:0;min-width:52px}
    ul.projets li span:last-child{font-size:15px;font-weight:500;color:var(--txt);text-wrap:balance}

    /* VIDE — constat calme : pas de bordure, pas de bouton */
    .etat-vide{color:var(--txt2);font-style:italic;padding:20px 2px}

    /* INDISPO — seule occurrence de l'ambre : alerte réessayable, distincte de VIDE au premier coup d'œil */
    .etat-indispo{border:1px solid var(--amber);background:rgba(239,159,39,.12);color:var(--amber);
                  border-radius:8px;padding:14px 15px;font-size:14px}
    .etat-indispo button{margin-top:10px;background:transparent;color:var(--amber);border:1px solid var(--amber);
                        font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer}
    .etat-indispo button:hover{background:rgba(239,159,39,.18)}

    @media (max-width:620px){
      .wrap{padding:18px 14px}
      .gate{min-height:70vh;padding-block:32px}
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Chargement initial (anti-flash login→accueil) -->
    <div id="vue-chargement">
      <p class="sub">Chargement…</p>
    </div>

    <!-- Écran 04 — connexion. AUCUNE marque affichée : on ne sait pas encore qui frappe à la porte. -->
    <div id="vue-login" class="hidden">
      <div class="gate">
        <div class="gate-mark">Réel Média</div>
        <h1>Espace client</h1>
        <p class="gate-intro">Connectez-vous pour accéder à vos projets.</p>
        <form id="form-login" class="gate-form" autocomplete="off">
          <label class="champ">
            <span class="champ-lab">Votre mail</span>
            <input id="in-mail" type="email" autocomplete="username" required>
          </label>
          <label class="champ">
            <span class="champ-lab">Votre code</span>
            <span class="coderow">
              <input id="in-code" type="password" autocomplete="off" required>
              <button type="button" id="btn-voir" class="btn btn-code">Afficher</button>
            </span>
          </label>
          <button type="submit" id="btn-login" class="btn btn-go">Se connecter</button>
        </form>
        <div id="msg-login" class="msg" role="status" aria-live="polite"></div>
        <p class="gate-note">Code oublié ? Contactez votre interlocuteur habituel chez Réel Média.</p>
      </div>
    </div>

    <!-- Écran 05 — accueil + projets -->
    <div id="vue-accueil" class="hidden">
      <header class="head">
        <div class="head-mark">Réel Média</div>
        <h1 id="titre-projets">Vos projets</h1>
        <div class="head-id"><span id="bonjour"></span><a href="#" id="lien-deco">Déconnexion</a></div>
      </header>
      <div id="zone-projets" role="status" aria-live="polite"></div>
    </div>

  </div>

  <script src="/client-etat.js"></script>
  <script>
  (function () {
    var LOGIN = '/.netlify/functions/login-client';
    var PROJETS = '/.netlify/functions/projets-client';
    var K_TOKEN = 'rmc-token', K_NOM = 'rmc-nom', K_MARQUE = 'rmc-marque';
    var K_LEGACY = ['rmc-mail', 'rmc-code']; // F1 : anciennes clés (code en clair) — purgées, plus jamais écrites

    var $ = function (id) { return document.getElementById(id); };
    function montrer(vue) {
      ['vue-chargement', 'vue-login', 'vue-accueil'].forEach(function (v) { $(v).classList.add('hidden'); });
      $(vue).classList.remove('hidden');
    }
    function lire(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
    function ecrire(o) { try { Object.keys(o).forEach(function (k) { localStorage.setItem(k, o[k]); }); } catch (e) {} }
    function effacer() { try { [K_TOKEN, K_NOM, K_MARQUE].concat(K_LEGACY).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // ── Connexion ──
    $('btn-voir').addEventListener('click', function () {
      var c = $('in-code');
      var show = c.type === 'password';
      c.type = show ? 'text' : 'password';
      this.textContent = show ? 'Masquer' : 'Afficher';
    });

    $('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      var mail = $('in-mail').value.trim();
      var code = $('in-code').value;
      var msg = $('msg-login');
      msg.className = 'msg'; msg.textContent = '';
      $('btn-login').disabled = true;
      fetch(LOGIN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mail: mail, code: code })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b, retry: r.headers.get('Retry-After') }; });
      }).then(function (res) {
        $('btn-login').disabled = false;
        if (res.status === 200 && res.body && res.body.ok && res.body.token) {
          ecrire(fromLogin(res.body));
          entrerAccueil();
          return;
        }
        if (res.status === 429) { msg.className = 'msg wait'; msg.textContent = 'Trop de tentatives, réessayez dans ' + (res.retry || 'un instant') + (res.retry ? ' s.' : '.'); return; }
        if (res.status === 503) { msg.className = 'msg wait'; msg.textContent = 'Service temporairement indisponible, réessayez.'; return; }
        msg.className = 'msg err'; msg.textContent = 'Mail ou code incorrect.'; // 401 ou autre : générique
      }).catch(function () {
        $('btn-login').disabled = false;
        var m = $('msg-login'); m.className = 'msg wait'; m.textContent = 'Service temporairement indisponible, réessayez.';
      });
    });
    function fromLogin(b) { var o = {}; o[K_TOKEN] = b.token || ''; o[K_NOM] = b.nom || ''; o[K_MARQUE] = b.marque || ''; return o; } // F1 : on stocke le JETON, jamais le code

    // ── Accueil + projets ──
    $('lien-deco').addEventListener('click', function (e) { e.preventDefault(); effacer(); allerLogin(''); });

    function allerLogin(notice) {
      $('msg-login').className = notice ? 'msg wait' : 'msg';
      $('msg-login').textContent = notice || '';
      $('in-code').value = '';
      montrer('vue-login');
    }

    function entrerAccueil() {
      var nom = lire(K_NOM), marque = lire(K_MARQUE);
      $('bonjour').textContent = nom ? ('Bonjour ' + nom) : '';
      $('titre-projets').textContent = marque ? ('Vos projets · ' + marque) : 'Vos projets';
      montrer('vue-accueil');
      chargerProjets();
    }

    function chargerProjets() {
      var zone = $('zone-projets');
      zone.innerHTML = '<p class="sub">Chargement…</p>';
      fetch(PROJETS, {
        method: 'POST',
        headers: { 'x-rmc-token': lire(K_TOKEN) }
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; });
      }).then(function (res) {
        rendre(etatDepuisReponse(res.status, res.body), res.body);
      }).catch(function () {
        rendre('INDISPO', null); // réseau tombé → INDISPO (réessayable), JAMAIS « aucun projet »
      });
    }

    function rendre(etat, body) {
      var zone = $('zone-projets');
      if (etat === 'EXPIRE') { effacer(); allerLogin('Votre session a expiré, reconnectez-vous.'); return; }
      if (etat === 'LISTE') {
        var items = body.projets.map(function (p) {
          return '<li><span class="code">' + esc(p.code) + '</span><span>' + esc(p.titre) + '</span></li>';
        }).join('');
        zone.innerHTML = '<ul class="projets">' + items + '</ul>';
        return;
      }
      if (etat === 'VIDE') { // calme et affirmatif, pas de bouton, pas d'alarme
        zone.innerHTML = '<div class="etat-vide">Aucun projet disponible pour le moment.</div>';
        return;
      }
      // INDISPO : alerte distincte + réessayer (jamais une liste vide ici)
      zone.innerHTML = '<div class="etat-indispo">Service temporairement indisponible.' +
        '<div><button type="button" id="btn-reessayer">Réessayer</button></div></div>';
      $('btn-reessayer').addEventListener('click', chargerProjets);
    }

    // ── Démarrage : projets-client (via le jeton) est la source de vérité. ──
    // F1 : migration douce — un navigateur portant encore l'ancien stockage (mail+code) sans jeton est
    // PURGÉ et atterrit proprement sur la connexion, jamais sur une erreur.
    if (lire(K_TOKEN)) entrerAccueil();
    else { try { K_LEGACY.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} montrer('vue-login'); }
  })();
  </script>
</body>
</html>
