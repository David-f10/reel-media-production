<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace client · Réel Média</title>
  <!-- Icône d'onglet : mêmes deux lignes que review.html. PAS de manifest ni theme-color (index.html) : un
       client n'installe rien, son espace ne doit pas se présenter comme la PWA de l'équipe. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <!-- Lot G — HABILLAGE (PR 3). Balisage + CSS seulement : AUCUNE ligne de JavaScript touchée, tous les
       id/classes lus ou émis par le script préservés. Maquette MAQUETTE_ESPACE_CLIENT.html reproduite
       (carte bordée, accent ROUGE #E63946, logo SVG verbatim de review.html). Polices DM Sans/DM Mono
       AUTO-HÉBERGÉES (/fonts/, SIL OFL) — pas de Google Fonts (RGPD). -->
  <style>
    /* Polices AUTO-HÉBERGÉES (SIL OFL 1.1, /fonts/OFL.txt), font-display:swap — PAS de Google Fonts (RGPD).
       Les cinq fichiers servent : DM Sans 400/500/700 (bouton principal en 700), DM Mono 400/500 (codes en 500). */
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-sans-400.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-sans-500.woff2') format('woff2')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/dm-sans-700.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/dm-mono-400.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/dm-mono-500.woff2') format('woff2')}

    :root{
      --bg:#08080F; --bg2:#0F0F1A; --bg3:#16161F; --bg4:#1E1E2A;
      --line:#1E1E2A; --line2:#2A2A3A;
      --txt:#F0F0F5; --txt2:#9898B0; --txt3:#5A5A70;
      /* accent de la marque = ROUGE #E63946 (review.html --red) ; aucun bleu */
      --rouge:#E63946; --rouge-fort:#F04B57; --rouge-voile:rgba(230,57,70,.12); --rouge-bord:rgba(230,57,70,.30);
      --amber:#EF9F27; --amber-voile:rgba(239,159,39,.12); --amber-bord:rgba(239,159,39,.42);
      /* vert = validation (repris de la maquette VISION_ESPACE_CLIENT) */
      --vert:#1D9E75; --vert-voile:rgba(29,158,117,.12); --vert-bord:rgba(29,158,117,.32);
      --sans:'DM Sans',system-ui,-apple-system,sans-serif;
      --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;
         line-height:1.55;-webkit-font-smoothing:antialiased}
    .wrap{max-width:760px;margin:0 auto;
          padding-left:max(16px,env(safe-area-inset-left,0px));
          padding-right:max(16px,env(safe-area-inset-right,0px));
          padding-block:0 64px}

    /* ── écran 04 — connexion : carte bordée, tout aligné à gauche. Marque PAS affichée ici. ── */
    #vue-login{min-height:74vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:48px}
    .gate{width:100%;max-width:412px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;
          padding:30px 32px 32px;display:flex;flex-direction:column;align-items:stretch;gap:0}
    .gate-logo{display:flex;justify-content:flex-start;margin-bottom:21px}
    #vue-login h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;text-align:left}
    #vue-login .sub{color:var(--txt2);font-size:13.5px;line-height:1.5;margin:7px 0 0;text-align:left;max-width:34ch}
    #form-login{display:flex;flex-direction:column;gap:14px;margin-top:24px}
    .champ{display:flex;flex-direction:column;gap:7px}
    .champ > span:first-child{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt3)}
    input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);
          font-family:var(--sans);font-size:15px;padding:11px 13px;transition:border-color .12s,background .12s}
    input::placeholder{color:var(--txt3)}
    input:hover{border-color:#36364A}
    input:focus{outline:none;border-color:var(--rouge);background:var(--bg3)}
    #in-code{font-family:var(--mono);letter-spacing:.14em}
    .coderow{display:flex;gap:8px}
    .coderow input{flex:1;min-width:0}
    /* bouton secondaire Afficher/Masquer — discret, ne rivalise jamais avec l'action principale */
    #btn-voir{flex:none;background:var(--bg3);color:var(--txt2);border:1px solid var(--line2);border-radius:7px;
              font-family:var(--sans);font-size:13px;padding:0 15px;cursor:pointer;transition:color .12s,border-color .12s}
    #btn-voir:hover{color:var(--txt);border-color:#36364A}
    /* action principale : rouge plein, pleine largeur (comme « Ajouter à mes retours » dans review.html) */
    button.primary{width:100%;margin-top:4px;background:var(--rouge);color:#fff;border:1px solid var(--rouge);
                   font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.01em;
                   padding:12px 20px;border-radius:7px;cursor:pointer;transition:background .12s,border-color .12s}
    button.primary:hover{background:var(--rouge-fort);border-color:var(--rouge-fort)}
    button.primary:active{background:var(--rouge)}
    button.primary[disabled]{opacity:.45;cursor:not-allowed}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
    .msg{font-size:13.5px;min-height:19px;color:var(--txt2)}
    .msg.err{color:var(--rouge)}
    .msg.wait{color:var(--amber)}
    #msg-login{margin-top:13px}
    /* le filet traverse toute la carte */
    .ligne-aide{font-size:12.5px;color:var(--txt3);margin:16px 0 0;line-height:1.5;padding-top:16px;border-top:1px solid var(--line)}

    /* ── écran 05 — en-tête (traitement .head de la maquette) ── */
    .head{padding-block:40px 20px;border-bottom:1px solid var(--line);margin-bottom:26px}
    .head-mark{display:flex;align-items:center;gap:10px;margin-bottom:13px;font-family:var(--mono);
               font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)}
    #titre-projets{font-size:clamp(25px,5vw,33px);font-weight:500;letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
    .topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
    .topbar .id{font-size:13.5px;color:var(--txt2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
    /* déconnexion NEUTRE : le rouge est réservé aux actions principales */
    #lien-deco{color:var(--txt2);text-decoration:none;border-bottom:1px solid var(--line2)}
    #lien-deco:hover{color:var(--txt);border-bottom-color:var(--txt3)}

    /* ── écran 05 — la liste (balisage imposé : li > span.code + span). AUCUNE colonne inventée ── */
    ul.projets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
    ul.projets li{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:16px 18px;
                  display:flex;align-items:baseline;gap:16px;min-width:0;transition:border-color .12s,background .12s}
    ul.projets li:hover{background:var(--bg3);border-color:var(--line2)}
    /* pastille de code = motif .video-code de review.html : mono rouge sur voile rouge */
    ul.projets li .code{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;
                        color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);
                        padding:3px 8px;border-radius:4px}
    ul.projets li .code + span{font-size:15.5px;font-weight:500;letter-spacing:-.005em;min-width:0;overflow-wrap:anywhere}

    /* ── VIDE vs INDISPO : jamais confondus ── */
    .etat-vide{color:var(--txt2);font-size:14.5px;padding:30px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .etat-vide::before{content:'';display:block;width:22px;height:1px;background:var(--line2);margin-bottom:14px}
    .etat-indispo{border:1px solid var(--amber-bord);background:var(--amber-voile);color:var(--amber);
                  border-radius:9px;padding:17px 19px;font-size:14.5px}
    .etat-indispo button{margin-top:13px;background:transparent;color:var(--amber);border:1px solid var(--amber-bord);
                        font-family:var(--sans);font-size:13.5px;font-weight:500;padding:8px 15px;border-radius:6px;cursor:pointer;transition:background .12s}
    .etat-indispo button:hover{background:rgba(239,159,39,.18)}
    .etat-indispo button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

    .sub{color:var(--txt2);font-size:14px}  /* « Chargement… » (zone-projets / vue-chargement) */

    /* ── écran « Voir un montage » — SHELL PLEINE LARGEUR (détaché de .wrap, cf. diag #214). Disposition des
         maquettes B/C : en-tête à bord plein → sous-barre (versions + méta) → rangée main/aside qui remplit. ── */
    .mt-shell{min-height:100vh;display:flex;flex-direction:column}
    .mt-topbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line)}
    .mt-tb-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;min-width:0}
    .mt-back{flex:0 0 auto;align-self:center;color:var(--txt2);text-decoration:none;font-size:15px;line-height:1;border:1px solid var(--line2);border-radius:6px;padding:5px 9px}
    .mt-back:hover{color:var(--txt);border-color:var(--txt3)}
    .mt-brand{flex:0 0 auto;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--txt)}
    .mt-brand-x{color:var(--rouge)}
    .mt-sep{flex:0 0 auto;color:var(--txt3)}
    .mt-marque{flex:0 0 auto;color:var(--txt2);font-size:14px}
    .mt-marque:empty{display:none}
    .mt-sujet{min-width:0;color:var(--txt);font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mt-vchip{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--txt2);background:var(--bg3);border:1px solid var(--line2);padding:3px 7px;border-radius:5px}
    .mt-vchip:empty{display:none}
    .mt-tb-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .mt-etat{font-family:var(--mono);font-size:11px;color:var(--rouge);border:1px solid var(--rouge-bord);background:var(--rouge-voile);padding:5px 10px;border-radius:6px}
    .mt-etat:empty{display:none}
    .mt-deco{background:transparent;border:1px solid var(--line2);color:var(--txt2);font:inherit;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:color .12s,border-color .12s}
    .mt-deco:hover{color:var(--txt);border-color:var(--txt3)}
    .mt-sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;padding:10px clamp(16px,3vw,32px);border-bottom:1px solid var(--line)}
    .mt-submeta{display:flex;gap:9px;align-items:baseline;min-width:0}
    .mt-code-chip{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:2px 7px;border-radius:4px}
    .mt-code-chip:empty{display:none}
    .rv-meta{font-family:var(--mono);font-size:11.5px;color:var(--txt3)}
    .vers{display:flex;flex-wrap:wrap;gap:6px;margin:0}
    .vch{font-family:var(--sans);font-size:12.5px;color:var(--txt2);background:transparent;border:1px solid var(--line2);border-radius:7px;padding:6px 11px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
    .vch[aria-selected="true"]{background:var(--bg4);color:var(--txt);border-color:#3A3A50}
    .vch .pt{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-left:7px}
    .vch[aria-selected="true"] .pt{color:var(--vert)}
    .vch:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
    /* Le corps remplit la hauteur restante du shell → la rangée main/aside tient toute la hauteur. */
    #mt-corps{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
    /* États hors rangée (chargement / vide / indisponible) : inset propre, puisque le corps n'a plus le padding de .wrap. */
    #mt-corps > .sub,#mt-corps > .etat-vide,#mt-corps > .etat-indispo{margin:22px clamp(16px,3vw,32px)}
    #mt-notice:not(:empty){padding:14px clamp(16px,3vw,32px) 0}
    /* Rangée principale : main (s'étale) + aside (colonne retours pleine hauteur). Remplit le shell. */
    .rv{display:flex;flex-wrap:wrap;align-items:stretch;flex:1 1 auto;min-height:0;width:100%}
    .col-v{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px;padding:22px clamp(16px,2.4vw,28px);border-right:1px solid var(--line)}
    .scene{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px}
    .scene-ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;min-height:240px}
    .scene-grise{filter:grayscale(1);opacity:.55}
    /* Lecteur natif : se dimensionne à son contenu (16:9 remplit la largeur ; 9:16 se centre sur le noir,
       object-fit:contain letterboxe). Pas de détection de ratio côté serveur — la vidéo porte le sien. */
    .mt-video{width:100%;max-height:72vh;background:#000;display:block;object-fit:contain}
    /* Montage vertical : scène compacte centrée sur le noir (maquette C), pas une bande noire pleine largeur. */
    .scene-portrait .mt-video{width:auto;max-width:100%}
    /* Repli (relais indisponible) : iframe Drive (bureau) OU message + téléchargement (iOS). */
    .mt-iframe{width:100%;aspect-ratio:16/9;max-height:72vh;border:0;display:block;background:#000}
    .repli{width:100%;display:flex;flex-direction:column;gap:12px;padding:0}
    .repli.repli-ios{padding:28px 22px;text-align:center;gap:10px}
    .repli-t{margin:0;font-size:15px;font-weight:500;color:var(--txt)}
    .repli-x{margin:0;font-size:13px;color:var(--txt2);line-height:1.5}
    .repli-bas{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px 14px}
    .repli:not(.repli-ios) .repli-bas{justify-content:space-between;background:var(--bg3);border-top:1px solid var(--line)}
    .repli-note{font-size:12px;color:var(--txt3)}
    /* Colonne retours PLEINE HAUTEUR (maquettes) : en-tête (border-bottom) → liste défilante (flex:1) →
       pied (téléchargement). Pas de carte bordée arrondie : une vraie colonne qui tient la hauteur. */
    .panneau{flex:1 1 380px;min-width:0;max-width:460px;display:flex;flex-direction:column;background:transparent;border:0;border-radius:0}
    .pan-t{padding:18px clamp(16px,2vw,24px) 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
    .pan-n{font-family:var(--mono);font-size:11px;color:var(--txt2);background:var(--bg3);padding:3px 8px;border-radius:5px}
    .retours{display:flex;flex-direction:column;flex:1 1 auto;overflow-y:auto;min-height:0}
    .ret{padding:13px clamp(16px,2vw,24px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
    .ret-h{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
    .ret-tc{font-family:var(--mono);font-size:10px;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:1px 7px;border-radius:4px}
    /* Timecode cliquable (saut dans le lecteur). Rendu cliquable seulement une fois la durée connue et le tc dans le film. */
    .ret-tc-seek{cursor:pointer}
    .ret-tc-seek::before{content:'▶';font-size:8px;margin-right:4px;vertical-align:baseline}
    .ret-tc-seek:hover,.ret-tc-seek:focus-visible{background:var(--rouge);color:#fff;outline:none}
    /* Timecode hors film (après la fin) : désactivé visuellement, jamais cliquable. */
    .ret-tc-hs{opacity:.45;text-decoration:line-through}
    /* Bande de repères (NON navigable, étape 2) : la navigation se fait par les contrôles natifs du <video>.
       Un repère par retour à sa position (tc/durée) ; un trait blanc = position courante (timeupdate). */
    .mt-frise{position:relative;height:26px;margin:2px 0;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
    .mt-frise::before{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;transform:translateY(-50%);background:var(--bg4);border-radius:2px}
    .mt-fr-m{position:absolute;top:50%;width:10px;height:10px;margin-left:-5px;transform:translateY(-50%);border-radius:50%;background:var(--rouge);border:2px solid var(--bg2)}
    .mt-fr-m.eq{background:var(--txt2)}
    .mt-fr-head{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:#fff;border-radius:1px;transition:left .1s linear}
    /* Légende de la bande : rouge = vos retours, gris = autres contacts de la marque (donnée réelle : tous
       Source=Client ; pas de retour équipe dans ce payload). Allumée en même temps que la bande. */
    .mt-legende{display:flex;flex-wrap:wrap;gap:16px;margin:2px 2px 0}
    .mt-lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2)}
    .mt-lg-d{width:8px;height:8px;border-radius:50%;background:var(--rouge)}
    .mt-lg-d.eq{background:var(--txt2)}
    /* Capture : bouton « Marquer ce moment » sous le lecteur (visible pendant la lecture). */
    /* Transport SOUS la vidéo : action PRIMAIRE « Noter » (rouge plein, dominante) + « Pause » secondaire (muet).
       Le bouton dominant capte l'instinct de pause du client → nos contrôles sont le chemin évident (critère 4). */
    .mt-transport{display:flex;gap:8px;margin-top:8px;align-items:stretch}
    .mt-cap{flex:1;background:var(--rouge);color:#fff;border:1px solid var(--rouge);font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 12px;border-radius:7px;cursor:pointer;transition:filter .12s}
    .mt-cap:hover{filter:brightness(1.08)}
    .mt-pause{flex:none;background:var(--bg4);color:var(--txt2);border:1px solid var(--line2);font-family:var(--sans);font-size:13px;padding:11px 14px;border-radius:7px;cursor:pointer}
    .mt-pause:hover{background:var(--line2);color:var(--txt)}
    .mt-hint{font-size:11px;color:var(--txt3);margin:6px 2px 2px;line-height:1.4}
    /* Télécharger : ce n'est PAS un contrôle de lecture → zone à part, discrète, séparée du transport. */
    /* Pied de la colonne retours : téléchargement de la version affichée. */
    .mt-telzone{margin-top:auto;padding:16px clamp(16px,2vw,24px) 20px;border-top:1px solid var(--line)}
    .mt-telzone .bouton{width:100%;text-align:center}
    /* Moments marqués, non encore commentés : pastilles cliquables (chargent le moment dans le formulaire). */
    .mt-pins{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .mt-pins-t{width:100%;font-size:11px;color:var(--txt3);margin-bottom:2px}
    .mt-pin{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:3px 4px 3px 9px;border-radius:5px;cursor:pointer}
    .mt-pin:hover,.mt-pin:focus-visible{background:var(--rouge);color:#fff;outline:none}
    .mt-pin-actif{background:var(--rouge);color:#fff} /* moment chargé dans le champ = ce qui partira */
    .mt-pin-x{border:0;background:transparent;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0 3px;opacity:.7}
    .mt-pin-x:hover{opacity:1}
    /* Champ « Moment du film » : libellé + ligne timecode avec − / + autour, + aide. */
    .mt-tc-lab{display:block;font-size:12px;color:var(--txt2);margin:2px 0 4px}
    .mt-tc-wrap{display:inline-flex;align-items:stretch;gap:0}
    .mt-nudge{width:30px;border:1px solid var(--line2);background:var(--bg4);color:var(--txt);font-size:16px;line-height:1;cursor:pointer}
    .mt-nudge:first-child{border-radius:6px 0 0 6px;border-right:0}
    .mt-nudge:last-child{border-radius:0 6px 6px 0;border-left:0}
    .mt-nudge:hover{background:var(--line2)}
    .mt-tc-wrap #mt-tc{border-radius:0;text-align:center;width:72px}
    .mt-tc-aide{font-size:11px;color:var(--txt3);margin:4px 0 8px}
    /* Bloc d'écriture (étape 2) : puce timecode (éditable) collée à gauche du champ ; sous le champ, la phrase
       de cadrage à gauche et les actions (catégorie / Annuler / Ajouter) à droite. */
    .mt-tc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .mt-wr{display:flex;align-items:flex-start;gap:10px}
    #mt-tc.mt-tc-chip{flex:0 0 auto;width:62px;font-family:var(--mono);font-size:13px;text-align:center;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);border-radius:7px;padding:10px 8px}
    #mt-tc.mt-tc-chip:focus{outline:none;border-color:var(--rouge);background:var(--rouge-voile)}
    .mt-wr textarea{flex:1 1 auto;min-width:0;min-height:60px}
    .mt-wr-bas{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
    .mt-phrase{margin:0;flex:1 1 220px;font-size:12px;color:var(--txt3);line-height:1.5}
    .mt-wr-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .mt-wr-act select{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:13px;padding:9px 10px}
    .mt-wr-act select:focus{outline:none;border-color:var(--rouge)}
    .mt-wr-act .bouton{padding:9px 16px}
    .ret-cat{font-family:var(--mono);font-size:10px;color:var(--txt3);background:var(--bg4);padding:1px 7px;border-radius:4px}
    .ret-x{font-size:13.5px;color:var(--txt);line-height:1.5}
    .ret-brouillon{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid var(--amber);opacity:.85;padding:1px 7px;border-radius:4px}
    .ret-foot{display:flex;justify-content:flex-end;margin-top:2px}
    .ret-suppr{background:none;border:0;color:var(--txt3);font-size:11px;cursor:pointer;text-decoration:underline;padding:2px 0}
    .ret-suppr:hover{color:var(--rouge)}
    .ret-suppr:disabled{opacity:.5;cursor:default;text-decoration:none}
    .ret-reform{margin-top:2px;padding-left:11px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:3px}
    .ret-reform-by{font-family:var(--mono);font-size:10px;color:var(--txt3)}
    .ret-reform-x{font-size:13px;color:var(--txt2);line-height:1.5}
    .forme{border-top:1px solid var(--line);background:var(--bg3);padding:14px 15px;display:flex;flex-direction:column;gap:10px}
    .forme-t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3)}
    .forme-r{display:flex;gap:8px}
    .forme-r input{font-family:var(--mono);max-width:128px}
    .forme-r select{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:10px 12px}
    .forme textarea{width:100%;min-height:76px;resize:vertical;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:10px 12px}
    .forme textarea:focus,.forme-r select:focus,.forme-r input:focus{outline:none;border-color:var(--rouge);background:var(--bg3)}
    /* Actions terminales (deux-temps conservé) : rangée discrète sous le bloc d'écriture, sans section titrée. */
    .mt-fin{margin-top:4px;display:flex;flex-direction:column;gap:9px}
    .mt-fin-r{display:flex;flex-wrap:wrap;gap:9px}
    .mt-fin-r .bouton{flex:1 1 auto}
    .mt-fin-n{font-size:11.5px;color:var(--txt3);line-height:1.5;margin:0}
    .bouton{background:var(--rouge);color:#fff;border:1px solid var(--rouge);font-family:var(--sans);font-size:14px;font-weight:500;padding:10px 16px;border-radius:7px;cursor:pointer;transition:background .12s,border-color .12s}
    .bouton:hover{background:var(--rouge-fort);border-color:var(--rouge-fort)}
    .bouton[disabled]{opacity:.5;cursor:not-allowed}
    .bouton.vert{background:transparent;color:var(--vert);border-color:var(--vert-bord);font-weight:500}
    .bouton.vert:hover{background:var(--vert);color:#04150F;border-color:var(--vert)}
    .bouton.gris2{background:transparent;color:var(--txt2);border-color:var(--line2);font-weight:500}
    .bouton.gris2:hover{background:var(--bg4);color:var(--txt);border-color:var(--txt3)}
    .close{padding:15px;font-size:13px;line-height:1.5}
    .close.gris{background:var(--bg3);border-top:1px solid var(--line);color:var(--txt2)}
    .close.gris b{color:var(--txt);font-weight:600}
    .mt-bandeau{background:var(--amber-voile);border:1px solid var(--amber-bord);color:var(--amber);border-radius:8px;padding:11px 14px;font-size:13.5px;margin-bottom:16px}
    .voir-montage{flex:none;margin-left:auto;background:transparent;color:var(--rouge);border:1px solid var(--rouge-bord);font-family:var(--sans);font-size:12.5px;padding:6px 11px;border-radius:6px;cursor:pointer;transition:background .12s}
    .voir-montage:hover{background:var(--rouge-voile)}
    .lien-reessai{background:transparent;border:0;color:var(--amber);text-decoration:underline;cursor:pointer;font:inherit}
    /* Empilement (main/aside wrap sous ~900px) : la bordure inter-colonnes passe du côté droit au séparateur
       horizontal, l'aside reprend toute la largeur. */
    @media (max-width:900px){
      .col-v{border-right:0;flex-basis:100%}
      .panneau{max-width:none;flex-basis:100%;border-top:1px solid var(--line)}
      .retours{overflow:visible}
    }
    @media (max-width:620px){ .mt-video,.mt-iframe{max-height:62vh} .mt-topbar,.mt-sub{padding-left:16px;padding-right:16px} }

    /* ── « Mon espace » — les cinq blocs (B2). Classes reprises de VISION_ESPACE_CLIENT, tokens identiques. ── */
    .maj{font-family:var(--mono);font-size:11px;color:var(--txt3)}
    h2{font-size:11.5px;font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);font-weight:400;margin:36px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
    h2 .n{color:var(--txt3);font-size:11px;font-variant-numeric:tabular-nums}
    h2:first-of-type{margin-top:0}
    .code{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);padding:3px 8px;border-radius:4px}
    .lnk{font-size:12.5px;color:var(--txt2);text-decoration:none;border:1px solid var(--line2);background:var(--bg3);padding:6px 11px;border-radius:6px;display:inline-block;white-space:nowrap;cursor:pointer;transition:color .12s,border-color .12s}
    .lnk:hover{color:var(--txt);border-color:var(--txt3)}
    .attente{display:flex;flex-direction:column;gap:11px}
    .att{background:var(--bg2);border:1px solid var(--rouge-bord);border-left:3px solid var(--rouge);border-radius:9px;padding:17px 19px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
    .att-m{min-width:0;flex:1 1 260px;display:flex;flex-direction:column;gap:7px}
    .att-t{font-size:16px;font-weight:500;letter-spacing:-.005em}
    .att-l{display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:12.5px;color:var(--txt2)}
    .att-l .mono{font-family:var(--mono);font-size:11.5px;color:var(--txt3)}
    /* « À valider » (séquencier) : action, pas alerte → on retire l'accent rouge de .att */
    .att.sq{border-color:var(--line2);border-left-color:var(--line2)}
    .sq-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1 1 220px;justify-content:flex-end}
    .sq-doc{flex:1 1 100%;margin-top:4px}
    .sq-doc-frame{width:100%;height:280px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
    #sq-doc-ov .sq-doc-frame{height:68vh;border:0;border-radius:0} /* overlay historique : grande hauteur, largeur bornée par le panneau (720px) */
    .sq-corr-txt{width:100%;min-height:70px;resize:vertical;background:var(--bg3);border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:10px 12px}
    .sq-corr-bas{display:flex;gap:10px;align-items:center;margin-top:8px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .stat{background:var(--bg2);padding:16px 17px 14px}
    .stat-n{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
    .stat-n.petit{font-size:17px;padding-block:5px 3px}
    .stat-l{font-size:11.5px;color:var(--txt2);margin-top:6px;display:block}
    .live{display:flex;flex-direction:column;gap:9px}
    .lrow{background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:8px;padding:15px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
    .lrow-m{min-width:0;flex:1 1 240px;display:flex;flex-direction:column;gap:5px}
    .lrow-t{font-size:15.5px;font-weight:500}
    .lrow-s{display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:12.5px;color:var(--txt2)}
    .lrow-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px} /* colonne droite d'une ligne En cours : pastille + « Revoir le montage » */
    .lrow-attente{font-size:12.5px;color:var(--txt3);text-align:right;max-width:230px} /* « Votre montage est en cours » : ligne secondaire, pas une alerte */
    .pill{flex:none;font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:4px;white-space:nowrap;background:var(--amber-voile);color:var(--amber);border:1px solid var(--amber-bord)}
    .etapes{display:flex;gap:4px;margin-top:9px;max-width:330px}
    .et{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
    .et-b{height:3px;border-radius:2px;background:var(--line2)}
    .et-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .et.fait .et-b{background:var(--txt3)} .et.fait .et-l{color:var(--txt2)}
    .et.ici .et-b{background:var(--amber)} .et.ici .et-l{color:var(--amber)}
    .tw{border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .t{width:100%;border-collapse:collapse;font-size:14.5px}
    .t th{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt3);font-weight:400;text-align:left;padding:11px 15px;background:var(--bg3);border-bottom:1px solid var(--line)}
    .t td{padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--bg2)}
    .t tr:last-child td{border-bottom:none}
    .t tr:hover td{background:var(--bg3)}
    .c-code{width:1%;white-space:nowrap}
    .c-t{min-width:0} .c-t b{font-weight:500;display:block} .c-t span{font-size:12px;color:var(--txt3)}
    .c-who{font-size:13px;color:var(--txt2);white-space:nowrap;width:1%}
    .c-d{font-family:var(--mono);font-size:12px;color:var(--txt2);white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
    .c-a{width:1%;white-space:nowrap}
    .replier{margin-top:13px;font-size:12.5px;color:var(--txt3);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
    .ref{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:15px 17px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500;background:var(--rouge-voile);color:var(--rouge);border:1px solid var(--rouge-bord)}
    .ref-b{min-width:0;flex:1 1 200px}
    .ref-n{font-size:15px;font-weight:500}
    .ref-m{font-size:12.5px;color:var(--txt2);margin-top:2px}
    .premier{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:30px 32px;max-width:640px}
    .premier h3{font-size:19px;font-weight:500;letter-spacing:-.015em;margin:0 0 10px}
    .premier > p{color:var(--txt2);font-size:14px;margin:0 0 18px;max-width:52ch}
    .pts{display:flex;flex-direction:column;gap:11px;margin:0 0 22px;padding:0;list-style:none}
    .pts li{display:flex;gap:11px;align-items:baseline;font-size:14px;color:var(--txt2)}
    .pts .p{flex:none;font-family:var(--mono);font-size:10px;color:var(--rouge);background:var(--rouge-voile);border:1px solid var(--rouge-bord);width:21px;height:21px;border-radius:50%;display:grid;place-items:center}

    /* ⚠️ !important OBLIGATOIRE : #vue-login porte display:flex (sélecteur d'id) → sans !important, .hidden
       (classe) perd et la bascule entre vues est morte. Vérifié. vue-montage n'a AUCUNE règle display par
       sélecteur d'id, pour que .hidden gagne sans lutte. */
    .hidden{display:none!important}

    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
    @media (max-width:420px){
      .head{padding-block:30px 18px}
      ul.projets li{padding:14px 15px;gap:12px}
      #vue-login{min-height:66vh}
    }
