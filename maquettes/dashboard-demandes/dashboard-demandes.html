<!--
===============================================================================
  MAQUETTE — « Demandes & missions » en PAGE ENTIÈRE du dashboard HAVANA
  Contenu fictif. NON VALIDÉE. ⛔ Ne jamais déployer ce fichier.
===============================================================================

  CE QUE C'EST
  Une référence du RÉSULTAT, jamais une source à copier. Elle fixe la
  disposition, la densité et les gestes de la page équipe. L'autorité reste
  index.html, css/*.css et les contrats serveur existants.

  POURQUOI UNE PAGE ET PLUS UNE MODALE
  Aujourd'hui : openDemandesAdmin() → openOv('ov-demandes') → une modale de
  680 px (index.html:500) à deux onglets maison (.client-tab).
  Le dashboard a DÉJÀ cinq pages — navTo('dashboard'|'production'|'idees'|
  'taches'|'archives') — avec un motif parfaitement régulier dans appRender() :
  breadcrumb + #main-actions + #view-tabs + un loadX(). Cette page est la
  SIXIÈME, bâtie sur ce motif. Rien n'est inventé.

  CE QUE LA PAGE RÉUTILISE, VERBATIM, DE css/*.css
  .sb-nav-item .sb-nav-icon .sb-nav-badge[.red] .main-topbar .main-breadcrumb
  .main-content .view-tabs .vtab[.active] .nav-btn[.primary] .list-table
  .pill .p-red .p-amber .p-blue .p-green .p-gray .p-purple
  .search-input-wrap .search-input .search-icon .search-highlight .empty
  .sb-filters .sb-filter[.active] .sb-dot .sb-badge
  Les classes NEUVES sont toutes préfixées dm- : elles n'écrasent rien.

  LE BANDEAU DE FILTRES EST CELUI DE PRODUCTION, À L'IDENTIQUE
  Première version : des chips maison, fond --bg4 à l'actif, compteur nu,
  pas de pastille. Ça ne ressemblait à rien d'autre dans l'app. La vraie
  grammaire est index.html:223 + css/layout.css :
    • bandeau PLEINE LARGEUR sous les onglets, fond --bg, trait en bas,
      padding 8px 24px, défilement horizontal sans barre visible
    • chip : border-radius 999px, 11px, padding 5px 12px, fond --bg3,
      bordure transparente
    • ACTIF = ROUGE VOILÉ (--red-dim en fond ET en bordure, texte --red),
      pas un gris plus clair
    • PASTILLE DE COULEUR .sb-dot 6px AVANT le libellé — chaque filtre
      porte le point de son étape, comme Montage, Retours, PAD
    • compteur .sb-badge APRÈS le libellé, mono 10px sur fond --bg4
    • « ↺ Tout afficher » en bout de bandeau dès qu'un filtre est posé
    • le compteur de résultats est une BARRE À PART (#search-count), qui
      n'apparaît QU'EN RECHERCHE — pas un compteur permanent
  La couleur de pastille est dérivée de PILL : le point du filtre et la
  pastille de la rangée ne peuvent pas diverger.

  CE QUI EST DÉJÀ CONSTRUIT CÔTÉ SERVEUR — à brancher, pas à écrire
  • demandes-admin.js  action 'liste'  → id, message, type, codeBrand,
    codeCarte, demandeur, statut, reponse, traitePar, date
  • demandes-admin.js  action 'statut' → change Statut + Réponse + Traité par
  • missions-admin.js  action 'liste'  → id, objet, statut, plateforme,
    codeBrand, demandeur, lieu, personnes, contactSurPlace, pourQuand,
    reponse, carteCreee, valideCommercialPar, date
  • missions-admin.js  action 'decision' → accepter | refuser (+ motif)

  TROIS CONTRAINTES SERVEUR QUE LA MAQUETTE RESPECTE
  1. demandes-admin.js:13 — STATUTS = ['Nouvelle','En cours','Traitée',
     'Refusée'] et :54 rejette tout le reste en 400. Donc « Clôturée »
     (option créée dans Notion, posée par le CLIENT) est AFFICHÉE mais
     N'EST PAS dans le sélecteur de l'équipe. Pour que l'équipe puisse la
     poser, il faut d'abord l'ajouter à STATUTS et à ORDRE (:21).
  2. missions-admin.js n'a PAS de sélecteur de statut : seulement
     'decision' → Acceptée | Refusée. Donc l'onglet Missions porte deux
     boutons Accepter / Refuser, jamais une liste déroulante.
  3. demandes-admin.js:66 ÉCRASE le champ Réponse à chaque écriture. Le fil
     de messages affiché ici suppose la base 💬 Messages (PR-5a) :
     Message · Réf demande · Sens · Auteur · Code Brand · Modifié le.
     Tant que PR-5a n'est pas livré, le panneau n'a qu'UNE réponse.

  DEUX BUGS VÉRIFIÉS, DÉCOUVERTS EN LISANT POUR CETTE MAQUETTE
  a. missions-admin.js lit  plateforme: _sel(p.properties,'Plateforme')
     alors que Plateforme est un MULTI-SELECT côté Notion. _sel renvoie ''
     systématiquement : la plateforme est VIDE pour toutes les missions, en
     silence. C'est le jumeau en LECTURE du bug en ÉCRITURE que Code a
     trouvé à mission-client.js:126. Les deux vont ensemble (PR-4).
  b. index.html:5748 — rafraichirBadgeDemandes() avale tous les échecs
     (catch(e){} + `(rd && rd.ok) ? … : 0`). Une pastille à 0 est donc
     indistinguable d'une panne d'accès. À remplacer par un état visible.

  DÉVIATION ASSUMÉE, À TRANCHER PAR DAVID
  css/base.css:4 porte --text2:#888 (4,60 ✓) et --text3:#555 (2,19 ✗ AA).
  Monter --text3 seul à #878787 le rend identique à --text2 (écart 1,01) :
  la hiérarchie à trois niveaux meurt. La maquette utilise donc DEUX jetons
  relevés — --text2:#B4B4B4 (7,86) et --text3:#878787 (4,54), écart 1,73,
  proche de l'écart actuel 2,10. Ratios calculés, pas estimés. Si David
  refuse, la page marche quand même : seuls les gris changent.

  DÉCISIONS DE DESIGN, ET LEUR SOURCE
  • liste + panneau de détail à droite — « quick view sidebar : the most
    scalable option » (Pencil & Paper, tables d'entreprise) ; trois volets
    nav|fil|contexte chez Intercom, le premier volet étant ici la sidebar
    de l'app, qui existe déjà.
  • STATUT changé EN LIGNE dans la rangée — « inline editing allows for the
    least friction and maintains the most context » (idem).
  • RÉPONSE écrite dans le PANNEAU, jamais dans la rangée — « add friction
    on purpose for high-stakes data » : la Réponse est marquée côté Notion
    « VISIBLE PAR LE CLIENT ». Une réponse partie par mégarde ne se reprend
    pas.
  • « ATTENTE », PAS « ÂGE ». Première version : l'âge depuis la création.
    Mauvais — il dit « 9 j » d'une demande réglée en deux heures, et il ne
    répond pas à la seule question qui compte quand on ouvre une demande :
    QUI ATTEND QUI. Les files ne meurent pas à la fin mais au MILIEU, dans
    l'état où chacun croit que l'autre doit jouer : un audit cité par eesel
    trouve 90 tickets parqués sur 200, tous en attente d'un client qui ne
    revient jamais. Chez Zendesk et Freshdesk cet état porte un nom —
    « Pending » = la balle est chez le client.
    Donc : la colonne ET la bannière du panneau calculent le temps depuis
    le DERNIER MESSAGE, et son SENS décide de qui attend. Rouge au-delà de
    2 jours quand c'est nous. Gris quand la balle est chez le client. Tiret
    quand c'est fini. Les deux écrans disent la même chose, toujours.
  • SEUIL DE RETARD = 2 JOURS. Choix de Réel Média, pas une norme : la
    référence du secteur est une première réponse en ~9 h (Freshservice,
    187 M de tickets), mais une boîte de production n'est pas un support.
    Une seule constante à changer : SEUIL_RETARD_J.
  • « 1re RÉPONSE EN 4 H » dans la fiche — du premier mot du client au
    premier mot de l'équipe. C'est la mesure que suivent les vraies files,
    et la seule qui dise après coup si on a été correct avec ce client.
  • CHAMP VIDE = « — », jamais une phrase : même convention que la liste.
  • TRAITÉ PAR affiché, et « — » quand personne ne l'a pris —
    effet bystander : une demande sans propriétaire n'est traitée par
    personne (BoldDesk).
  • TRI : Nouvelle d'abord, puis récentes. C'est déjà le tri serveur
    (demandes-admin.js:96), et le FIFO strict est l'erreur la plus courante
    en gestion de file (BoldDesk).
  • 8 colonnes, sous la limite de 15 colonnes d'une vue d'agent Zendesk.
  • Densité de la maison conservée : .list-table td{padding:9px 12px} ≈ 35 px
    par rangée, sous le « condensed 40px » de Pencil & Paper. C'est le choix
    de la boîte, et David a déjà validé cette densité côté client.
  • Majuscules des en-têtes de colonne : convention existante de la maison
    (.list-table th), conservée volontairement.
  • CIBLES TACTILES — le dashboard n'a AUCUNE convention : 2 occurrences de
    min-height:44px dans tout css/*.css, zéro dans index.html. Rien à
    imiter, donc un choix à assumer. La règle retenue ici : plancher à
    24 px partout (WCAG 2.5.8, niveau AA, exigé) et 44 px (2.5.5, AAA)
    PARTOUT OÙ C'EST GRATUIT — liens texte et boutons icône, dont la
    hauteur est invisible. La rangée mesure 47 px, dimensionnée par le
    select de statut, donc un lien à 44 px n'épaissit rien. Le select
    reste à 28 px : sa taille EST son apparence, et 28 > 24 satisfait AA.
    L'espace client, lui, est à 44 px partout (client.html .lnk:349).
    Divergence volontaire : table dense interne vs surface client.

  LA RÉFÉRENCE DU TICKET — FORMAT NON TRANCHÉ, À POSER À CODE
  La liste et le panneau affichent « D-7F3A » / « M-2B91 ». Le FORMAT est
  une proposition, pas une décision. Ce qui est en revanche ÉTABLI, et
  payé cher :
  • Une propriété Notion de type `unique_id` NE MARCHE PAS. Elle a été
    créée le 15/11, puis retirée : l'app lit Notion en `2022-06-28`
    (_notionio.js:45), version ANTÉRIEURE à ce type. Le panneau est tombé
    en 503. Ne pas y revenir sans monter l'app en version d'API — ce qui
    touche TOUTES les fonctions.
  • Donc la référence doit être fabriquée autrement. La piste la moins
    chère : la DÉRIVER de l'id de page Notion, que l'app a déjà en main
    (demandes-admin.js:85 renvoie `id`). Quatre caractères hexa ne
    suffisent pas (≈26 % de collision à 200 demandes, paradoxe des
    anniversaires) ; SIX donnent 16,7 M de valeurs, soit une collision
    négligeable. Aucun champ Notion neuf, aucune écriture, aucun compteur,
    et ça marche sur la version d'API actuelle.
  • L'autre piste, un compteur séquentiel (« DEM-207 »), est plus lisible
    mais demande une écriture et gère mal les courses. C'est une question
    pour Code, pas une décision de maquette.
  La référence doit être la MÊME des deux côtés — l'équipe et le client
  doivent pouvoir dire « D-7F3A » et parler de la même chose. Et c'est
  elle, pas le code marque, qui part dans Slack.

  CE QUI RESTE OUVERT
  • L'assignation : aucun champ « Assigné à » n'existe. « Traité par » est
    posé AUTOMATIQUEMENT par le serveur au premier changement de statut
    (demandes-admin.js:65). On ne peut donc pas « prendre » une demande sans
    la faire changer d'état. Si l'équipe en a besoin, c'est un champ Notion
    de plus, donc une décision, pas un détail.
  • Les actions en masse (traiter 5 demandes d'un coup) : pas dans le
    serveur, pas dans cette maquette.
  • La pagination : demandes-admin.js boucle jusqu'à 20×100, donc OK.
    demande-client.js:71 est à page_size 50 sans curseur — c'est PR-2.
===============================================================================

/* ---------------------------------------------------------------------------
   JETONS — copiés de css/base.css:4, avec la seule déviation déclarée
   ci-dessus (--text2 et --text3 relevés pour passer AA).
   --------------------------------------------------------------------------- */
:root{
  --bg:#0a0a0a; --bg2:#111; --bg3:#181818; --bg4:#202020;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#f0f0f0;
  --text2:#B4B4B4;  /* css/base.css = #888 (4,60) — relevé, voir en-tête */
  --text3:#878787;  /* css/base.css = #555 (2,19 ✗ AA) — relevé à 4,54 */
  --red:#e63946; --red-dim:rgba(230,57,70,0.15);
  --green:#1D9E75; --green-dim:rgba(29,158,117,0.15);
  --amber:#EF9F27; --amber-dim:rgba(239,159,39,0.15);
  --purple:#7F77DD; --purple-dim:rgba(127,119,221,0.15);
  --blue:#378ADD; --blue-dim:rgba(55,138,221,0.15);
  --r:8px; --rl:12px;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'DM Mono','SF Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}

/* --- coque d'app (reprise de .app-shell / .sidebar / .main) --- */
.dm-shell{display:flex;height:100vh;overflow:hidden}
.dm-side{width:232px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px}
.dm-logo{font-size:15px;font-weight:700;letter-spacing:-0.01em;padding:4px 10px 2px}
.dm-logo-sub{font-size:10px;color:var(--text3);padding:0 10px 16px;font-family:var(--mono)}
.dm-sect{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;padding:12px 10px 6px}

/* copiés verbatim de css/layout.css */
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);font-size:13px;color:var(--text2);cursor:pointer;transition:all .1s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:var(--font)}
.sb-nav-item:hover{background:var(--bg3);color:var(--text)}
.sb-nav-item.active{background:var(--bg4);color:var(--text)}
.sb-nav-icon{font-size:15px;width:20px;text-align:center}
.sb-nav-badge{margin-left:auto;font-size:10px;font-family:var(--mono);background:var(--bg4);padding:1px 6px;border-radius:8px;color:var(--text3)}
.sb-nav-badge.red{background:var(--red-dim);color:var(--red)}

.dm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.main-topbar{padding:0 24px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg);gap:16px}
.main-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.main-breadcrumb b{color:var(--text);font-weight:500}
.view-tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.vtab{padding:9px 14px;font-size:12px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;min-height:40px}
.vtab:hover{color:var(--text2)}
.vtab.active{color:var(--text);border-bottom-color:var(--red)}
.main-content{flex:1;overflow-y:auto;padding:18px 24px 28px}

.nav-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:6px 14px;border-radius:var(--r);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;min-height:34px}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
.nav-btn.primary:hover{background:#c0313d}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

.search-input-wrap{position:relative;display:flex;align-items:center;width:270px;max-width:46vw}
.search-icon{position:absolute;left:10px;color:var(--text3);font-size:13px;pointer-events:none;line-height:1}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 28px 7px 32px;border-radius:var(--r);font-size:12px;font-family:var(--font);transition:border-color .15s;min-height:34px}
.search-input:focus{outline:none;border-color:var(--red)}
.search-clear{position:absolute;right:5px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:17px;line-height:1;padding:3px 5px;font-family:var(--font)}
.search-clear:hover{color:var(--text)}
.search-highlight{background:var(--amber-dim);color:var(--amber);border-radius:2px;padding:0 2px}

.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap}
.p-red{background:var(--red-dim);color:var(--red)}
.p-amber{background:var(--amber-dim);color:var(--amber)}
.p-blue{background:var(--blue-dim);color:var(--blue)}
.p-green{background:var(--green-dim);color:var(--green)}
.p-gray{background:var(--bg4);color:var(--text3)}
.p-purple{background:var(--purple-dim);color:var(--purple)}

.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty h3{font-size:15px;color:var(--text2);margin-bottom:8px;font-weight:500}
.empty p{font-size:12px}

/* --- LE BANDEAU DE FILTRES — copié de Production, pas réinventé ---------
   index.html:223 + css/layout.css : #sb-filters.is-visible, .sb-filter,
   .sb-dot, .sb-badge. Pastille de couleur AVANT le libellé, compteur
   APRÈS, actif en ROUGE VOILÉ, bandeau pleine largeur sous les onglets
   avec un trait en bas, défilement horizontal sans barre. Verbatim. */
.sb-filters{display:flex;flex-direction:row;align-items:center;gap:6px;flex-shrink:0;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none;
  padding:8px 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.sb-filters::-webkit-scrollbar{display:none}
.sb-filter{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;width:auto;
  padding:5px 12px;font-size:11px;border-radius:999px;color:var(--text2);
  cursor:pointer;transition:all .1s;margin-bottom:0;
  border:1px solid transparent;background:var(--bg3);
  text-align:left;font-family:var(--font);min-height:28px}
.sb-filter:hover{background:var(--bg3);color:var(--text)}
.sb-filter.active{background:var(--red-dim);color:var(--red);border-color:var(--red-dim)}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-badge{margin-left:auto;font-size:10px;font-family:var(--mono);background:var(--bg4);
  padding:1px 6px;border-radius:8px;color:var(--text3)}
.sb-filter.active .sb-badge{background:rgba(230,57,70,.18);color:var(--red)}
.sb-tout{background:none;border:0;color:var(--text3);font-size:12px;cursor:pointer;

.sb-tout:hover{color:var(--text2)}
/* le compteur de résultats : barre à part, visible seulement en recherche,
   exactement comme #search-count d'index.html */
.dm-cntbar{padding:4px 24px;font-size:11px;color:var(--text3);font-family:var(--mono);
  background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}

/* --- NEUF : la fente liste | détail --- */
.dm-split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.dm-split.ouvert{grid-template-columns:minmax(0,1fr) 430px}
.dm-liste{border:1px solid var(--border);border-radius:var(--rl);background:var(--bg2);overflow:hidden;min-width:0}

.list-table{width:100%;border-collapse:collapse;table-layout:fixed}
.list-table th{text-align:left;padding:8px 12px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)}

.dm-c-ref{width:80px}
.dm-c-st{width:112px}
.dm-c-age{width:72px}
.dm-c-mq{width:auto;min-width:176px}

.dm-c-ty{width:98px}

.dm-split.ouvert .dm-c-ty,
.dm-split.ouvert .dm-c-tr{display:none}

.dm-pan-f{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2)}

.dm-fiche dt{color:var(--text3)}
.dm-fiche dd{color:var(--text2)}
.dm-fiche dd b{color:var(--text);font-weight:500}

/* LA LIGNE QUI COMPTE — « qui attend qui ». Les files ne meurent pas à la
   fin, elles meurent au milieu, dans l'état où chacun croit que l'autre
   doit jouer. L'âge seul ne le dit pas : une demande de 9 jours à qui on a
   répondu en 2 h va bien ; une demande de 2 jours sans réponse, non. */
.dm-att{display:flex;align-items:center;gap:9px;border-radius:var(--r);padding:9px 12px;font-size:12px;line-height:1.45;margin-bottom:14px;border:1px solid}

.dm-att.fin{background:var(--purple-dim);border-color:rgba(127,119,221,.32);color:var(--purple)}

   en forme courte pour tenir dans la colonne ; la valeur stockée, elle, ne
   change pas. */
var TYPE_COURT = { 'Décaler un tournage':'Décalage', 'Autre':'Autre' };

/* Durée lisible : on ne dit pas « 0,17 j », on dit « 4 h ». */
function duree(ms){
  var min = Math.round(ms / 60000);
  if(min < 60) return min + ' min';
  var h = Math.round(min / 60);
  if(h < 36) return h + ' h';
  return Math.round(h / 24) + ' j';
}

/* QUI ATTEND QUI — déduit du SENS du dernier message du fil, pas du statut.
   Le statut dit ce que l'équipe a coché ; le fil dit ce qui s'est passé.
   Seuil de retard : 2 jours. Choix de Réel Média, pas une norme — la
   référence du secteur est une première réponse en ~9 h (Freshservice,
   187 M de tickets), mais une boîte de production n'est pas un support. */
var SEUIL_RETARD_J = 2;

function attente(x){
  if(x.statut === 'Clôturée') return { qui:'fin' };
  if(x.statut === 'Refusée')  return { qui:'fin', refus:true };
  var dernier = x.fil[x.fil.length - 1];
  if(!dernier) return null;
  var depuis = MAINTENANT - new Date(dernier.date);
  var j = Math.floor(depuis / 86400000);
  return {
    qui: dernier.sens === 'Client' ? 'nous' : 'eux',
    duree: duree(depuis),
    jours: j,
    tard: (dernier.sens === 'Client' && j >= SEUIL_RETARD_J)
  };
}

/* Délai de PREMIÈRE RÉPONSE : du premier mot du client au premier mot de
   l'équipe. C'est la mesure que suivent les vraies files, et la seule qui
   dise si on a été correct avec ce client. */
function premiereReponse(x){
  var t0 = null;
  for(var i=0;i<x.fil.length;i++){
    if(x.fil[i].sens === 'Client' && !t0) t0 = new Date(x.fil[i].date);
    if(x.fil[i].sens === 'Réel Média' && t0) return duree(new Date(x.fil[i].date) - t0);
  }
  return null;
}
function dateCourte(iso){
  try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }catch(e){ return ''; }
}
function dateHeure(iso){
  try{
    var d = new Date(iso);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) + ' à ' +
           d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function echeance(iso){
  if(!iso) return null;
  try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }catch(e){ return iso; }
}
/* Champ vide = un tiret discret, JAMAIS une phrase. C'est déjà la
   convention de la liste (.dm-rien), et un panneau qui dirait « pas
   précisé » là où la liste dit « — » ferait parler deux langues à la
   même page. Et une fiche criblée de tirets dit d'elle-même ce qu'il
   faut savoir : le brief est maigre. */
function rien(){ return '<span class="dm-rien">—</span>'; }

function pill(st){
  return '<span class="pill ' + (PILL[st] || 'p-gray') + '">' + esc(st) + '</span>';
}
/* surligne les correspondances — .search-highlight existe déjà dans la maison */
function sur(txt){
  var t = esc(txt);
  if(!rech) return t;
  var re = new RegExp('(' + rech.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
  return t.replace(re,'<span class="search-highlight">$1</span>');
}

function jeu(){ return vue === 'dem' ? DEMANDES : MISSIONS; }

function correspond(x){
  if(!rech) return true;
  var q = rech.toLowerCase();
  var champs = [x.ref, x.marque, x.codeBrand, x.codeCarte, x.demandeur, x.traitePar,
                x.message, x.objet, x.lieu, x.type, TYPE_COURT[x.type], x.statut];
  for(var i=0;i<champs.length;i++){
    if(champs[i] && String(champs[i]).toLowerCase().indexOf(q) !== -1) return true;
  }
  return false;
}

function filtrees(){
  var ordre = vue === 'dem' ? ORDRE_DEM : ORDRE_MIS;
  return jeu()
    .filter(function(x){ return filtre === 'tous' || x.statut === filtre; })
    .filter(correspond)
    .slice()
    .sort(function(a,b){
      var da = ordre[a.statut], db = ordre[b.statut];
      if(da === undefined) da = 99;
      if(db === undefined) db = 99;
      return (da - db) || (a.date < b.date ? 1 : -1);
    });
}

/* ---- le bandeau de filtres ------------------------------------------------ */
function rendFiltres(){
  var liste = vue === 'dem' ? ST_TOUS : ST_MIS;
  var chip = function(actif, couleur, libelle, n, arg){
    return '<button class="sb-filter' + (actif ? ' active' : '') + '" onclick="setFiltre(\'' + arg + '\')">'
         + '<span class="sb-dot" style="background:' + couleur + '"></span>' + esc(libelle)
         + ' <span class="sb-badge">' + n + '</span></button>';
  };
  var h = chip(filtre === 'tous', 'var(--text3)', 'Tous', jeu().filter(correspond).length, 'tous');
  liste.forEach(function(st){
    var n = jeu().filter(function(x){ return x.statut === st; }).filter(correspond).length;
    if(!n && filtre !== st) return;   // un filtre qui ne mène nulle part ne s'affiche pas
    h += chip(filtre === st, couleurDot(st), st, n, st);
  });
  if(filtre !== 'tous' || rech){
    h += '<button class="sb-tout" onclick="toutAfficher()">↺ Tout afficher</button>';
  }
  $('filtres').innerHTML = h;
}

/* Le « ↺ Tout afficher » de Production (index.html:235, #sb-tout). */
function toutAfficher(){
  filtre = 'tous';
  rech = '';
  $('q').value = '';
  $('q-x').hidden = true;
  rendTout();
}
function setFiltre(st){
  filtre = st;
  if(ouvert){
    var enc = filtrees().some(function(x){ return x.id === ouvert; });
    if(!enc) fermer();
  }
  rendTout();
}

/* ---- la liste ------------------------------------------------------------- */
function rendListe(){
  var xs = filtrees();
  if(!xs.length){
    $('liste').innerHTML = '<div class="empty"><h3>Rien à afficher</h3><p>'
      + (rech ? 'Aucun résultat pour « ' + esc(rech) + ' ».' : 'Aucune entrée avec ce statut.')
      + '</p></div>';
    majCompteur(0);
    return;
  }
  $('liste').innerHTML = vue === 'dem' ? tableDemandes(xs) : tableMissions(xs);
  majCompteur(xs.length);
}
function majCompteur(n){
  var bar = $('cntbar');
  if(!bar) return;
  if(!rech){ bar.hidden = true; bar.textContent = ''; return; }
  var mot = vue === 'dem' ? (n > 1 ? 'demandes' : 'demande') : (n > 1 ? 'missions' : 'mission');
  bar.hidden = false;
  bar.textContent = n + ' ' + mot + ' pour « ' + rech + ' »';
}

function tableDemandes(xs){
  var h = '<table class="list-table"><thead><tr>'
    + '<th class="dm-c-ref">Réf</th>'
    + '<th class="dm-c-st">Statut</th>'
    + '<th class="dm-c-age" title="Depuis combien de temps l\'autre attend">Attente</th>'
    + '<th class="dm-c-mq">Marque</th>'
    + '<th class="dm-c-dem">Demandeur</th>'
    + '<th class="dm-c-ty">Type</th>'
    + '<th class="dm-c-ca">Carte</th>'
    + '<th class="dm-c-tr">Traité par</th>'
    + '</tr></thead><tbody>';

  xs.forEach(function(x){
    /* La colonne dit la MÊME chose que la bannière du panneau : depuis
       combien de temps l'autre attend. Un âge depuis la création dirait
       « 9 j » d'une demande réglée en deux heures — et les deux écrans se
       contrediraient. */
    var a = attente(x);
    var cel, tt;
    if(!a || a.qui === 'fin'){
      cel = '<span class="dm-rien">—</span>';
      tt  = 'Terminée · reçue le ' + dateHeure(x.date);
    } else {
      cel = '<span class="dm-age' + (a.tard ? ' tard' : (a.qui === 'nous' ? ' vieux' : '')) + '">' + esc(a.duree) + '</span>';
      tt  = (a.qui === 'nous' ? 'Le client attend notre réponse' : 'On attend le client')
          + ' · reçue le ' + dateHeure(x.date);
    }
    h += '<tr class="' + (ouvert===x.id?'sel':'') + '" title="' + esc(x.message) + '" onclick="ouvrir(\'' + x.id + '\')">'
      +   '<td class="dm-c-ref"><span class="ref">' + sur(x.ref) + '</span></td>'
      +   '<td class="dm-c-st">' + selStatut(x) + '</td>'
      +   '<td class="dm-c-age" title="' + esc(tt) + '">' + cel + '</td>'
      +   '<td class="dm-c-mq" title="' + esc(x.codeBrand) + '"><span class="dm-mq">' + sur(x.marque) + '</span></td>'
      +   '<td class="dm-c-dem">' + sur(x.demandeur) + '</td>'
      +   '<td class="dm-c-ty" title="' + esc(x.type) + '">' + sur(TYPE_COURT[x.type] || x.type) + '</td>'
      +   '<td class="dm-c-ca">' + (x.codeCarte
            ? '<button class="dm-carte" onclick="event.stopPropagation();allerCarte(\'' + esc(x.codeCarte) + '\')">' + sur(x.codeCarte) + ' ↗</button>'
            : '<span class="dm-rien">—</span>') + '</td>'
      +   '<td class="dm-c-tr">' + (x.traitePar ? sur(x.traitePar) : '<span class="dm-rien">—</span>') + '</td>'
      + '</tr>';
  });
  return h + '</tbody></table>';
}

/* Le statut se change EN LIGNE : geste fréquent, réversible, et il garde le
   contexte des rangées voisines. « Clôturée » n'est jamais proposée. */
function selStatut(x){
  if(x.statut === 'Clôturée'){
    return pill('Clôturée');
  }
  var o = ST_EQUIPE.map(function(s){
    return '<option' + (x.statut===s?' selected':'') + '>' + s + '</option>';
  }).join('');
  return '<select class="dm-selst" onclick="event.stopPropagation()" '
       + 'onchange="changeStatut(\'' + x.id + '\',this.value)" '
       + 'aria-label="Statut de la demande de ' + esc(x.marque) + '">' + o + '</select>';
}

function tableMissions(xs){
  var h = '<table class="list-table"><thead><tr>'
    + '<th class="dm-c-ref">Réf</th>'
    + '<th class="dm-c-st">Statut</th>'
    + '<th class="dm-c-age" title="Depuis combien de temps le client attend notre décision">Attente</th>'
    + '<th class="dm-c-mq">Marque</th>'
    + '<th class="dm-c-dem">Demandeur</th>'
    + '<th class="dm-c-msg">Objet</th>'
    + '<th class="dm-c-ty">Pour quand</th>'
    + '<th class="dm-c-tr">Validé par</th>'
    + '</tr></thead><tbody>';

  xs.forEach(function(x){
    /* Une mission n'a pas de fil : ce qu'on attend, c'est notre décision,
       et seulement tant qu'elle est Nouvelle. Une fois décidée, la colonne
       ne prétend pas qu'il reste quelque chose à faire. */
    var att = x.statut === 'Nouvelle';
    var jm = jours(x.date);
    var cel = att
      ? '<span class="dm-age' + (jm >= SEUIL_RETARD_J ? ' tard' : ' vieux') + '">' + esc(duree(MAINTENANT - new Date(x.date))) + '</span>'
      : '<span class="dm-rien">—</span>';
    h += '<tr class="' + (ouvert===x.id?'sel':'') + '" onclick="ouvrir(\'' + x.id + '\')">'
      +   '<td class="dm-c-ref"><span class="ref">' + sur(x.ref) + '</span></td>'
      +   '<td class="dm-c-st">' + pill(x.statut) + '</td>'
      +   '<td class="dm-c-age" title="' + esc((att ? 'Le client attend notre décision' : 'Décidée') + ' · reçue le ' + dateHeure(x.date)) + '">' + cel + '</td>'
      +   '<td class="dm-c-mq" title="' + esc(x.codeBrand) + '"><span class="dm-mq">' + sur(x.marque) + '</span></td>'
      +   '<td class="dm-c-dem">' + sur(x.demandeur) + '</td>'
      +   '<td class="dm-msg dm-c-msg" title="' + esc(x.objet) + '">' + sur(x.objet) + '</td>'
      +   '<td class="dm-c-ty">' + (x.pourQuand ? esc(dateCourte(x.pourQuand)) : '<span class="dm-rien">non fixé</span>') + '</td>'
      +   '<td class="dm-c-tr">' + (x.valideCommercialPar ? sur(x.valideCommercialPar) : '<span class="dm-rien">—</span>') + '</td>'
      + '</tr>';
  });
  return h + '</tbody></table>';
}

/* ---- le panneau de détail ------------------------------------------------- */
function trouver(id){
  var xs = jeu();
  for(var i=0;i<xs.length;i++){ if(xs[i].id === id) return xs[i]; }
  return null;
}
function ouvrir(id){
  ouvert = id;
  $('split').classList.add('ouvert');
  $('pan').hidden = false;
  rendListe();
  rendPanneau();
  if(window.matchMedia('(max-width:1180px)').matches) $('pan').scrollIntoView({block:'start'});
}
function fermer(){
  ouvert = null;
  $('split').classList.remove('ouvert');
  $('pan').hidden = true;
  $('pan').innerHTML = '';
  rendListe();
}

function rendPanneau(){
  var x = trouver(ouvert);
  if(!x){ fermer(); return; }
  $('pan').innerHTML = vue === 'dem' ? panDemande(x) : panMission(x);
}

function panDemande(x){
  var clos = x.statut === 'Clôturée';
  /* L'en-tête ne porte PLUS l'âge : il est devenu la bannière ci-dessous,
     où il veut enfin dire quelque chose. Et la carte n'apparaît qu'une
     fois — elle était en double, dans le méta ET dans la fiche. */
  var h = '<div class="dm-pan-h">'
    + '<div class="dm-pan-t"><h3>' + esc(x.marque) + '</h3>'
    + '<div class="dm-pan-meta">' + pill(x.statut)
    + ' <span class="ref">' + esc(x.ref) + '</span>'
    + (x.codeCarte ? ' <span>·</span> <span>carte ' + esc(x.codeCarte) + '</span>' : '')
    + '</div></div>'
    + '<button class="dm-x" onclick="fermer()" aria-label="Fermer le panneau">×</button></div>';

  h += '<div class="dm-pan-b">';
  h += banniere(x);

  /* LA DEMANDE D'ABORD. Elle a quitté la liste — on ne lit pas dix messages
     tronqués pour en trier un —, donc c'est ICI qu'elle doit sauter aux
     yeux, juste sous la bannière, avant tout le reste. */
  var msg = function(m, ouv){
    var nous = m.sens === 'Réel Média';
    return '<div class="dm-m ' + (nous?'nous':'eux') + (ouv?' ouv':'') + '">'
      +   '<div class="dm-m-h">' + esc(m.auteur) + ' <span>·</span> ' + esc(dateHeure(m.date)) + '</div>'
      +   esc(m.texte)
      + '</div>';
  };

  h += '<div class="dm-sect-t">La demande</div><div class="dm-fil">'
     + msg(x.fil[0], true) + '</div>';

  if(x.fil.length > 1){
    h += '<div class="dm-sect-t" style="margin-top:16px">Les échanges</div><div class="dm-fil">';
    for(var i = 1; i < x.fil.length; i++) h += msg(x.fil[i], false);
    h += '</div>';
  }

  var pr = premiereReponse(x);
  h += '<div class="dm-sect-t" style="margin-top:18px">Détails</div>'
     + '<dl class="dm-fiche bas">'
     + '<dt>Demandeur</dt><dd>' + esc(x.demandeur) + '</dd>'
     + '<dt>Type</dt><dd>' + esc(x.type) + '</dd>'
     + '<dt>Reçue</dt><dd>' + esc(dateHeure(x.date)) + ' <span style="color:var(--text3)">· ' + esc(ageLong(x.date)) + '</span></dd>'
     + '<dt>1<sup>re</sup> réponse</dt><dd>' + (pr ? 'en <b>' + esc(pr) + '</b>' : rien()) + '</dd>'
     + '<dt>Traité par</dt><dd>' + (x.traitePar ? esc(x.traitePar) : rien()) + '</dd>'
     + '</dl>';

  if(clos){
    h += '<div class="dm-note">Le client a clôturé cette demande. On garde le fil en lecture : '
       + 'plus rien ne part de notre côté. S\'il relance, il ouvrira une nouvelle demande.</div>';
  }
  h += '</div>';

  /* La réponse s'écrit ICI, pas dans la rangée : elle est VISIBLE PAR LE
     CLIENT, et une réponse partie par mégarde ne se reprend pas. */
  if(!clos){
    h += '<div class="dm-pan-f">'
      + '<div class="dm-sect-t">Répondre au client</div>'
      + '<textarea class="dm-ta" id="rep" maxlength="' + MAX_REPONSE + '" '
      + 'placeholder="Votre réponse, telle que le client la lira dans son espace…" '
      + 'oninput="compter()" aria-label="Réponse visible par le client"></textarea>'
      + '<div class="dm-ta-pied">'
      +   '<span class="dm-cpt" id="cpt-rep">0 / ' + MAX_REPONSE + '</span>'
      +   '<button class="nav-btn primary" id="btn-rep" onclick="repondre()" disabled>Envoyer la réponse</button>'
      + '</div>'
      + '<div class="dm-prev">Elle apparaîtra dans l\'espace de ' + esc(x.marque)
      + ', signée Réel Média. Changer le statut ci-contre n\'envoie rien.</div>'
      + '</div>';
  }
  return h;
}

function panMission(x){
  var aDecider = x.statut === 'Nouvelle';
  var h = '<div class="dm-pan-h">'
    + '<div class="dm-pan-t"><h3>' + esc(x.objet) + '</h3>'
    + '<div class="dm-pan-meta">' + pill(x.statut)
    + ' <span class="ref">' + esc(x.ref) + '</span>'
    + (x.carteCreee ? ' <span>·</span> <span>carte ' + esc(x.carteCreee) + '</span>' : '')
    + '</div></div>'
    + '<button class="dm-x" onclick="fermer()" aria-label="Fermer le panneau">×</button></div>';

  h += '<div class="dm-pan-b">';

  /* Même logique qu'une demande, mais une mission n'a pas de fil : ce qu'on
     attend, c'est une DÉCISION de notre côté tant qu'elle est Nouvelle. */
  var jm = jours(x.date);
  if(x.statut === 'Nouvelle'){
    h += '<div class="dm-att ' + (jm >= SEUIL_RETARD_J ? 'tard' : 'nous') + '">'
       + '<span class="ic">▲</span><span>Le client attend <b>notre décision</b> depuis <b>'
       + esc(duree(MAINTENANT - new Date(x.date))) + '</b>.</span></div>';
  } else if(x.statut === 'Refusée'){
    h += '<div class="dm-att fin"><span class="ic">●</span><span>Mission <b>refusée</b>. '
       + 'Le motif est parti au client.</span></div>';
  } else {
    h += '<div class="dm-att eux"><span class="ic">○</span><span>Acceptée. '
       + (x.carteCreee ? 'La carte <b>' + esc(x.carteCreee) + '</b> existe.' : 'La carte reste à créer.')
       + '</span></div>';
  }

  h += '<dl class="dm-fiche">'
     + '<dt>Marque</dt><dd>' + esc(x.marque) + '</dd>'
     + '<dt>Demandeur</dt><dd>' + esc(x.demandeur) + '</dd>'
     + '<dt>Pour quand</dt><dd>' + (echeance(x.pourQuand) ? esc(echeance(x.pourQuand)) : rien()) + '</dd>'
     + '<dt>Lieu</dt><dd>' + (x.lieu ? esc(x.lieu) : rien()) + '</dd>'
     + '<dt>À interviewer</dt><dd>' + (x.personnes ? esc(x.personnes) : rien()) + '</dd>'
     + '<dt>Sur place</dt><dd>' + (x.contactSurPlace ? esc(x.contactSurPlace) : rien()) + '</dd>'
     + '<dt>Type de film</dt><dd>' + (x.sousFormat ? esc(x.sousFormat) : rien()) + '</dd>'
     + '<dt>Format image</dt><dd>' + ((x.formatImage && x.formatImage.length) ? esc(x.formatImage.join(' et ')) : rien()) + '</dd>'
     + '<dt>Diffusion</dt><dd>' + ((x.plateforme && x.plateforme.length) ? esc(x.plateforme.join(', ')) : rien()) + '</dd>'
     + '<dt>Reçue</dt><dd>' + esc(dateHeure(x.date)) + ' <span style="color:var(--text3)">· ' + esc(ageLong(x.date)) + '</span></dd>'
     + '</dl>';

  if(x.reponse){
    h += '<div class="dm-sect-t">Notre réponse</div>'
       + '<div class="dm-m nous" style="margin-left:0">'
       + '<div class="dm-m-h">' + esc(x.valideCommercialPar || 'Réel Média') + '</div>'
       + esc(x.reponse) + '</div>';
  }

  h += '<div class="dm-note"><b>Diffusion et format image sont vides en production aujourd\'hui</b> — '
     + 'missions-admin.js lit <code>_sel</code> sur <code>Plateforme</code>, qui est un multi-select. '
     + 'Même famille que le bug d\'écriture de mission-client.js:126. À corriger ensemble.</div>';
  h += '</div>';

  /* Missions : le serveur n'offre qu'accepter | refuser (+ motif). Pas de
     liste déroulante de statut — elle serait un mensonge. */
  if(aDecider){
    h += '<div class="dm-pan-f">'
      + '<div class="dm-sect-t">Décision commerciale</div>'
      + '<textarea class="dm-ta" id="motif" maxlength="' + MAX_REPONSE + '" '
      + 'placeholder="Un mot pour le client. Obligatoire si vous refusez…" '
      + 'oninput="compterMotif()" aria-label="Motif, visible par le client"></textarea>'
      + '<div class="dm-ta-pied">'
      +   '<span class="dm-cpt" id="cpt-motif">0 / ' + MAX_REPONSE + '</span>'
      +   '<div class="dm-dec">'
      +     '<button class="nav-btn" id="btn-ref" onclick="decider(\'refuser\')">Refuser</button>'
      +     '<button class="nav-btn primary" onclick="decider(\'accepter\')">Accepter</button>'
      +   '</div>'
      + '</div>'
      + '<div class="dm-prev">Accepter passe la mission à <b>Acceptée</b>. La carte se crée ensuite, '
      + 'depuis le bouton « Créer la carte », qui pré-remplit le formulaire Nouveau sujet.</div>'
      + '</div>';
  }
  return h;
}

/* ---- gestes --------------------------------------------------------------- */
function compter(){
  var t = $('rep'); if(!t) return;
  var n = t.value.length;
  var c = $('cpt-rep'), b = $('btn-rep');
  if(c){ c.textContent = n + ' / ' + MAX_REPONSE; c.classList.toggle('trop', n >= MAX_REPONSE); }
  if(b) b.disabled = (t.value.trim().length === 0);
}
function compterMotif(){
  var t = $('motif'); if(!t) return;
  var n = t.value.length;
  var c = $('cpt-motif');
  if(c){ c.textContent = n + ' / ' + MAX_REPONSE; c.classList.toggle('trop', n >= MAX_REPONSE); }
}

function changeStatut(id, st){
  var x = trouver(id);
  if(!x) return;
  x.statut = st;
  /* Le serveur estampille « Traité par » tout seul au premier changement
     (demandes-admin.js:65). On le montre pour que ce soit lisible ici. */
  if(!x.traitePar) x.traitePar = 'Vous';
  rendTout();
  if(ouvert === id) rendPanneau();
}

function repondre(){
  var x = trouver(ouvert);
  var t = $('rep');
  if(!x || !t || !t.value.trim()) return;
  x.fil.push({ sens:'Réel Média', auteur:'Vous', date:new Date().toISOString(), texte:t.value.trim() });
  if(x.statut === 'Nouvelle') x.statut = 'En cours';
  if(!x.traitePar) x.traitePar = 'Vous';
  rendTout();
  rendPanneau();
}

function decider(quoi){
  var x = trouver(ouvert);
  if(!x) return;
  var t = $('motif');
  var motif = t ? t.value.trim() : '';
  if(quoi === 'refuser' && !motif){
    if(t){ t.focus(); t.style.borderColor = 'var(--red)'; }
    return;
  }
  x.statut = (quoi === 'accepter') ? 'Acceptée' : 'Refusée';
  x.valideCommercialPar = 'Vous';
  if(motif) x.reponse = motif;
  rendTout();
  rendPanneau();
}

function allerCarte(code){
  /* En production : ouvre la carte du sujet. Le lien existe déjà dans la
     modale actuelle (.dem-carte-lnk). */
  alert('Ouvrirait la carte ' + code + ' dans Production.');
}

/* ---- onglets et recherche ------------------------------------------------- */
function onglet(v){
  if(vue === v) return;
  vue = v;
  filtre = 'tous';
  ouvert = null;
  $('split').classList.remove('ouvert');
  $('pan').hidden = true;
  $('pan').innerHTML = '';
  $('t-dem').classList.toggle('active', v === 'dem');
  $('t-mis').classList.toggle('active', v === 'mis');
  $('t-dem').setAttribute('aria-selected', v === 'dem' ? 'true' : 'false');
  $('t-mis').setAttribute('aria-selected', v === 'mis' ? 'true' : 'false');
  rendTout();
  window.scrollTo(0, 0);
}

function chercher(v){
  rech = String(v || '').trim();
  $('q-x').hidden = !rech;
  if(ouvert){
    var enc = filtrees().some(function(x){ return x.id === ouvert; });
    if(!enc) fermer();
  }
  rendTout();
}
function viderRech(){
  rech = '';
  $('q').value = '';
  $('q-x').hidden = true;
  rendTout();
  $('q').focus();
}

/* ---- pastilles ------------------------------------------------------------ */
function rendPastilles(){
  var nd = DEMANDES.filter(function(x){ return x.statut === 'Nouvelle'; }).length;
  var nm = MISSIONS.filter(function(x){ return x.statut === 'Nouvelle'; }).length;
  maj($('t-dem-n'), nd);
  maj($('t-mis-n'), nm);
  maj($('sb-badge'), nd + nm);
}
function maj(el, n){
  if(!el) return;
  el.textContent = n;
  el.hidden = (n === 0);
}

function rendTout(){
  rendFiltres();
  rendListe();
  rendPastilles();
}

rendTout();
</script>
